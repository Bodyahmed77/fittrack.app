<?xml version="1.0" encoding="UTF-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3182ce" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
  </defs>
  <!-- body in straight plank -->
  <path d="M70 90 L100 70 L140 86 L140 98 L100 84 Z" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="60" cy="98" r="14" fill="url(#skin)" />
  <!-- arms straight on forearms -->
  <rect x="58" y="112" width="22" height="8" rx="4" fill="url(#skin)" />
  <rect x="40" y="118" width="20" height="8" rx="4" fill="#2d3748" />
  <!-- legs -->
  <path
    d="M140 92 L168 100 L168 108"
    fill="none"
    stroke="#2d3748"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- feet -->
  <rect x="160" y="106" width="22" height="8" rx="4" fill="#2d3748" />
  <!-- floor -->
  <rect x="30" y="150" width="140" height="6" rx="3" fill="#4a5568" />
</svg>
