<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53e3e" />
      <stop offset="100%" stop-color="#c53030" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- parallel bars -->
  <rect x="30" y="40" width="140" height="10" rx="5" fill="url(#bar)" />
  <rect x="38" y="50" width="8" height="120" rx="4" fill="#718096" />
  <rect x="154" y="50" width="8" height="120" rx="4" fill="#718096" />
  <!-- body hanging between bars -->
  <rect x="72" y="60" width="56" height="52" rx="12" fill="url(#shirt)" />
  <!-- arms on bars -->
  <path
    d="M76 66 L52 52 L44 44"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M124 66 L148 52 L156 44"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands grabbing bars -->
  <circle cx="44" cy="44" r="8" fill="url(#skin)" />
  <circle cx="156" cy="44" r="8" fill="url(#skin)" />
  <!-- head -->
  <circle cx="100" cy="46" r="15" fill="url(#skin)" />
  <!-- legs -->
  <rect x="82" y="112" width="15" height="58" rx="5" fill="#2d3748" />
  <rect x="103" y="112" width="15" height="58" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="176" width="26" height="9" rx="4" fill="#2d3748" />
  <rect x="98" y="176" width="26" height="9" rx="4" fill="#2d3748" />
</svg>
