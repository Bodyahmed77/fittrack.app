name: Apply Play Readiness Patch

on:
  push:
    branches: [fix/play-readiness-p0-p1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/play-readiness-p0-p1
          fetch-depth: 0

      - name: Patch App and AI Coach
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text()

          if 'import { deleteAccountServerData } from "./deleteAccount";' not in text:
              needle = 'import { APP_INFO, PRIVACY_POLICY_SECTIONS, TERMS_SECTIONS } from "./privacy";'
              repl = needle + '\nimport { deleteAccountServerData } from "./deleteAccount";'
              if needle not in text:
                  raise SystemExit('privacy import anchor not found')
              text = text.replace(needle, repl, 1)

          old = '''      if (firebaseUser?.uid) {
        await deleteDoc(doc(db, "users", firebaseUser.uid));
      }
      if (firebaseUser) {
        await deleteUser(firebaseUser);
      }'''
          new = '''      // Remove server-side Supabase data first. If this fails, keep the
      // Firebase account intact so the user can retry instead of leaving
      // orphaned entitlement/purchase/AI-usage records behind.
      await deleteAccountServerData();
      if (firebaseUser?.uid) {
        await deleteDoc(doc(db, "users", firebaseUser.uid));
      }
      if (firebaseUser) {
        await deleteUser(firebaseUser);
      }'''
          if old not in text:
              if 'await deleteAccountServerData();' not in text:
                  raise SystemExit('delete account anchor not found')
          else:
              text = text.replace(old, new, 1)

          old_settings = '  const pro = data.entitlements.trainingPro || data.entitlements.nutritionPro;\n  const setTheme = (mode) => {'
          new_settings = '  const pro =\n    data.entitlements.trainingPro ||\n    data.entitlements.nutritionPro ||\n    data.entitlements.aiCoachPro;\n  const setTheme = (mode) => {'
          if old_settings in text:
              text = text.replace(old_settings, new_settings, 1)
          elif 'data.entitlements.aiCoachPro;' not in text:
              raise SystemExit('settings pro anchor not found')

          app.write_text(text)

          ai = Path('supabase/functions/ai-coach/index.ts')
          text = ai.read_text()
          old_date = '''    const localDate =
      typeof body.localDate === "string" && /^\\d{4}-\\d{2}-\\d{2}$/.test(body.localDate as string)
        ? (body.localDate as string)
        : new Date().toISOString().slice(0, 10);'''
          new_date = '''    // The daily quota date is server-controlled. Never trust a client-supplied
    // date because changing it would let a user obtain a fresh quota early.
    const localDate = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Africa/Cairo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).format(new Date());'''
          if old_date in text:
              text = text.replace(old_date, new_date, 1)
          elif 'const localDate = new Intl.DateTimeFormat("en-CA"' not in text:
              raise SystemExit('AI date anchor not found')
          ai.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx supabase/functions/ai-coach/index.ts
          if git diff --cached --quiet; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git commit -m 'fix: close account deletion and AI quota bypasses'
          git push origin HEAD:fix/play-readiness-p0-p1
