name: Validate Fifty Fit PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production invariants
        run: python3 scripts/validate-production-invariants.py

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate JavaScript syntax
        run: |
          node --check src/googleAuth.js
          node --check src/billing.js
          node --check src/registerPurchase.js

      - name: Build web application
        run: npm run build
