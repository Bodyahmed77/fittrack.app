name: Finalize TikTok release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize TikTok IDs and harden unavailable-video UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import json, re

          cfg = Path('src/config.js')
          text = cfg.read_text(encoding='utf-8')
          short_links = {
              'treadmill': 'https://vt.tiktok.com/ZS4T2HfCY/',
              'bike': 'https://vt.tiktok.com/ZS4T249MW/',
              'burpees': 'https://vt.tiktok.com/ZS4TjS16a/',
          }
          for key, url in short_links.items():
              try:
                  api = 'https://www.tiktok.com/oembed?url=' + quote(url, safe='')
                  req = Request(api, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'})
                  with urlopen(req, timeout=20) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                  html = data.get('html', '')
                  m = re.search(r'data-video-id=[\"\'](\d+)[\"\']', html)
                  if not m:
                      m = re.search(r'/video/(\d+)', str(data))
                  if not m:
                      raise RuntimeError('oEmbed response did not expose a post ID')
                  post_id = m.group(1)
                  text = re.sub(rf'(\s+{re.escape(key)}:\s+")[^\"]+("[,])', rf'\1{post_id}\2', text)
                  print(f'{key} -> {post_id}')
              except Exception as exc:
                  raise SystemExit(f'Failed to normalize {key}: {exc}')

          # Normalize the known direct TikTok links to canonical numeric IDs.
          direct = {
            'bench_press':'7603190204740013313','incline_db_press':'7267987124610239762',
            'tricep_pushdown':'7586888221125070094','zigzag_tricep_ext':'7586888221125070094',
            'overhead_ext':'7527210325834206486','lat_pulldown':'7665886081329532174',
            'barbell_row':'7532789627212631314','seated_row':'7639010632561478934',
            'single_arm_seated_row':'7639010632561478934','bicep_curl':'7636460964870720788',
            'behind_body_bicep_curl':'7636460964870720788','hammer_curl':'7623849292461051156',
            'supported_db_curl':'7636460964870720788','squat':'7513352117692665094',
            'hack_squat':'7513352117692665094','leg_press':'7545454872586423574',
            'leg_extension':'7564750740061752598','abduction':'7419086233487281415',
            'reverse_curl':'7214952400631778566','face_pull':'7474058570451946757',
            'lunges':'7353289956699229472','leg_curl':'7521556521390460166',
            'calf_raise':'7602285498962349342','ohp':'7663674671677705488',
            'lateral_raise':'7486685939025054981','rear_delt_fly':'7630410819259387158',
            'shrugs':'7500002250526395653','deadlift':'7380964646062263558',
            'crunches':'7654453038815399171','jump_rope':'7358498825012661537'
          }
          for key, value in direct.items():
              text = re.sub(rf'(\s+{re.escape(key)}:\s+")[^\"]+("[,])', rf'\1{value}\2', text)
          cfg.write_text(text, encoding='utf-8')

          app = Path('src/App.jsx')
          app_text = app.read_text(encoding='utf-8')
          # Never fall back to a YouTube URL for a TikTok source whose ID is missing.
          old = '  const tikTokPostId = getTikTokPostId(videoId);\n  const embedSrc = tikTokPostId\n    ? `https://www.tiktok.com/player/v1/${tikTokPostId}?autoplay=1&controls=1&progress_bar=1&play_button=1&volume_control=1&fullscreen_button=1&timestamp=1&music_info=0&description=0&rel=0&native_context_menu=0`\n    : `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;'
          new = '  const isTikTok = isTikTokVideoRef(videoId);\n  const tikTokPostId = getTikTokPostId(videoId);\n  const unsupportedTikTok = isTikTok && !tikTokPostId;\n  const embedSrc = tikTokPostId\n    ? `https://www.tiktok.com/player/v1/${tikTokPostId}?autoplay=1&controls=1&progress_bar=1&play_button=1&volume_control=1&fullscreen_button=1&timestamp=1&music_info=0&description=0&rel=0&native_context_menu=0`\n    : `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;'
          if old not in app_text:
              raise SystemExit('player state anchor missing')
          app_text = app_text.replace(old, new, 1)
