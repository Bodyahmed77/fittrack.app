name: Fifty Fit launch polish

on:
  push:
    branches:
      - fix/fifty-fit-launch-polish
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply launch fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              '    const handles = [];\n\n    const setInset = (px) => {',
              '    const handles = [];\n    let vv = null;\n    let onVv = null;\n\n    const setInset = (px) => {',
              1,
          )
          text = text.replace('      const vv = window.visualViewport;\n', '      vv = window.visualViewport;\n', 1)
          text = text.replace('      const onVv = () => {\n', '      onVv = () => {\n', 1)
          text = text.replace(
              '            padding: "10px 12px calc(12px + env(safe-area-inset-bottom))",',
              '            padding: keyboardInset > 0 ? "10px 12px 6px" : "10px 12px max(8px, env(safe-area-inset-bottom))",',
              1,
          )
          text = text.replace(
              '            background: C.bg,\n            flexShrink: 0,\n          }}\n        >\n          <input\n',
              '            background: C.bg,\n            flexShrink: 0,\n            minHeight: keyboardInset > 0 ? 58 : 62,\n          }}\n        >\n          <input\n',
              1,
          )

          marker = '''function weekdayOf(iso) {\n  const js = new Date(iso + "T00:00:00").getDay();\n  return DAYS[js === 0 ? 6 : js - 1];\n}\n'''
          helper = marker + '''\n// Map a calendar date to the user's position in the active plan. A new user\n// always starts on Day 1 (the plan's Mon slot) on their first program date,\n// regardless of the weekday they created the account.\nfunction planDayForDate(data, iso = dateKey(0)) {\n  const start = data?.workoutStartDate;\n  if (!start || iso < start) return weekdayOf(iso);\n  const startMs = new Date(start + "T00:00:00").getTime();\n  const targetMs = new Date(iso + "T00:00:00").getTime();\n  const diff = Math.floor((targetMs - startMs) / 86400000);\n  if (!Number.isFinite(diff) || diff < 0) return weekdayOf(iso);\n  return DAYS[diff % DAYS.length];\n}\n'''
          if marker in text and 'function planDayForDate' not in text:
              text = text.replace(marker, helper, 1)

          old = '''function dayStatus(data, dayName, targetDate = dateForDay(dayName)) {\n  const exercises = getUsableExercises(data, dayName).list;\n  if (exercises.length === 0) return "rest";\n  if (isDayCompleted(data, dayName, targetDate)) return "done";'''
          new = '''function dayStatus(data, dayName, targetDate = dateForDay(dayName)) {\n  const planDay = planDayForDate(data, targetDate);\n  const exercises = getUsableExercises(data, planDay).list;\n  if (exercises.length === 0) return "rest";\n  if (isDayCompleted(data, planDay, targetDate)) return "done";'''
          text = text.replace(old, new, 1)

          old_active = '''function activeTrainingDay(data) {\n  for (let offset = 0; offset < DAYS.length; offset += 1) {\n    const day = DAYS[(todayIdx + offset) % DAYS.length];\n    if (getUsableExercises(data, day).list.length === 0) continue;\n    if (offset === 0 && isDayCompleted(data, day)) continue;\n    return day;\n  }\n  return DAYS[todayIdx];\n}'''
          new_active = '''function activeTrainingDay(data) {\n  const today = dateKey(0);\n  for (let offset = 0; offset < DAYS.length; offset += 1) {\n    const iso = addDays(today, offset);\n    const day = planDayForDate(data, iso);\n    if (getUsableExercises(data, day).list.length === 0) continue;\n    if (offset === 0 && isDayCompleted(data, day, iso)) continue;\n    return day;\n  }\n  return planDayForDate(data, today);\n}'''
          text = text.replace(old_active, new_active, 1)

          text = text.replace(
              '  const dayName = DAYS[todayIdx];\n  const activePlan =\n',
              '  const dayName = planDayForDate(data, dateKey(0));\n  const activePlan =\n',
              1,
          )
          text = text.replace(
              '      setSelectedDay(weekdayOf(iso));\n',
              '      setSelectedDay(planDayForDate(data, iso));\n',
              1,
          )
          text = text.replace(
              '            const d = weekdayOf(iso);\n',
              '            const calendarDay = weekdayOf(iso);\n            const d = planDayForDate(data, iso);\n',
              1,
          )
          text = text.replace(
              '            const isActiveDay = d === activeDay && iso === dateForDay(activeDay);\n',
              '            const isActiveDay = d === activeDay && iso >= (data.workoutStartDate || iso);\n',
              1,
          )
          text = text.replace('{ar ? DAY_LABELS_AR[d] : d}', '{ar ? DAY_LABELS_AR[calendarDay] : calendarDay}', 1)
          text = text.replace(
              '      setSelectedDay(weekdayOf(todayIso));\n',
              '      setSelectedDay(planDayForDate(data, todayIso));\n',
          )

          text = text.replace(
              '          boxShadow: "0 0 40px rgba(0,0,0,0.35)",\n',
              '          boxShadow: "0 0 40px rgba(0,0,0,0.35)",\n          overscrollBehavior: "contain",\n',
              1,
          )
          text = text.replace(
              '          src={embedSrc}\n          title={ar ? "فيديو التمرين" : "Exercise video"}',
              '          src={embedSrc}\n          loading="eager"\n          fetchPriority="high"\n          title={ar ? "فيديو التمرين" : "Exercise video"}',
              1,
          )

          if text == original:
              raise SystemExit('No App.jsx changes were applied; aborting.')
          app.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          if 'https://www.tiktok.com' not in html:
              html = html.replace(
                  '    <meta name="theme-color" content="#0b0d10" />\n',
                  '    <meta name="theme-color" content="#0b0d10" />\n    <link rel="preconnect" href="https://www.tiktok.com" crossorigin />\n',
                  1,
              )
          index.write_text(html, encoding='utf-8')
          PY

      - name: Repair and validate dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Commit polished app
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx index.html package-lock.json
          git diff --cached --check
          git commit -m "fix: harden AI keyboard, crash, plan start, video loading, and lockfile" || exit 0
          git push origin HEAD:${{ github.head_ref }}
          git rm .github/workflows/fifty-fit-polish.yml
          git commit -m "chore: remove temporary polish workflow"
          git push origin HEAD:${{ github.head_ref }}
