name: Apply release fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'chore: apply release fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: node scripts/apply-release-fixes.mjs
      - name: Commit fixes and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx admin/app.js firestore.rules scripts/apply-release-fixes.mjs .github/workflows/apply-release-fixes.yml
          git rm .github/workflows/apply-release-fixes.yml
          git commit -m 'chore: apply release fixes'
          git push
