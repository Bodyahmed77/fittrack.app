name: Build Android App Bundle

# Runs on GitHub's own cloud computers — nothing installs on your machine.
# Trigger it manually from the "Actions" tab in your GitHub repo, or every
# time you push to the "main" branch.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (needed by Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Add the Android platform
        run: npx cap add android || npx cap sync android

      - name: Generate real app icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # --- Signing -------------------------------------------------------
      # These four values come from GitHub repo Settings → Secrets and
      # variables → Actions → New repository secret. See SIGNING_SETUP.md
      # in this project for exactly what to generate and paste in.
      - name: Decode the signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build the signed release App Bundle (for Google Play)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Build a signed release APK (for testing directly on your phone)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload the App Bundle (upload this one to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload the APK (install this one directly on your phone to test)
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
