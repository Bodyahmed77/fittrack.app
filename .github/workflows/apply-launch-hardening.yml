name: One-time launch hardening patch

on:
  push:
    branches:
      - fix/account-deletion-cleanup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted App.jsx fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/App.jsx")
          text = path.read_text(encoding="utf-8")
          old_import = 'import { registerServerEntitlement } from "./registerPurchase";'
          new_import = old_import + '\nimport { deleteAccountServerData } from "./deleteAccount";'
          if old_import not in text: raise SystemExit("registerPurchase import not found")
          if 'from "./deleteAccount"' not in text: text = text.replace(old_import, new_import, 1)
          old_delete = '''      // Delete the application document only after recent authentication
      // succeeds, so a failed account deletion does not orphan user data.
      if (firebaseUser?.uid) {
        await deleteDoc(doc(db, "users", firebaseUser.uid));
      }'''
          new_delete = '''      // Clean Supabase server-side records first. If this fails, keep the
      // Firebase account and Firestore profile intact so deletion is retryable.
      await deleteAccountServerData();

      // Delete the application document only after recent authentication and
      // server-side cleanup succeed.
      if (firebaseUser?.uid) {
        await deleteDoc(doc(db, "users", firebaseUser.uid));
      }'''
          if old_delete not in text: raise SystemExit("account deletion block not found")
          text = text.replace(old_delete, new_delete, 1)
          old_pro = '  const pro = data.entitlements.trainingPro || data.entitlements.nutritionPro;'
          new_pro = '  const pro =\n    data.entitlements.trainingPro ||\n    data.entitlements.nutritionPro ||\n    data.entitlements.aiCoachPro;'
          if old_pro not in text: raise SystemExit("settings pro expression not found")
          text = text.replace(old_pro, new_pro, 1)
          old_manage = '''          <Card
            onClick={() => go("paywall")}
            style={{ display: "flex", alignItems: "center", gap: 12 }}
          >'''
          new_manage = '''          <Card
            onClick={() => {
              window.open("https://play.google.com/store/account/subscriptions", "_blank", "noopener,noreferrer");
            }}
            style={{ display: "flex", alignItems: "center", gap: 12 }}
          >'''
          if old_manage not in text: raise SystemExit("manage subscription card not found")
          text = text.replace(old_manage, new_manage, 1)
          old_label = '{ar ? "إدارة الاشتراك" : "Manage Subscription"}'
          new_label = '{ar ? "إدارة / إلغاء الاشتراك" : "Manage / Cancel Subscription"}'
          if old_label not in text: raise SystemExit("manage subscription label not found")
          text = text.replace(old_label, new_label, 1)
          path.write_text(text, encoding="utf-8")
      - name: Validate targeted changes
        run: |
          grep -q 'from "./deleteAccount"' src/App.jsx
          grep -q 'deleteAccountServerData();' src/App.jsx
          grep -q 'Manage / Cancel Subscription' src/App.jsx
          grep -q 'aiCoachPro' src/App.jsx
          git diff --check
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-launch-hardening.yml
          git add src/App.jsx
          git commit -m "fix: complete account deletion and subscription management"
          git push
