<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#805ad5" />
      <stop offset="100%" stop-color="#6b46c1" />
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- machine frame -->
  <rect x="18" y="40" width="10" height="120" rx="5" fill="#718096" />
  <rect x="172" y="40" width="10" height="120" rx="5" fill="#718096" />
  <rect x="14" y="36" width="172" height="10" rx="5" fill="url(#machine)" />
  <!-- handles (chest fly arms) -->
  <path
    d="M30 70 L70 90 L70 100"
    fill="none"
    stroke="url(#machine)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M170 70 L130 90 L130 100"
    fill="none"
    stroke="url(#machine)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- seat -->
  <rect x="80" y="150" width="40" height="10" rx="5" fill="#2d3748" />
  <!-- body -->
  <rect x="66" y="90" width="68" height="40" rx="10" fill="url(#shirt)" />
  <!-- arms extended out to handles -->
  <path
    d="M72 100 L56 92 L38 76"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M128 100 L144 92 L162 76"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="38" cy="76" r="8" fill="url(#skin)" />
  <circle cx="162" cy="76" r="8" fill="url(#skin)" />
  <!-- head -->
  <circle cx="100" cy="76" r="14" fill="url(#skin)" />
  <!-- legs -->
  <rect x="78" y="150" width="14" height="20" rx="4" fill="#2d3748" />
  <rect x="108" y="150" width="14" height="20" rx="4" fill="#2d3748" />
  <!-- feet -->
  <rect x="72" y="182" width="24" height="8" rx="4" fill="#2d3748" />
  <rect x="104" y="182" width="24" height="8" rx="4" fill="#2d3748" />
</svg>
