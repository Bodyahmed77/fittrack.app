name: Deploy Fifty Fit Web Demo

on:
  push:
    branches: [main, fix/launch-billing-ai-final]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vite.release.config.js'
      - '.github/workflows/deploy-web-demo.yml'
      - 'admin/**'
  workflow_dispatch:

concurrency:
  group: fiftyfit-web-demo
  cancel-in-progress: true

env:
  VITE_WEB_DEMO: '1'

jobs:
  smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current demo source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build demo app
        run: VITE_WEB_DEMO=1 npm run build

      - name: Keep admin dashboard in Pages artifact
        run: rm -rf dist/admin && cp -R admin dist/admin

      - name: Validate generated web demo output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/admin/index.html
          test -d dist/assets
          grep -R "FIFTYFIT_WEB_DEMO" dist/assets --include='*.js' >/dev/null
          cp dist/index.html dist/404.html
          test -f dist/404.html
          echo "Web demo artifact structure and demo marker validated"

      - name: Smoke-test demo in a real headless browser
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/fiftyfit-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom 'http://127.0.0.1:4173/?demo=1' > /tmp/fiftyfit-demo-dom.html
          if grep -q 'data-fiftyfit-demo-runtime-error="1"' /tmp/fiftyfit-demo-dom.html; then
            echo 'Web demo App runtime error detected:'
            cat /tmp/fiftyfit-demo-dom.html
            echo 'Vite preview log:'
            cat /tmp/fiftyfit-vite-preview.log
            exit 1
          fi
          grep -q "Demo Athlete" /tmp/fiftyfit-demo-dom.html
          if grep -q "Something went wrong" /tmp/fiftyfit-demo-dom.html; then
            echo "Web demo ErrorBoundary rendered unexpectedly"
            cat /tmp/fiftyfit-demo-dom.html
            cat /tmp/fiftyfit-vite-preview.log
            exit 1
          fi
          echo "Web demo runtime smoke test passed"

  deploy:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build demo app for Pages
        run: VITE_WEB_DEMO=1 npm run build

      - name: Keep admin dashboard in Pages artifact
        run: rm -rf dist/admin && cp -R admin dist/admin

      - name: Add GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
