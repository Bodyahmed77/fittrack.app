name: Verify Release Keystore Fingerprints

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode release keystore and print fingerprints
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}"
          echo "$KS_B64" | base64 -d > release.keystore
          test -s release.keystore
          keytool -list -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" 2>/dev/null \
            | awk '/Owner:/{print; next} /SHA1:/{print; next} /SHA256:/{print; next}'
