name: Apply cardio timer patch

on:
  push:
    branches:
      - feat/cardio-timer

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply-cardio-patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: python3 scripts/patch_cardio_timer.py

      - name: Build web app
        run: npm run build

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/config.js admin/cardio.js scripts/patch_cardio_timer.py .github/workflows/apply-cardio-patch.yml
          git rm -f scripts/patch_cardio_timer.py .github/workflows/apply-cardio-patch.yml
          git commit -m "chore: apply cardio timer patch"
          git push origin HEAD:feat/cardio-timer
