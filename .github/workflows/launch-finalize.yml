name: Finalize launch branch

on:
  push:
    branches: [fix/play-readiness-p0-p1]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply final launch hardening
        run: python3 scripts/launch-finalize.py

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase functions
        run: |
          set -euo pipefail
          for f in supabase/functions/*/index.ts; do
            [ -f "$f" ] || continue
            deno check "$f"
          done
