name: Repair onboarding persistence before release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Apply onboarding persistence repair
        run: python3 scripts/fix-onboarding-persistence.py

      - name: Persist repair if source changed
        run: |
          set -euo pipefail
          if git diff --quiet -- src/App.jsx; then
            echo "Onboarding persistence repair already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: prevent Firestore snapshot from resetting onboarding [skip ci]"
          git push origin HEAD:main
