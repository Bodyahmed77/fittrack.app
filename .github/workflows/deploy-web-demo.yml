name: Deploy Fifty Fit Web Demo

on:
  push:
    branches: [main]
    paths:
      - 'web-demo/**'
      - 'vite.webdemo.config.js'
      - '.github/workflows/deploy-web-demo.yml'
      - 'admin/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-demo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install build tooling
        run: npm ci --ignore-scripts

      - name: Build isolated web demo
        run: npm exec vite -- --config vite.webdemo.config.js

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          test -s dist-web-demo/index.html
          test -d dist-web-demo/assets || true
          rm -rf dist-web-demo/admin
          cp -R admin dist-web-demo/admin
          cp dist-web-demo/index.html dist-web-demo/404.html

      - name: Validate demo artifact
        run: |
          set -euo pipefail
          test -s dist-web-demo/index.html
          test -s dist-web-demo/404.html
          test -s dist-web-demo/admin/index.html
          grep -q "Fifty Fit" dist-web-demo/index.html
          grep -q "Fifty Fit" dist-web-demo/assets/*.js
          ! grep -R -E "firebase|firestore|capacitor|billing|googleapis" dist-web-demo/assets/*.js >/dev/null
          echo "Isolated web demo artifact validated"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-web-demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
