name: Build Fifty Fit Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: tools platform-tools
      - name: Install Android SDK API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts
      - name: Restore sharp native runtime
        run: |
          set -euo pipefail
          npm rebuild sharp --foreground-scripts
          node -e "require('sharp'); console.log('sharp native runtime OK')"
      - name: Keep Google Sign-In native diagnostics
        run: python3 scripts/apply-google-native-diagnostics.py
      - name: Remove legacy capacitor-billing runtime
        run: |
          set -euo pipefail
          rm -rf node_modules/capacitor-billing
          test ! -d node_modules/capacitor-billing
          echo 'Legacy capacitor-billing runtime removed; FiftyFitBilling is the only release billing implementation.'
      - name: Validate source entrypoints
        run: |
          set -euo pipefail
          node --check src/googleAuth.js
          node --check src/billing.js
          node --check src/fiftyFitBilling.js
          python3 - <<'PY'
          from pathlib import Path
          billing = Path('src/billing.js').read_text(encoding='utf-8')
          native_js = Path('src/fiftyFitBilling.js').read_text(encoding='utf-8')
          assert 'from "./fiftyFitBilling"' in billing
          assert 'FIFTYFIT_NATIVE_BILLING_V7' in native_js
          assert 'NATIVE_BILLING_CONNECTION_TIMEOUT' in native_js
          assert 'NATIVE_PRODUCT_QUERY_TIMEOUT' in native_js
          assert 'NATIVE_PURCHASE_QUERY_TIMEOUT' in native_js
          assert 'NATIVE_PURCHASE_FLOW_TIMEOUT' in native_js
          assert 'PURCHASE_FLOW_TIMEOUT' in billing
          print('First-party Billing static entrypoint and timeout guards validated')
          PY
      - name: Unlock Pro when Play ack is still pending
        run: python3 scripts/patch-register-purchase-ack.py
      - name: Build web application
        run: npm run build
      - name: Ensure Android platform exists
        run: |
          set -euo pipefail
          if [ ! -d android ]; then npx cap add android; else echo 'Android platform already present.'; fi
      - name: Inject google-services.json and validate Firebase package
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}" || { echo 'GOOGLE_SERVICES_JSON_BASE64 secret is missing'; exit 1; }
          mkdir -p android/app
          printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('android/app/google-services.json').read_text(encoding='utf-8'))
          assert data.get('project_info', {}).get('project_id') == 'fittrack-698fa'
          matches = [c for c in data.get('client', []) if ((c.get('client_info') or {}).get('android_client_info') or {}).get('package_name') == 'com.bodyahmed77.fiftyfit']
          assert matches, 'No Firebase client for com.bodyahmed77.fiftyfit'
          print('Firebase/google-services preflight passed')
          PY
      - name: Configure Android application
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('android')
          top = root / 'build.gradle'
          app = root / 'app' / 'build.gradle'
          vars_file = root / 'variables.gradle'
          t = top.read_text(encoding='utf-8')
          if 'com.google.gms:google-services' not in t:
              t = t.replace('dependencies {', "dependencies {\n    classpath 'com.google.gms:google-services:4.4.0'", 1)
          top.write_text(t, encoding='utf-8')
          t = app.read_text(encoding='utf-8')
          if 'play-services-auth' not in t:
              t = t.replace('dependencies {', "dependencies {\n    implementation 'com.google.android.gms:play-services-auth:21.0.0'", 1)
          if 'com.android.billingclient:billing:9.1.0' not in t:
              t = t.replace('dependencies {', "dependencies {\n    implementation 'com.android.billingclient:billing:9.1.0'", 1)
          if 'com.google.gms.google-services' not in t:
              t += '\napply plugin: \'com.google.gms.google-services\'\n'
          app.write_text(t, encoding='utf-8')
          t = vars_file.read_text(encoding='utf-8')
          t = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', t)
          t = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', t)
          vars_file.write_text(t, encoding='utf-8')
          PY
      - name: Set monotonic Play version code
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          text = re.sub(r'\n\s*versionCode\s+\d+', '', text)
          text = re.sub(r'\n\s*versionName\s+"[^"]*"', '', text)
          text = text.replace('defaultConfig {', f'defaultConfig {{\n        versionCode {2000+n}\n        versionName "1.0.{n}"', 1)
          path.write_text(text, encoding='utf-8')
          print(f'versionCode={2000+n}, versionName=1.0.{n}')
          PY
      - name: Sync Capacitor
        run: |
          set -euo pipefail
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Inject first-party Google Play Billing bridge
        run: python3 scripts/inject-fiftyfit-billing-v2.py
      - name: Apply Android main-thread Billing launch patch
        run: python3 scripts/apply-billing-main-thread.py
      - name: Harden TikTok embedded player
        run: python3 scripts/harden-tiktok-player-webview.py
      - name: Inject Android edge-to-edge system UI (black status/nav bars)
        run: python3 scripts/inject-android-system-ui.py
      - name: Verify first-party native Billing and TikTok bridges
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          plugin = Path('android/app/src/main/java/com/bodyahmed77/fiftyfit/billing/FiftyFitBillingPlugin.java')
          tiktok_plugin = Path('android/app/src/main/java/com/bodyahmed77/fiftyfit/TikTokWebViewPlugin.java')
          tiktok_activity = Path('android/app/src/main/java/com/bodyahmed77/fiftyfit/TikTokWebViewActivity.java')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          gradle = Path('android/app/build.gradle')
          main_files = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          assert plugin.is_file(), 'FiftyFitBillingPlugin.java missing'
          assert tiktok_plugin.is_file(), 'TikTokWebViewPlugin.java missing'
          assert tiktok_activity.is_file(), 'TikTokWebViewActivity.java missing'
          billing = plugin.read_text(encoding='utf-8')
          tiktok = tiktok_activity.read_text(encoding='utf-8')
          main = main_files[0].read_text(encoding='utf-8') if main_files else ''
          manifest_text = manifest.read_text(encoding='utf-8')
          assert 'FIFTYFIT_NATIVE_BILLING_V7' in billing
          assert 'FIFTYFIT_BILLING_MAIN_THREAD_V1' in billing
          assert 'runOnUiThread' in billing
          assert 'com.android.billingclient:billing:9.1.0' in gradle.read_text(encoding='utf-8')
          assert 'registerPlugin(FiftyFitBillingPlugin.class)' in main
          assert 'registerPlugin(TikTokWebViewPlugin.class)' in main
          assert 'FIFTYFIT_EDGE_TO_EDGE_V2' in main, 'edge-to-edge MainActivity patch missing'
          assert 'FIFTYFIT_TIKTOK_IFRAME_V1' in tiktok
          assert 'https://www.tiktok.com/player/v1/' in tiktok
          assert 'allowfullscreen' in tiktok
          assert 'TikTokWebViewActivity' in manifest_text
          assert 'android:screenOrientation="portrait"' not in manifest_text, 'TikTok activity must not impose a portrait-only device requirement'
          print('Native Billing + TikTok bridge validation passed')
          PY
      - name: Sign Android release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/fiftyfit-release.keystore
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          if 'signingConfigs {' not in s:
              s = s.replace('android {', '''android {\n    signingConfigs {\n        release {\n            storeFile file('../fiftyfit-release.keystore')\n            storePassword System.getenv('KEYSTORE_PASSWORD')\n            keyAlias System.getenv('KEY_ALIAS')\n            keyPassword System.getenv('KEY_PASSWORD')\n        }\n    }''', 1)
          s = s.replace('buildTypes {', '''buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n''', 1) if 'signingConfig signingConfigs.release' not in s else s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Preflight billing release metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          billing = Path('src/config.js').read_text(encoding='utf-8')
          assert 'training_pro_monthly' in billing
          assert 'nutrition_pro_monthly' in billing
          assert 'both_pro_monthly' in billing
          assert 'ai_coach_pro_monthly' in billing
          print('Billing product catalog preflight passed')
          PY
      - name: Build signed Android release
        run: |
          set -euo pipefail
          timeout 20m ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Collect and fingerprint release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab release-artifacts/fifty-fit-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk release-artifacts/fifty-fit-release.apk
          sha256sum release-artifacts/* | tee release-artifacts/SHA256SUMS.txt
      - name: Verify final release artifacts
        run: |
          set -euo pipefail
          test -s release-artifacts/fifty-fit-release.aab
          test -s release-artifacts/fifty-fit-release.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for name in ['release-artifacts/fifty-fit-release.aab','release-artifacts/fifty-fit-release.apk']:
              with zipfile.ZipFile(name) as z:
                  bad = z.testzip()
                  assert bad is None, f'Corrupt ZIP entry in {name}: {bad}'
          print('Final AAB/APK ZIP integrity passed')
          PY
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-verified-release-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
