name: Align admin exercise catalog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing exercise to admin catalog
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('admin/app.js')
          text=p.read_text(encoding='utf-8')
          old='''["single_arm_seated_row", "Single Arm Seated Row", "سحب أرضي بذراع واحدة"],\n  ["bicep_curl", "Behind Body Bicep Curl", "بايسبس خلف الجسم"],'''
          new='''["single_arm_seated_row", "Single Arm Seated Row", "سحب أرضي بذراع واحدة"],\n  ["bicep_curl", "Behind Body Bicep Curl", "بايسبس خلف الجسم"],\n  ["behind_body_bicep_curl", "Behind Body Bicep Curl", "بايسبس خلف الجسم"],'''
          if old not in text: raise SystemExit('admin exercise catalog marker missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check admin/app.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/app.js
          git diff --cached --check
          git commit -m "fix: include all app exercises in admin editor"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git rm .github/workflows/add-missing-admin-exercise.yml
          git commit -m "chore: remove temporary admin catalog workflow"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
