<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b46c1" />
      <stop offset="100%" stop-color="#553c9a" />
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- abduction machine frame -->
  <rect x="30" y="30" width="10" height="140" rx="5" fill="#718096" />
  <rect x="160" y="30" width="10" height="140" rx="5" fill="#718096" />
  <rect x="38" y="26" width="124" height="10" rx="5" fill="url(#machine)" />
  <!-- seat -->
  <rect x="80" y="150" width="40" height="10" rx="5" fill="#2d3748" />
  <!-- body seated -->
  <rect x="76" y="96" width="48" height="58" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="80" r="15" fill="url(#skin)" />
  <!-- thighs spread outward -->
  <path
    d="M80 150 L60 158 L52 140"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M120 150 L140 158 L148 140"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- shins -->
  <path
    d="M52 140 L44 120"
    fill="none"
    stroke="url(#skin)"
    stroke-width="12"
    stroke-linecap="round"
  />
  <path
    d="M148 140 L156 120"
    fill="none"
    stroke="url(#skin)"
    stroke-width="12"
    stroke-linecap="round"
  />
  <!-- knee pads -->
  <rect x="40" y="112" width="16" height="12" rx="4" fill="url(#machine)" />
  <rect x="144" y="112" width="16" height="12" rx="4" fill="url(#machine)" />
</svg>
