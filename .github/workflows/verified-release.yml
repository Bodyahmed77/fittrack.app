name: Verified Fifty Fit Android Release

on:
  push:
    branches: [fix/verified-release-artifact]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit under test
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 / build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies from clean lockfile
        run: npm ci

      - name: Validate source and postinstall results
        run: |
          set -euo pipefail
          node --check src/googleAuth.js
          node --check src/billing.js
          test -s src/googleWebClientId.js || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path('node_modules/capacitor-billing/android/src/main/java/de/carstenklaffke/billing/BillingPlugin.java')
          g = Path('node_modules/capacitor-billing/android/build.gradle')
          t = p.read_text(encoding='utf-8')
          gt = g.read_text(encoding='utf-8')
          required = {
              'PendingPurchasesParams': 'PBL9 pending-purchase API',
              'QueryProductDetailsResult': 'PBL9 product-details callback',
              'enableAutoServiceReconnection()': 'automatic billing reconnection',
              'FIFTYFIT_BILLING_ERROR': 'native billing diagnostic marker',
          }
          for needle, label in required.items():
              assert needle in t, f'missing {label}: {needle}'
          assert 'com.android.billingclient:billing:9.1.0' in gt, 'capacitor-billing native module is not pinned to PBL9'
          assert 'com.android.billingclient:billing:7.1.0' not in gt, 'legacy PBL7 dependency remains in native module'
          print('Clean checkout native billing patch verification passed')
          PY

      - name: Extract Google Web Client ID and validate OAuth certificates
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/extract-google-web-client-id.py

      - name: Build the web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Inject google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}" || { echo 'GOOGLE_SERVICES_JSON_BASE64 secret is missing'; exit 1; }
          printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('android/app/google-services.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d.get('project_info', {}).get('project_id') == 'fittrack-698fa'
          clients = [c for c in (d.get('client') or []) if ((c.get('client_info') or {}).get('android_client_info') or {}).get('package_name') == 'com.bodyahmed77.fiftyfit']
          assert clients, 'No Android OAuth client for com.bodyahmed77.fiftyfit'
          print('google-services.json package/project validation passed')
          PY

      - name: Configure Android Google services and API levels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('android')
          rb = root / 'build.gradle'
          ab = root / 'app' / 'build.gradle'
          vg = root / 'variables.gradle'

          text = rb.read_text(encoding='utf-8')
          if 'com.google.gms:google-services' not in text:
              text = text.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'", 1)
          rb.write_text(text, encoding='utf-8')

          text = ab.read_text(encoding='utf-8')
          if 'play-services-auth' not in text:
              text = text.replace('dependencies {', "dependencies {\n    implementation 'com.google.android.gms:play-services-auth:21.0.0'", 1)
          if 'com.google.gms.google-services' not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          if 'enableSplit = false' not in text:
              text += "\nandroid { bundle { language { enableSplit = false } } }\n"
          ab.write_text(text, encoding='utf-8')

          text = vg.read_text(encoding='utf-8')
          if 'rgcfaIncludeGoogle' not in text:
              text = text.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'\n    androidxCredentialsPlayServicesAuthVersion = '1.3.0'\n    librariesIdentityGoogleidVersion = '1.1.1'", 1)
          else:
              text = text.replace('rgcfaIncludeGoogle = false', 'rgcfaIncludeGoogle = true')
          text = re.sub(r"androidxCredentialsVersion\s*=\s*'[^']*'", "androidxCredentialsVersion = '1.3.0'", text)
          text = re.sub(r"androidxCredentialsPlayServicesAuthVersion\s*=\s*'[^']*'", "androidxCredentialsPlayServicesAuthVersion = '1.3.0'", text)
          text = re.sub(r"librariesIdentityGoogleidVersion\s*=\s*'[^']*'", "librariesIdentityGoogleidVersion = '1.1.1'", text)
          vg.write_text(text, encoding='utf-8')
          PY

      - name: Force Android API 36 target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/variables.gradle')
          t = p.read_text(encoding='utf-8')
          t = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', t)
          t = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', t)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Set monotonic Play version code
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          t = p.read_text(encoding='utf-8')
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          # Base 2000 so verified builds always exceed main build versionCodes (1000+run)
          t = re.sub(r'\n\s*versionCode\s+\d+', '', t)
          t = re.sub(r'\n\s*versionName\s+"[^"]*"', '', t)
          t = t.replace('defaultConfig {', f'defaultConfig {{\n        versionCode {2000+n}\n        versionName "1.0.{n}"', 1)
          p.write_text(t, encoding='utf-8')
          print(f'versionCode={2000+n}, versionName=1.0.{n}')
          PY

      - name: Generate assets and sync Capacitor
        run: |
          npx capacitor-assets generate --android
          npx cap sync android
          python3 scripts/inject-android-system-ui.py
          python3 scripts/inject-tiktok-webview.py

      - name: Pre-build web/native parity gate
        run: python3 scripts/verify-release-artifact.py --prebuild

      - name: Decode release signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > android/app/release.keystore

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          t = p.read_text(encoding='utf-8')
          if 'signingConfigs {' not in t:
              t = t.replace('android {', '''android {\n    signingConfigs {\n        release {\n            storeFile file(\"release.keystore\")\n            storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n        }\n    }''', 1)
          if 'signingConfig signingConfigs.release' not in t:
              t = t.replace('buildTypes {', 'buildTypes {\n        release { signingConfig signingConfigs.release }', 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Release preflight
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          g = Path('android/app/build.gradle').read_text(encoding='utf-8')
          v = Path('android/variables.gradle').read_text(encoding='utf-8')
          m = Path('android/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert re.search(r'applicationId\s+[\"\']com.bodyahmed77\.fiftyfit[\"\']', g)
          assert re.search(r'namespace\s+[\"\']com.bodyahmed77\.fiftyfit[\"\']', g)
          assert 'compileSdkVersion = 36' in v and 'targetSdkVersion = 36' in v
          assert 'com.google.gms.google-services' in g and 'play-services-auth' in g
          assert 'enableSplit = false' in g
          assert 'TikTokWebViewActivity' in m
          expected = str(2000 + int(os.environ['GITHUB_RUN_NUMBER']))
          assert re.findall(r'\bversionCode\s+(\d+)', g) == [expected]
          assert Path('android/app/release.keystore').is_file()
          print('Release preflight passed')
          print(f'versionCode={expected}')
          PY

      - name: Build signed release AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Collect canonical release artifacts
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          AAB=$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n1)
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)
          test -n "$AAB" && test -n "$APK"
          cp "$AAB" release-artifacts/fifty-fit-release.aab
          cp "$APK" release-artifacts/fifty-fit-release.apk
          sha256sum release-artifacts/*

      - name: Verify final AAB/APK contents
        run: python3 scripts/verify-release-artifact.py

      - name: Upload verified AAB
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-verified-release-aab-${{ github.run_number }}
          path: android/release-artifacts/fifty-fit-release.aab
          if-no-files-found: error

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-verified-release-apk-${{ github.run_number }}
          path: android/release-artifacts/fifty-fit-release.apk
          if-no-files-found: error
