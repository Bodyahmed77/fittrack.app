<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dd6b20" />
      <stop offset="100%" stop-color="#c05621" />
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- cable column -->
  <rect x="60" y="20" width="80" height="12" rx="6" fill="url(#cable)" />
  <rect x="70" y="32" width="8" height="60" rx="4" fill="#718096" />
  <rect x="122" y="32" width="8" height="60" rx="4" fill="#718096" />
  <!-- cable -->
  <path d="M100 24 L100 66" stroke="#cbd5e0" stroke-width="3" />
  <!-- body -->
  <rect x="78" y="88" width="44" height="62" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="70" r="15" fill="url(#skin)" />
  <!-- arms with zigzag (rope) pushdown -->
  <path
    d="M86 98 L70 118 L64 132"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M114 98 L130 118 L136 132"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands holding rope -->
  <circle cx="64" cy="136" r="8" fill="url(#skin)" />
  <circle cx="136" cy="136" r="8" fill="url(#skin)" />
  <!-- rope attachment -->
  <path
    d="M100 66 L100 118 M100 118 L64 136 M100 118 L136 136"
    fill="none"
    stroke="#e2e8f0"
    stroke-width="4"
    stroke-linecap="round"
  />
  <!-- legs -->
  <rect x="84" y="150" width="14" height="30" rx="5" fill="#2d3748" />
  <rect x="102" y="150" width="14" height="30" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="184" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="98" y="184" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
