<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b46c1" />
      <stop offset="100%" stop-color="#553c9a" />
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- machine frame -->
  <rect x="20" y="20" width="10" height="150" rx="5" fill="#718096" />
  <rect x="170" y="20" width="10" height="150" rx="5" fill="#718096" />
  <rect x="16" y="16" width="168" height="12" rx="6" fill="url(#machine)" />
  <!-- lat pulldown bar (wide) -->
  <path
    d="M40 30 L40 44 L52 44 L52 60 M148 30 L148 44 L136 44 L136 60"
    fill="none"
    stroke="url(#machine)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="52" y="58" width="84" height="8" rx="4" fill="url(#machine)" />
  <!-- cable -->
  <path d="M100 20 L100 40" stroke="#cbd5e0" stroke-width="3" />
  <!-- body seated -->
  <rect x="74" y="78" width="52" height="56" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="62" r="15" fill="url(#skin)" />
  <!-- arms pulling bar down -->
  <path
    d="M80 84 L66 68 L62 60"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M120 84 L134 68 L138 60"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="62" cy="60" r="8" fill="url(#skin)" />
  <circle cx="138" cy="60" r="8" fill="url(#skin)" />
  <!-- thigh pad -->
  <rect x="70" y="134" width="60" height="8" rx="4" fill="#2d3748" />
  <!-- legs -->
  <rect x="82" y="142" width="14" height="30" rx="5" fill="#2d3748" />
  <rect x="104" y="142" width="14" height="30" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="74" y="176" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="100" y="176" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
