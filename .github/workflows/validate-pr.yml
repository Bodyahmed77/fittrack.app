name: Validate Fifty Fit PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 / build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies without source-mutating postinstall
        run: npm ci --ignore-scripts

      - name: Apply required native billing patches only
        run: |
          set -euo pipefail
          python3 scripts/apply-billing-native-diagnostics.py
          python3 scripts/apply-billing-native-offer-diagnostics.py
          python3 scripts/apply-google-native-diagnostics.py

      - name: Validate production invariants
        run: python3 scripts/validate-production-invariants.py

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate JavaScript syntax
        run: |
          node --check src/googleAuth.js
          node --check src/billing.js
          node --check src/registerPurchase.js

      - name: Validate dependency manifest consistency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('package.json').read_text())
          l = json.loads(Path('package-lock.json').read_text())
          root = l['packages']['']
          assert root['devDependencies']['@vitejs/plugin-react'] == p['devDependencies']['@vitejs/plugin-react']
          assert root['devDependencies']['vite'] == p['devDependencies']['vite']
          print('package.json/package-lock.json consistency passed')
          PY

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Inject google-services.json for Android compile validation
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}" || { echo 'GOOGLE_SERVICES_JSON_BASE64 secret is missing'; exit 1; }
          mkdir -p android/app
          printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Apply generated Android runtime patches
        run: |
          set -euo pipefail
          npx cap sync android
          python3 scripts/inject-android-system-ui.py
          python3 scripts/inject-tiktok-webview.py

      - name: Validate Play Billing native compatibility
        run: |
          set -euo pipefail
          PLUGIN='node_modules/capacitor-billing/android/src/main/java/de/carstenklaffke/billing/BillingPlugin.java'
          PLUGIN_GRADLE='node_modules/capacitor-billing/android/build.gradle'
          test -f "$PLUGIN"
          test -f "$PLUGIN_GRADLE"
          grep -q 'com.android.billingclient:billing:9.1.0' android/app/build.gradle
          grep -q 'com.android.billingclient:billing:9.1.0' "$PLUGIN_GRADLE"
          if grep -q 'com.android.billingclient:billing:7.1.0' "$PLUGIN_GRADLE"; then
            echo 'PBL7 billing dependency remains in capacitor-billing module'
            exit 1
          fi
          if grep -Eq '\.enablePendingPurchases\(\)' "$PLUGIN"; then
            echo 'PBL7 no-arg enablePendingPurchases() remains in patched native source'
            exit 1
          fi
          grep -q 'PendingPurchasesParams' "$PLUGIN"
          grep -q 'QueryProductDetailsResult' "$PLUGIN"
          grep -q 'getProductDetailsList()' "$PLUGIN"
          grep -q 'enableAutoServiceReconnection()' "$PLUGIN"
          grep -q 'getOnPurchasesUpdatedSubResponseCode()' "$PLUGIN"
          grep -q 'FIFTYFIT_BILLING_ERROR' "$PLUGIN"

      - name: Inspect resolved Play Billing version for capacitor-billing
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :capacitor-billing:dependencyInsight \
            --dependency com.android.billingclient:billing \
            --configuration debugCompileClasspath

      - name: Compile Android debug artifact (Billing/PBL compatibility gate)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify release-time Billing normalization transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('vite.config.js').read_text(encoding='utf-8')
          required = ['extractBillingResponseCode', 'resolvedResponseCode', 'billingError response-code block not found']
          for item in required[:2]:
              assert item in text, item
          print('Billing normalization transform gate passed')
          PY
