name: One-time calendar TikTok fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')

          old = 'const offset = i - 2; // [today-2 ... today+4]\n            const iso = dateKey(offset);'
          if old not in text:
              raise SystemExit('calendar anchor missing')
          text = text.replace(old, 'const iso = addDays(mondayOf(dateKey(0)), i);', 1)

          old = 'function isTikTokVideoRef(value) {\n  const raw = String(value || "").trim();\n  return /(?:^|https?:\\/\\/)(?:www\\.|m\\.|vt\\.)?tiktok\\.com/i.test(raw) || /^\\d+$/.test(raw);\n}\n'
          new = 'function isTikTokVideoRef(value) {\n  const raw = String(value || "").trim();\n  return /(?:^|https?:\\/\\/)(?:www\\.|m\\.|vt\\.)?tiktok\\.com/i.test(raw) || /^\\d{15,}$/.test(raw);\n}\n\nfunction getTikTokPostId(value) {\n  const raw = String(value || "").trim();\n  if (/^\\d{15,}$/.test(raw)) return raw;\n  const match = raw.match(/\\/video\\/(\\d{15,})/i);\n  return match?.[1] || null;\n}\n'
          if old not in text:
              raise SystemExit('tiktok ref anchor missing')
          text = text.replace(old, new, 1)

          old = '  const [videoLoaded, setVideoLoaded] = useState(false);\n  const embedSrc = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;'
          new = '  const [videoLoaded, setVideoLoaded] = useState(false);\n  const tikTokPostId = getTikTokPostId(videoId);\n  const embedSrc = tikTokPostId\n    ? `https://www.tiktok.com/player/v1/${tikTokPostId}?autoplay=1&controls=1&progress_bar=1&play_button=1&volume_control=1&fullscreen_button=1&timestamp=1&music_info=0&description=0&rel=0&native_context_menu=0`\n    : `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;'
          if old not in text:
              raise SystemExit('viewer embed anchor missing')
          text = text.replace(old, new, 1)

          old = 'async function openTikTokVideo(tikTokUrl, ar) {\n  const raw = String(tikTokUrl || "").trim();\n  if (!raw) return;\n  try {\n    const { openTikTokWebView } = await import("./tiktokWebView");\n    await openTikTokWebView(raw);\n  } catch (error) {\n    console.error("[TikTok] in-app viewer failed", error);\n    throw new Error(\n      ar\n        ? "تعذر فتح فيديو التمرين داخل التطبيق."\n        : "Could not open the exercise video inside the app.",\n    );\n  }\n}\n\n'
          if old not in text:
              raise SystemExit('old tiktok function missing')
          text = text.replace(old, '', 1)

          old = '  const isTikTok = isTikTokVideoRef(videoId);\n  const handleWatch = async () => {\n    if (isTikTok) {\n      try {\n        await openTikTokVideo(String(videoId), ar);\n      } catch (error) {\n        // Keep the error in the app; do not redirect to a native/social app.\n        console.warn(error);\n      }\n      return;\n    }\n    setOpen(true);\n  };'
          new = '  const isTikTok = isTikTokVideoRef(videoId);\n  const handleWatch = () => setOpen(true);'
          if old not in text:
              raise SystemExit('watch handler anchor missing')
          text = text.replace(old, new, 1)

          app.write_text(text, encoding='utf-8')

          cfg = Path('src/config.js')
          cfg_text = cfg.read_text(encoding='utf-8')
          direct = {
            'bench_press':'7603190204740013313','incline_db_press':'7267987124610239762',
            'tricep_pushdown':'7586888221125070094','zigzag_tricep_ext':'7586888221125070094',
            'overhead_ext':'7527210325834206486','lat_pulldown':'7665886081329532174',
            'barbell_row':'7532789627212631314','seated_row':'7639010632561478934',
            'single_arm_seated_row':'7639010632561478934','bicep_curl':'7636460964870720788',
            'behind_body_bicep_curl':'7636460964870720788','hammer_curl':'7623849292461051156',
            'supported_db_curl':'7636460964870720788','squat':'7513352117692665094',
            'hack_squat':'7513352117692665094','leg_press':'7545454872586423574',
            'leg_extension':'7564750740061752598','abduction':'7419086233487281415',
            'reverse_curl':'7214952400631778566','face_pull':'7474058570451946757',
            'lunges':'7353289956699229472','leg_curl':'7521556521390460166',
            'calf_raise':'7602285498962349342','ohp':'7663674671677705488',
            'lateral_raise':'7486685939025054981','rear_delt_fly':'7630410819259387158',
            'shrugs':'7500002250526395653','deadlift':'7380964646062263558',
            'crunches':'7654453038815399171','jump_rope':'7358498825012661537'
          }
          for key, value in direct.items():
              cfg_text = re.sub(rf'(\\s+{re.escape(key)}:\\s+")[^"]+("[,])', rf'\\1{value}\\2', cfg_text)
          cfg_text = cfg_text.replace('// Direct TikTok URLs are kept for the normal in-app WebView.\n// Numeric IDs use TikTok\'s public /video/<id> page URL, not the official player.', '// TikTok video IDs are canonical IDs for TikTok\'s official Player v1 embed.')
          cfg.write_text(cfg_text, encoding='utf-8')
          print('PATCH_OK')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/config.js
          git rm -f .github/workflows/fix-calendar-tiktok-version.yml
          git add -A
          git commit -m "fix: stable workout week and official TikTok player"
          git push origin HEAD:main
