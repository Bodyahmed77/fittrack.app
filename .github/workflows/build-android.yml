name: Build Fifty Fit Android Release

# Runtime release rebuild: includes the Firestore onboarding snapshot guard
# persisted immediately before this workflow run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 / build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Validate current-source release invariants
        run: python3 scripts/release-fixes.py

      - name: Normalize canonical release source
        run: python3 scripts/release-source-normalizer.py

      - name: Persist canonical source changes
        run: |
          set -euo pipefail
          if git diff --quiet -- src/App.jsx; then
            echo "Canonical source already clean."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.jsx
            git commit -m "fix: persist canonical Android release source [skip ci]"
            git push origin HEAD:main
          fi
          echo "Android release source commit: $(git rev-parse HEAD)"

      - name: Extract Google Web Client ID
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/extract-google-web-client-id.py

      - name: Build the web app
        run: npm run build

      - name: Add the Android platform
        run: npx cap add android || true

      - name: Inject google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}"
          mkdir -p android/app
          echo "$GS_B64" | base64 -d > android/app/google-services.json
          python3 - <<'PY'
          import hashlib
          import json
          p='android/app/google-services.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d.get('project_info', {}).get('project_id') == 'fittrack-698fa'
          package='com.bodyahmed77.fiftyfit'
          matching=[]
          for client in d.get('client') or []:
              ci=client.get('client_info') or {}
              pkg=(ci.get('android_client_info') or {}).get('package_name')
              if pkg == package:
                  matching.append(client)
          assert matching, f'No google-services client for {package}'
          print(f'google-services.json OK for {package}')

          print('Firebase OAuth configuration for Android package:')
          for client in matching:
              for oauth in client.get('oauth_client') or []:
                  ctype=oauth.get('client_type')
                  cid=oauth.get('client_id') or ''
                  info=oauth.get('android_info') or {}
                  cert=info.get('certificate_hash')
                  if ctype == 1:
                      print(f'  Android OAuth client: {cid[-28:] if cid else "<missing>"}…')
                      print(f'  certificate_hash: {cert or "<missing>"}')
                  elif ctype == 3:
                      print(f'  Web OAuth client: …{cid[-28:] if cid else "<missing>"}')

          raw=open(p,'rb').read()
          print(f'google-services.json sha256: {hashlib.sha256(raw).hexdigest()}')
          PY

      - name: Configure Google Services, Firebase Authentication and Google Sign-In
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android')
          rb=root/'build.gradle'
          ab=root/'app'/'build.gradle'
          vg=root/'variables.gradle'

          text=rb.read_text(encoding='utf-8')
          if "com.google.gms:google-services" not in text:
              text=text.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'", 1)
          rb.write_text(text,encoding='utf-8')

          text=ab.read_text(encoding='utf-8')
          if "play-services-auth" not in text:
              text=text.replace("dependencies {", "dependencies {\n    implementation 'com.google.android.gms:play-services-auth:21.0.0'", 1)
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          if "enableSplit = false" not in text:
              text += "\nandroid {\n    bundle {\n        language { enableSplit = false }\n    }\n}\n"
          ab.write_text(text,encoding='utf-8')

          text=vg.read_text(encoding='utf-8')
          if 'rgcfaIncludeGoogle' not in text:
              if 'ext {' in text:
                  text=text.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'\n    androidxCredentialsPlayServicesAuthVersion = '1.3.0'\n    librariesIdentityGoogleidVersion = '1.1.1'", 1)
              else:
                  text += "\next.rgcfaIncludeGoogle = true\next.androidxCredentialsVersion = '1.3.0'\next.androidxCredentialsPlayServicesAuthVersion = '1.3.0'\next.librariesIdentityGoogleidVersion = '1.1.1'\n"
          else:
              text=text.replace("rgcfaIncludeGoogle = false", "rgcfaIncludeGoogle = true")
          if 'androidxCredentialsVersion' not in text:
              text=text.replace('rgcfaIncludeGoogle = true', "rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
          # androidx.credentials:credentials and credentials-play-services-auth are
          # documented to be used at the same version.
          if 'androidxCredentialsPlayServicesAuthVersion' not in text:
              text=text.replace("androidxCredentialsVersion = '1.3.0'", "androidxCredentialsVersion = '1.3.0'\n    androidxCredentialsPlayServicesAuthVersion = '1.3.0'", 1)
          else:
              text=re.sub(r"androidxCredentialsPlayServicesAuthVersion\s*=\s*'[^']*'", "androidxCredentialsPlayServicesAuthVersion = '1.3.0'", text)
          if 'librariesIdentityGoogleidVersion' not in text:
              text=text.replace("androidxCredentialsPlayServicesAuthVersion = '1.3.0'", "androidxCredentialsPlayServicesAuthVersion = '1.3.0'\n    librariesIdentityGoogleidVersion = '1.1.1'", 1)
          else:
              text=re.sub(r"librariesIdentityGoogleidVersion\s*=\s*'[^']*'", "librariesIdentityGoogleidVersion = '1.1.1'", text)
          vg.write_text(text,encoding='utf-8')
          print('Firebase Authentication Google native dependencies enabled')
          PY

      - name: Force Android API 36 target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          text=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          if 'targetSdkVersion' not in text: text += '\next.targetSdkVersion = 36\n'
          if 'compileSdkVersion' not in text: text += '\next.compileSdkVersion = 36\n'
          p.write_text(text,encoding='utf-8')
          print('Android target/compile SDK = 36')
          PY

      - name: Set monotonic Play version code
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('android/app/build.gradle')
          text=p.read_text(encoding='utf-8')
          run_number=int(os.environ.get('GITHUB_RUN_NUMBER','1'))
          version_code=1000 + run_number
          if 'defaultConfig {' not in text: raise SystemExit('defaultConfig block not found')
          text=re.sub(r'\n\s*versionCode\s+\d+', '', text)
          text=re.sub(r'\n\s*versionName\s+"[^"]*"', '', text)
          text=text.replace('defaultConfig {', f'defaultConfig {{\n        versionCode {version_code}\n        versionName "1.0.{run_number}"', 1)
          p.write_text(text,encoding='utf-8')
          print(f'Play versionCode={version_code}, versionName=1.0.{run_number}')
          PY

      - name: Generate app assets and sync Capacitor
        run: |
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Inject native TikTok WebView
        run: python3 scripts/inject-tiktok-webview.py

      - name: Force black Android system bars
        run: python3 scripts/inject-android-system-ui.py

      - name: Verify Android release configuration
        working-directory: android
        run: |
          set -euo pipefail
          grep -n "targetSdkVersion\|compileSdkVersion\|rgcfaIncludeGoogle\|androidxCredentialsVersion\|androidxCredentialsPlayServicesAuthVersion\|librariesIdentityGoogleidVersion" variables.gradle
          grep -n "namespace\|applicationId\|versionCode\|versionName" app/build.gradle
          test "$(grep -o 'applicationId "[^"]*"' app/build.gradle | head -n1 | cut -d'"' -f2)" = "com.bodyahmed77.fiftyfit"
          test "$(grep -o 'namespace "[^"]*"' app/build.gradle | head -n1 | cut -d'"' -f2)" = "com.bodyahmed77.fiftyfit"
          test -s app/src/main/assets/public/index.html
          test -s app/src/main/java/com/bodyahmed77/fiftyfit/TikTokWebViewPlugin.java
          test -s app/src/main/java/com/bodyahmed77/fiftyfit/TikTokWebViewActivity.java
          creds_ver="$(grep -o "androidxCredentialsVersion = '[^']*'" variables.gradle | head -n1 | cut -d"'" -f2)"
          creds_psa_ver="$(grep -o "androidxCredentialsPlayServicesAuthVersion = '[^']*'" variables.gradle | head -n1 | cut -d"'" -f2)"
          test -n "$creds_ver"
          test -n "$creds_psa_ver"
          test "$creds_ver" = "$creds_psa_ver"
          echo "androidx.credentials version pair OK: credentials=$creds_ver credentials-play-services-auth=$creds_psa_ver"

      - name: Verify release artifacts will use identical web assets
        working-directory: android
        run: |
          set -euo pipefail
          test -s app/src/main/assets/public/index.html
          sha256sum app/src/main/assets/public/index.html
          echo "AAB and APK are built in the same Gradle invocation from the same Android/web source tree."

      - name: Decode release signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}"
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Verify Google Play App Signing SHA-1 and report upload SHA-1
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PLAY_APP_SIGNING_SHA1="55384cf206854973c68dfba5be2a1bba8e048bee"

          CONFIGURED_SHA1S="$(python3 - <<'PY'
          import json
          p='app/google-services.json'
          d=json.load(open(p, encoding='utf-8'))
          package='com.bodyahmed77.fiftyfit'
          values=[]
          for client in d.get('client') or []:
              ci=client.get('client_info') or {}
              if (ci.get('android_client_info') or {}).get('package_name') != package:
                  continue
              for oauth in client.get('oauth_client') or []:
                  if oauth.get('client_type') != 1:
                      continue
                  cert=(oauth.get('android_info') or {}).get('certificate_hash')
                  if cert:
                      values.append(cert.replace(':','').lower())
          print('\n'.join(sorted(set(values))))
          PY
          )"

          echo "Google Play App Signing SHA-1 expected: $PLAY_APP_SIGNING_SHA1"
          echo "Firebase Android OAuth SHA-1 values:"
          if [ -n "$CONFIGURED_SHA1S" ]; then
            printf '%s\n' "$CONFIGURED_SHA1S"
          else
            echo "<none>"
          fi

          if ! printf '%s\n' "$CONFIGURED_SHA1S" | grep -Fxq "$PLAY_APP_SIGNING_SHA1"; then
            echo "ERROR: Google Play App Signing SHA-1 is NOT present in google-services.json."
            exit 1
          fi
          echo "OK: Google Play App Signing SHA-1 is registered in Firebase OAuth configuration."

          ACTUAL_UPLOAD_SHA1="$(keytool -list -v \
            -keystore app/release.keystore \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" 2>/dev/null \
            | awk -F': ' '/SHA1:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_UPLOAD_SHA1"
          echo "CI upload keystore SHA-1: $ACTUAL_UPLOAD_SHA1"
          if printf '%s\n' "$CONFIGURED_SHA1S" | grep -Fxq "$ACTUAL_UPLOAD_SHA1"; then
            echo "INFO: CI upload SHA-1 is also registered in Firebase OAuth."
          else
            echo "INFO: CI upload SHA-1 is not required for Play App Signing and will not block the AAB build."
            echo "INFO: A directly sideloaded APK may require this upload SHA-1 to be separately registered for Google Sign-In."
          fi

      - name: Build signed release AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Verify AAB and APK exist and are non-empty
        working-directory: android
        run: |
          set -euo pipefail
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK/AAB web asset parity
        working-directory: android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          aab=Path('app/build/outputs/bundle/release/app-release.aab')
          apk=Path('app/build/outputs/apk/release/app-release.apk')
          with zipfile.ZipFile(aab) as z:
              aab_items=sorted(n for n in z.namelist() if n.endswith('/assets/public/index.html'))
              if not aab_items: raise SystemExit('No AAB web asset index.html found')
              ah=hashlib.sha256(z.read(aab_items[0])).hexdigest()
          with zipfile.ZipFile(apk) as z:
              n='assets/public/index.html'
              if n not in z.namelist(): raise SystemExit('No APK web asset index.html found')
              ph=hashlib.sha256(z.read(n)).hexdigest()
          if ah != ph: raise SystemExit(f'APK/AAB web asset mismatch: {ah} != {ph}')
          print(f'APK/AAB web asset parity OK: {ah}')
          PY

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-android-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-android-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
