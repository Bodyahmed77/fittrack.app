name: One-time App.jsx release fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply focused App.jsx fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          original = text

          if 'deleteAccountServerData' not in text:
              raise SystemExit('Expected deleteAccountServerData import/reference is missing')

          # AI-only subscribers must be treated as Pro in Settings when the old expression exists.
          pro_pattern = re.compile(r'const pro = data\.entitlements\.trainingPro\s*\|\|\s*data\.entitlements\.nutritionPro\s*;')
          matches = list(pro_pattern.finditer(text))
          if len(matches) > 1:
              raise SystemExit(f'Found {len(matches)} old pro expressions; refusing ambiguous edit')
          if len(matches) == 1:
              text = pro_pattern.sub(
                  'const pro = data.entitlements.trainingPro || data.entitlements.nutritionPro || data.entitlements.aiCoachPro;',
                  text,
                  count=1,
              )

          # Account deletion must clean server-side Supabase data before local/Auth deletion.
          if 'await deleteAccountServerData()' not in text:
              # deleteUser is imported by App.jsx and should be unique to the account-deletion flow.
              candidates = list(re.finditer(r'(?m)^([ \t]*)await\s+deleteUser\s*\(', text))
              if len(candidates) != 1:
                  raise SystemExit(f'Expected exactly one await deleteUser boundary, found {len(candidates)}')
              m = candidates[0]
              indent = m.group(1)
              text = text[:m.start()] + indent + 'await deleteAccountServerData();\n' + text[m.start():]

          if text == original:
              raise SystemExit('No changes were necessary')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate focused changes
        run: |
          grep -n 'deleteAccountServerData' src/App.jsx

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/one-time-appjsx-fix.yml
          git commit -m 'fix: finish account deletion and AI-only settings [skip ci]'
          git push
