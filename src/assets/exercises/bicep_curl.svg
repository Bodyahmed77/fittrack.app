<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53e3e" />
      <stop offset="100%" stop-color="#c53030" />
    </linearGradient>
    <linearGradient id="dumbbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- body standing -->
  <rect x="78" y="88" width="44" height="66" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="70" r="15" fill="url(#skin)" />
  <!-- arms bent curling dumbbells -->
  <path
    d="M86 96 L70 110 L60 128"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M114 96 L130 110 L140 128"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="60" cy="132" r="8" fill="url(#skin)" />
  <circle cx="140" cy="132" r="8" fill="url(#skin)" />
  <!-- dumbbells in hands -->
  <rect x="44" y="126" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <rect x="58" y="130" width="7" height="8" rx="2" fill="#cbd5e0" />
  <rect x="67" y="126" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <rect x="121" y="126" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <rect x="135" y="130" width="7" height="8" rx="2" fill="#cbd5e0" />
  <rect x="144" y="126" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <!-- legs -->
  <rect x="84" y="154" width="14" height="28" rx="5" fill="#2d3748" />
  <rect x="102" y="154" width="14" height="28" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="186" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="98" y="186" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
