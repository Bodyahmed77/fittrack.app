name: Deploy Fifty Fit Web Demo

on:
  push:
    branches: [main]
    paths:
      - 'web-demo/**'
      - 'vite.webdemo.config.js'
      - '.github/workflows/deploy-web-demo.yml'
      - 'admin/**'
      - 'docs/privacy-policy.html'
      - 'docs/account-deletion.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-demo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install build tooling only
        run: npm ci --ignore-scripts

      - name: Build standalone web demo
        run: npx vite build --config vite.webdemo.config.js

      - name: Validate standalone demo artifact
        run: |
          set -euo pipefail
          test -s dist-web-demo/index.html
          test -d dist-web-demo/assets
          test "$(find dist-web-demo/assets -maxdepth 1 -name '*.js' | wc -l)" -ge 1
          grep -q 'Fifty Fit' dist-web-demo/index.html
          ! grep -R -E 'firebase|firestore|@capacitor|capacitor-billing|googleapis|supabase\.co' dist-web-demo/assets --include='*.js' >/dev/null
          echo 'Standalone demo artifact contains no production service runtime dependencies.'

      - name: Runtime smoke test in headless Chrome
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 --config vite.webdemo.config.js >/tmp/fiftyfit-webdemo.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/?demo=1 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/?demo=1 >/dev/null
          CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom 'http://127.0.0.1:4173/?demo=1' >/tmp/fiftyfit-demo-dom.html
          grep -q 'data-mounted="1"' /tmp/fiftyfit-demo-dom.html
          grep -q 'data-fiftyfit-demo-mode="1"' /tmp/fiftyfit-demo-dom.html
          grep -q 'data-fiftyfit-demo-ready="1"' /tmp/fiftyfit-demo-dom.html
          grep -q 'Day 1' /tmp/fiftyfit-demo-dom.html
          grep -q 'WEB DEMO' /tmp/fiftyfit-demo-dom.html
          ! grep -qi 'something went wrong' /tmp/fiftyfit-demo-dom.html
          ! grep -qi 'error' /tmp/fiftyfit-demo-dom.html
          echo 'Standalone web demo headless runtime smoke test passed'

      - name: Assemble GitHub Pages site
        run: |
          set -euo pipefail
          rm -rf dist
          mv dist-web-demo dist
          rm -rf dist/admin
          cp -R admin dist/admin
          cp docs/privacy-policy.html dist/privacy-policy.html
          cp docs/account-deletion.html dist/account-deletion.html
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/admin/index.html
          test -s dist/privacy-policy.html
          test -s dist/account-deletion.html
          test -f dist/.nojekyll
          grep -q 'Fifty Fit' dist/index.html
          echo 'Pages artifact assembled: demo + admin + privacy + account deletion.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed GitHub Pages routes
        run: |
          set -euo pipefail
          PAGE_URL='${{ steps.deployment.outputs.page_url }}'
          test -n "$PAGE_URL"
          for path in './?demo=1' './admin/' './privacy-policy.html' './account-deletion.html'; do
            curl -fsS "${PAGE_URL}${path}" >/dev/null
          done
          curl -fsS "${PAGE_URL}?demo=1" >/tmp/public-demo.html
          grep -q 'Fifty Fit' /tmp/public-demo.html
          curl -fsS "${PAGE_URL}privacy-policy.html" >/tmp/public-privacy.html
          curl -fsS "${PAGE_URL}account-deletion.html" >/tmp/public-deletion.html
          curl -fsS "${PAGE_URL}admin/" >/tmp/public-admin.html
          grep -qi 'Privacy Policy' /tmp/public-privacy.html
          grep -qi 'Account Deletion' /tmp/public-deletion.html
          grep -qi 'Fifty Fit' /tmp/public-admin.html
          echo 'Deployed public routes are reachable.'

      - name: Upload demo diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-demo-diagnostics-${{ github.sha }}
          path: |
            /tmp/fiftyfit-webdemo.log
            /tmp/fiftyfit-demo-dom.html
            /tmp/public-demo.html
            /tmp/public-privacy.html
            /tmp/public-deletion.html
            /tmp/public-admin.html
          if-no-files-found: ignore
          retention-days: 7
