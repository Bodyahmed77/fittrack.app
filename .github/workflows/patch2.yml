name: Patch FitTrack
on:
  push:
    branches:
      - fix/play-readiness-p0-p1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source fixes
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          if 'import { deleteAccountServerData } from "./deleteAccount";' not in s:
              s=s.replace('import { APP_INFO, PRIVACY_POLICY_SECTIONS, TERMS_SECTIONS } from "./privacy";', 'import { APP_INFO, PRIVACY_POLICY_SECTIONS, TERMS_SECTIONS } from "./privacy";\nimport { deleteAccountServerData } from "./deleteAccount";', 1)
          old='''      if (firebaseUser?.uid) {\n        await deleteDoc(doc(db, "users", firebaseUser.uid));\n      }\n      if (firebaseUser) {\n        await deleteUser(firebaseUser);\n      }'''
          new='''      await deleteAccountServerData();\n      if (firebaseUser?.uid) {\n        await deleteDoc(doc(db, "users", firebaseUser.uid));\n      }\n      if (firebaseUser) {\n        await deleteUser(firebaseUser);\n      }'''
          if old in s: s=s.replace(old,new,1)
          old2='  const pro = data.entitlements.trainingPro || data.entitlements.nutritionPro;\n  const setTheme = (mode) => {'
          new2='  const pro = data.entitlements.trainingPro || data.entitlements.nutritionPro || data.entitlements.aiCoachPro;\n  const setTheme = (mode) => {'
          if old2 in s: s=s.replace(old2,new2,1)
          p.write_text(s)
          p=Path('supabase/functions/ai-coach/index.ts')
          s=p.read_text()
          start='''    const localDate =\n      typeof body.localDate === "string" && /^\\d{4}-\\d{2}-\\d{2}$/.test(body.localDate as string)\n        ? (body.localDate as string)\n        : new Date().toISOString().slice(0, 10);'''
          repl='''    const localDate = new Intl.DateTimeFormat("en-CA", {\n      timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit",\n    }).format(new Date());'''
          if start in s: s=s.replace(start,repl,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx supabase/functions/ai-coach/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: wire account deletion and AI quota security'
          git push
