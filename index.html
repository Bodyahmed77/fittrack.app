<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="preconnect" href="https://www.tiktok.com" crossorigin />
    <title>Fifty Fit</title>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0b0d10; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
    <script>
      /* Android runtime fixes:
         - keep the legacy paywall planIds lookup defined;
         - keep the AI drawer above the real visible keyboard boundary;
         - keep TikTok inside the existing full-screen iframe/WebView without
           rewriting the supplied URL into the official player or an author-less URL.
      */
      (function () {
        try { window.planIds = ["training", "nutrition", "both", "ai"]; } catch (_) {}

        function keyboardInset() {
          try {
            var vv = window.visualViewport;
            if (!vv) return 0;
            return Math.max(0, Math.round(window.innerHeight - vv.height - (vv.offsetTop || 0)));
          } catch (_) { return 0; }
        }

        function syncAiDrawer() {
          try {
            var inset = keyboardInset();
            var candidates = document.querySelectorAll("div");
            for (var i = 0; i < candidates.length; i++) {
              var el = candidates[i];
              var cs = window.getComputedStyle(el);
              if (cs.position !== "absolute") continue;
              if (!el.parentElement) continue;
              var parentStyle = window.getComputedStyle(el.parentElement);
              if (parentStyle.position !== "fixed" || parentStyle.zIndex !== "1200") continue;
              if (!String(cs.width || "").includes("360px")) continue;
              el.style.setProperty("bottom", inset + "px", "important");
              el.style.setProperty("height", "calc(100% - " + inset + "px)", "important");
              el.style.setProperty("max-height", "calc(100% - " + inset + "px)", "important");
            }
          } catch (_) {}
        }

        function keepTikTokInsideIframe() {
          try {
            var frames = document.querySelectorAll("iframe");
            for (var i = 0; i < frames.length; i++) {
              var frame = frames[i];
              var raw = frame.getAttribute("src") || "";
              if (!/tiktok\.com/i.test(raw)) continue;
              // The app supplies the exact public TikTok web URL. Keep it intact.
              // Do NOT rewrite it to /video/<id> or /player/v1/<id>.
              frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups");
              frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
              frame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
            }
          } catch (_) {}
        }

        try {
          var vv = window.visualViewport;
          if (vv) {
            vv.addEventListener("resize", syncAiDrawer, { passive: true });
            vv.addEventListener("scroll", syncAiDrawer, { passive: true });
          }
          window.addEventListener("resize", syncAiDrawer, { passive: true });
          window.addEventListener("orientationchange", syncAiDrawer, { passive: true });
          document.addEventListener("focusin", function (event) {
            var target = event.target;
            var placeholder = String(target?.getAttribute?.("placeholder") || "").toLowerCase();
            if (placeholder.includes("اكتب سؤالك") || placeholder.includes("ask anything")) {
              setTimeout(syncAiDrawer, 40);
              setTimeout(syncAiDrawer, 180);
              setTimeout(syncAiDrawer, 400);
            }
          }, true);

          var observer = new MutationObserver(function () {
            syncAiDrawer();
            keepTikTokInsideIframe();
          });
          observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["src", "style"]
          });
          setTimeout(syncAiDrawer, 0);
          setTimeout(syncAiDrawer, 300);
          setTimeout(keepTikTokInsideIframe, 0);
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/networkGuard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/android-ui-fixes.js"></script>
  </body>
</html>
