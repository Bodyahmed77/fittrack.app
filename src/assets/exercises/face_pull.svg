<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53e3e" />
      <stop offset="100%" stop-color="#c53030" />
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- cable pulley top center -->
  <rect x="80" y="16" width="40" height="12" rx="6" fill="url(#cable)" />
  <path d="M100 28 L100 60" stroke="#cbd5e0" stroke-width="3" />
  <!-- body standing -->
  <rect x="78" y="80" width="44" height="66" rx="12" fill="url(#shirt)" />
  <!-- head facing up -->
  <circle cx="100" cy="62" r="15" fill="url(#skin)" />
  <!-- arms pulling rope to face -->
  <path
    d="M86 90 L70 80 L64 66 L70 60"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M114 90 L130 80 L136 66 L130 60"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands at face -->
  <circle cx="70" cy="60" r="8" fill="url(#skin)" />
  <circle cx="130" cy="60" r="8" fill="url(#skin)" />
  <!-- rope -->
  <path
    d="M100 60 L70 60 M100 60 L130 60 M100 28 L100 60"
    fill="none"
    stroke="#e2e8f0"
    stroke-width="4"
    stroke-linecap="round"
  />
  <!-- legs -->
  <rect x="84" y="146" width="14" height="30" rx="5" fill="#2d3748" />
  <rect x="102" y="146" width="14" height="30" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="180" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="98" y="180" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
