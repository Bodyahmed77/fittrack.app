<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38a169" />
      <stop offset="100%" stop-color="#2f855a" />
    </linearGradient>
    <linearGradient id="dumbbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- body standing (back view) -->
  <rect x="78" y="86" width="44" height="66" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="68" r="15" fill="url(#skin)" />
  <!-- arms behind body curling -->
  <path
    d="M84 96 L64 104 L54 122"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M116 96 L136 104 L146 122"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="54" cy="126" r="8" fill="url(#skin)" />
  <circle cx="146" cy="126" r="8" fill="url(#skin)" />
  <!-- dumbbells behind -->
  <rect x="38" y="120" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <rect x="52" y="124" width="7" height="8" rx="2" fill="#cbd5e0" />
  <rect x="61" y="120" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <rect x="127" y="120" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <rect x="141" y="124" width="7" height="8" rx="2" fill="#cbd5e0" />
  <rect x="150" y="120" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <!-- legs -->
  <rect x="84" y="152" width="14" height="28" rx="5" fill="#2d3748" />
  <rect x="102" y="152" width="14" height="28" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="184" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="98" y="184" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
