name: Build Fifty Fit Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed Claude source fix once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')
          if 'const keyboardInset = 0;' in text:
              old = '''  const [reportTarget, setReportTarget] = useState(null);\n  const [reportReason, setReportReason] = useState(\"\");\n  const [reportBusy, setReportBusy] = useState(false);\n  const keyboardInset = 0;\n  const listRef = useRef(null);\n  const inputBarRef = useRef(null);'''
              new = '''  const [reportTarget, setReportTarget] = useState(null);\n  const [reportReason, setReportReason] = useState(\"\");\n  const [reportBusy, setReportBusy] = useState(false);\n  const [keyboardInset, setKeyboardInset] = useState(0);\n  const listRef = useRef(null);\n  const inputBarRef = useRef(null);'''
              assert text.count(old) == 1, 'AI keyboard state anchor mismatch'
              text = text.replace(old, new, 1)

              old = '''  useEffect(() => {\n    try {\n      import(\"@capacitor/keyboard\").then(({ Keyboard }) => Keyboard.setResizeMode?.({ mode: \"native\" })).catch(() => {});\n    } catch {}\n  }, [open]);'''
              new = '''  useEffect(() => {\n    if (!open) return undefined;\n    let cancelled = false;\n    let handles = [];\n    import(\"@capacitor/keyboard\")\n      .then(async ({ Keyboard }) => {\n        if (cancelled) return;\n        const onShow = (info) => {\n          setKeyboardInset(Math.max(0, Number(info?.keyboardHeight) || 0));\n        };\n        const onHide = () => setKeyboardInset(0);\n        const registered = await Promise.all([\n          Keyboard.addListener(\"keyboardWillShow\", onShow),\n          Keyboard.addListener(\"keyboardDidShow\", onShow),\n          Keyboard.addListener(\"keyboardWillHide\", onHide),\n          Keyboard.addListener(\"keyboardDidHide\", onHide),\n        ]);\n        if (cancelled) {\n          registered.forEach((h) => { try { h?.remove?.(); } catch {} });\n          return;\n        }\n        handles = registered;\n      })\n      .catch(() => {});\n    return () => {\n      cancelled = true;\n      setKeyboardInset(0);\n      handles.forEach((h) => { try { h?.remove?.(); } catch {} });\n    };\n  }, [open]);'''
              assert text.count(old) == 1, 'AI keyboard listener anchor mismatch'
              text = text.replace(old, new, 1)

              old = '''          // Lift entire drawer above the soft keyboard (dynamic inset).\n          bottom: 0,'''
              new = '''          // Lift the entire drawer above the live keyboard height.\n          bottom: keyboardInset,'''
              assert text.count(old) == 1, 'AI keyboard panel anchor mismatch'
              text = text.replace(old, new, 1)

              old = '          transition: "none",'
              new = '          transition: keyboardInset ? "bottom 0.15s ease-out" : "none",'
              assert text.count(old) == 1, 'AI keyboard transition anchor mismatch'
              text = text.replace(old, new, 1)
              app.write_text(text, encoding='utf-8')

          vite = Path('vite.config.js')
          text = vite.read_text(encoding='utf-8')
          old = '''      // Keep native Android keyboard resize as the single source of truth.\n      out = out.replace(\n        /const \\[keyboardInset, setKeyboardInset\\] = useState\\([^)]*\\);/,\n        'const [keyboardInset, setKeyboardInset] = useState(0);',\n      );'''
          new = '''      // AI Coach keyboard: validate real keyboard tracking; do not rewrite\n      // the source back to a dead zero inset during the production build.\n      requirePatch(\n        !/const keyboardInset = 0;/.test(out) && /\\[keyboardInset, setKeyboardInset\\] = useState/.test(out),\n        "AI Coach keyboard inset must be tracked, not hardcoded",\n      );'''
          if old in text:
              text = text.replace(old, new, 1)
              vite.write_text(text, encoding='utf-8')

          print('Reviewed Claude source fixes applied directly to source files.')
          PY
          if git diff --quiet -- src/App.jsx vite.config.js; then
            echo "Source fixes already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.jsx vite.config.js
            git commit -m "fix: AI Coach keyboard tracking and hardening"
            git push origin HEAD:main
            echo "Source fix committed to main; stopping this run so the next run builds the committed source."
            exit 0
          fi
      - name: Apply admin publishing gate fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fix-admin-publish-gates.py
          if git diff --quiet -- admin/app.js; then
            echo "Admin publish gates already fixed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add admin/app.js
            git commit -m "fix: allow admin plan publishing for Free users"
            git push origin HEAD:main
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36 / build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Extract Google Web Client ID
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/extract-google-web-client-id.py
      - name: Build the web app from the repository source
        run: npm run build
      - name: Add the Android platform
        run: npx cap add android || true
      - name: Inject native TikTok WebView
        run: python3 scripts/inject-tiktok-webview.py
      - name: Inject google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}"
          mkdir -p android/app
          echo "$GS_B64" | base64 -d > android/app/google-services.json
          python3 - <<'PY'
          import json
          p='android/app/google-services.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d.get('project_info', {}).get('project_id') == 'fittrack-698fa'
          packages=[(c.get('client_info') or {}).get('android_client_info', {}).get('package_name') for c in d.get('client') or []]
          assert 'com.bodyahmed77.fiftyfit' in packages
          print('google-services.json OK for com.bodyahmed77.fiftyfit')
          PY
      - name: Configure Google Services and Google Sign-In
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android')
          rb=root/'build.gradle'
          ab=root/'app'/'build.gradle'
          text=rb.read_text(encoding='utf-8')
          if "com.google.gms:google-services" not in text:
              text=text.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'", 1)
          rb.write_text(text,encoding='utf-8')
          text=ab.read_text(encoding='utf-8')
          if "play-services-auth" not in text:
              text=text.replace("dependencies {", "dependencies {\n    implementation 'com.google.android.gms:play-services-auth:21.0.0'", 1)
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          if "enableSplit = false" not in text:
              text += "\nandroid {\n    bundle {\n        language { enableSplit = false }\n    }\n}\n"
          ab.write_text(text,encoding='utf-8')
          PY
      - name: Force Android API 36 target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          text=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          if 'targetSdkVersion' not in text: text += '\next.targetSdkVersion = 36\n'
          if 'compileSdkVersion' not in text: text += '\next.compileSdkVersion = 36\n'
          p.write_text(text,encoding='utf-8')
          print('Android target/compile SDK = 36')
          PY
      - name: Set monotonic Play version code
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('android/app/build.gradle')
          text=p.read_text(encoding='utf-8')
          run_number=int(os.environ.get('GITHUB_RUN_NUMBER','1'))
          version_code=1000 + run_number
          if 'defaultConfig {' not in text: raise SystemExit('defaultConfig block not found')
          text=re.sub(r'\n\s*versionCode\s+\d+', '', text)
          text=re.sub(r'\n\s*versionName\s+"[^"]*"', '', text)
          text=text.replace('defaultConfig {', f'defaultConfig {{\n        versionCode {version_code}\n        versionName "1.0.{run_number}"', 1)
          p.write_text(text,encoding='utf-8')
          print(f'Play versionCode={version_code}, versionName=1.0.{run_number}')
          PY
      - name: Generate app assets and sync Capacitor
        run: |
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Force black Android system bars
        run: python3 scripts/inject-android-system-ui.py
      - name: Verify Android release configuration
        working-directory: android
        run: |
          grep -n "targetSdkVersion\|compileSdkVersion" variables.gradle
          grep -n "namespace\|applicationId\|versionCode\|versionName" app/build.gradle
          test "$(grep -o 'applicationId "[^"]*"' app/build.gradle | head -n1 | cut -d'"' -f2)" = "com.bodyahmed77.fiftyfit"
          test "$(grep -o 'namespace "[^"]*"' app/build.gradle | head -n1 | cut -d'"' -f2)" = "com.bodyahmed77.fiftyfit"
          test -s app/src/main/assets/public/index.html
          test -s app/src/main/java/com/bodyahmed77/fiftyfit/TikTokWebViewPlugin.java
          test -s app/src/main/java/com/bodyahmed77/fiftyfit/TikTokWebViewActivity.java
      - name: Verify release artifacts will use identical web assets
        working-directory: android
        run: |
          set -euo pipefail
          test -s app/src/main/assets/public/index.html
          sha256sum app/src/main/assets/public/index.html
          echo "AAB and APK are built in the same Gradle invocation from the same Android/web source tree."
      - name: Decode release signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}"
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore
      - name: Build signed release AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          last_rc=1
          for attempt in 1 2 3; do
            echo "Gradle release build attempt ${attempt}/3"
            if ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"; then
              last_rc=0
              break
            fi
            last_rc=$?
            echo "Gradle build attempt ${attempt} failed (rc=${last_rc}). Retrying after a short delay..."
            sleep $((attempt * 5))
          done
          exit "$last_rc"
      - name: Verify AAB and APK exist and are non-empty
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/bundle/release/app-release.aab
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/apk/release/app-release.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-release-aab-api36
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-release-apk-api36
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
