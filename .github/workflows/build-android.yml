# Single source of truth for the deterministic Android release build.
# Every AAB is required to pass the final Billing diagnostics verification before upload.
name: Build Fifty Fit Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: tools platform-tools

      - name: Install Android API 36 / build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies without source-mutating postinstall
        run: npm ci --ignore-scripts

      - name: Apply required native billing patches only
        run: |
          set -euo pipefail
          python3 scripts/apply-billing-native-diagnostics.py
          python3 scripts/apply-billing-native-offer-diagnostics.py
          python3 scripts/apply-google-native-diagnostics.py

      - name: Verify canonical billing source before build
        run: |
          set -euo pipefail
          test -s src/App.jsx
          test -s src/billing.js
          test -s src/config.js
          node --check src/googleAuth.js
          node --check src/billing.js
          python3 - <<'PY'
          from pathlib import Path
          app = Path('src/App.jsx').read_text(encoding='utf-8')
          billing = Path('src/billing.js').read_text(encoding='utf-8')
          required_app = [
              'const shouldUnlock = result?.success === true;',
              'formatBillingFailureToast',
              'Google Play code:',
          ]
          required_billing = [
              'launchBillingFlow',
              'launchBillingFlow_result',
              'responseCode',
              'debugMessage',
              'offerToken',
          ]
          for needle in required_app:
              assert needle in app, f'App.jsx missing canonical billing source: {needle}'
          for needle in required_billing:
              assert needle in billing, f'billing.js missing canonical diagnostic: {needle}'
          print('Canonical billing source gate passed')
          PY

      - name: Extract Google Web Client ID
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/extract-google-web-client-id.py

      - name: Build web application
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          else
            echo 'Android platform already present; using tracked project.'
          fi

      - name: Inject google-services.json and validate OAuth
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}" || { echo 'GOOGLE_SERVICES_JSON_BASE64 secret is missing'; exit 1; }
          mkdir -p android/app
          printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('android/app/google-services.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d.get('project_info', {}).get('project_id') == 'fittrack-698fa'
          clients = [c for c in (d.get('client') or []) if ((c.get('client_info') or {}).get('android_client_info') or {}).get('package_name') == 'com.bodyahmed77.fiftyfit']
          assert clients, 'No matching Android OAuth client for com.bodyahmed77.fiftyfit'
          print('Firebase/google-services preflight passed')
          PY

      - name: Configure Android Google services and API levels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('android')
          top = root / 'build.gradle'
          app = root / 'app' / 'build.gradle'
          vars_file = root / 'variables.gradle'

          text = top.read_text(encoding='utf-8')
          if 'com.google.gms:google-services' not in text:
              text = text.replace('dependencies {', "dependencies {\n    classpath 'com.google.gms:google-services:4.4.0'", 1)
          top.write_text(text, encoding='utf-8')

          text = app.read_text(encoding='utf-8')
          if 'play-services-auth' not in text:
              text = text.replace('dependencies {', "dependencies {\n    implementation 'com.google.android.gms:play-services-auth:21.0.0'", 1)
          if 'com.google.gms.google-services' not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          if 'enableSplit = false' not in text:
              text += "\nandroid { bundle { language { enableSplit = false } } }\n"
          app.write_text(text, encoding='utf-8')

          text = vars_file.read_text(encoding='utf-8')
          text = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          text = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          vars_file.write_text(text, encoding='utf-8')
          PY

      - name: Set monotonic Play version code
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          t = p.read_text(encoding='utf-8')
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          t = re.sub(r'\n\s*versionCode\s+\d+', '', t)
          t = re.sub(r'\n\s*versionName\s+"[^"]*"', '', t)
          t = t.replace('defaultConfig {', f'defaultConfig {{\n        versionCode {2000+n}\n        versionName "1.0.{n}"', 1)
          p.write_text(t, encoding='utf-8')
          print(f'versionCode={2000+n}, versionName=1.0.{n}')
          PY

      - name: Sync Capacitor and apply native app patches
        run: |
          set -euo pipefail
          npx capacitor-assets generate --android
          npx cap sync android
          python3 scripts/inject-tiktok-webview.py
          python3 scripts/inject-android-system-ui.py

      - name: Verify native Billing bridge after Capacitor sync
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('android').rglob('BillingPlugin.java'))
          assert candidates, 'No generated capacitor-billing BillingPlugin.java found after cap sync'
          matches = []
          for p in candidates:
              text = p.read_text(encoding='utf-8', errors='replace')
              if 'FIFTYFIT_BILLING_ERROR' in text and 'PendingPurchasesParams' in text and 'QueryProductDetailsResult' in text:
                  matches.append(p)
          assert matches, 'Patched PBL9 BillingPlugin did not reach the Android project after cap sync'
          print('Patched native billing bridge present in Android project:', matches[0])
          PY

      - name: Decode release signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || exit 1
          test -n "${ANDROID_KEY_ALIAS:-}" || exit 1
          test -n "${ANDROID_KEY_PASSWORD:-}" || exit 1
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          t = p.read_text(encoding='utf-8')
          if 'signingConfigs {' not in t:
              t = t.replace('android {', '''android {\n    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }''', 1)
          if 'signingConfig signingConfigs.release' not in t:
              t = t.replace('buildTypes {', 'buildTypes {\n        release { signingConfig signingConfigs.release }', 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Verify pre-build artifact content
        run: python3 scripts/verify-release-artifact.py --prebuild

      - name: Android release preflight
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        working-directory: android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          g = Path('app/build.gradle').read_text(encoding='utf-8')
          v = Path('variables.gradle').read_text(encoding='utf-8')
          assert 'com.google.gms.google-services' in g
          assert 'play-services-auth' in g
          assert 'enableSplit = false' in g
          assert 'compileSdkVersion = 36' in v and 'targetSdkVersion = 36' in v
          assert re.findall(r'\bapplicationId\s+["\']([^"\']+)["\']', g) == ['com.bodyahmed77.fiftyfit']
          expected = str(2000 + int(os.environ['GITHUB_RUN_NUMBER']))
          assert re.findall(r'\bversionCode\s+(\d+)', g) == [expected]
          assert Path('app/release.keystore').is_file()
          print(f'Android release preflight passed: versionCode={expected}')
          PY

      - name: Build signed release AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Collect release artifacts
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          AAB=$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n1)
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)
          test -n "$AAB" && test -n "$APK"
          cp "$AAB" release-artifacts/fifty-fit-release.aab
          cp "$APK" release-artifacts/fifty-fit-release.apk
          sha256sum release-artifacts/*

      - name: Verify final AAB and APK contents
        run: python3 scripts/verify-release-artifact.py

      - name: Upload verified AAB
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-verified-release-aab-${{ github.run_number }}
          path: android/release-artifacts/fifty-fit-release.aab
          if-no-files-found: error

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-verified-release-apk-${{ github.run_number }}
          path: android/release-artifacts/fifty-fit-release.apk
          if-no-files-found: error
