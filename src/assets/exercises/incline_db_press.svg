<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dd6b20" />
      <stop offset="100%" stop-color="#c05621" />
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>
    <linearGradient id="dumbbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- incline bench back -->
  <path d="M40 150 L90 92 L150 110 L150 122 L40 162 Z" fill="url(#steel)" />
  <!-- seat -->
  <rect x="38" y="150" width="60" height="10" rx="5" fill="#718096" />
  <!-- legs -->
  <rect x="46" y="160" width="8" height="30" rx="4" fill="#718096" />
  <rect x="146" y="126" width="8" height="30" rx="4" fill="#718096" />
  <!-- body seated on incline -->
  <path d="M78 100 L96 84 L124 90 L124 120 L78 126 Z" fill="url(#shirt)" />
  <!-- arms pressing dumbbells up -->
  <path
    d="M90 92 L80 58 L72 52"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M118 92 L128 58 L136 52"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="72" cy="52" r="8" fill="url(#skin)" />
  <circle cx="136" cy="52" r="8" fill="url(#skin)" />
  <!-- dumbbells -->
  <rect x="52" y="44" width="12" height="15" rx="3" fill="url(#dumbbell)" />
  <rect x="66" y="48" width="8" height="7" rx="2" fill="#cbd5e0" />
  <rect x="76" y="44" width="12" height="15" rx="3" fill="url(#dumbbell)" />
  <rect x="112" y="44" width="12" height="15" rx="3" fill="url(#dumbbell)" />
  <rect x="126" y="48" width="8" height="7" rx="2" fill="#cbd5e0" />
  <rect x="136" y="44" width="12" height="15" rx="3" fill="url(#dumbbell)" />
  <!-- head -->
  <circle cx="101" cy="74" r="13" fill="url(#skin)" />
  <!-- legs -->
  <rect x="70" y="150" width="14" height="14" rx="4" fill="#2d3748" />
  <rect x="96" y="150" width="14" height="14" rx="4" fill="#2d3748" />
  <!-- feet -->
  <rect x="62" y="186" width="24" height="8" rx="4" fill="#2d3748" />
  <rect x="104" y="186" width="24" height="8" rx="4" fill="#2d3748" />
</svg>
