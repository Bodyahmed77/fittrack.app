<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38a169" />
      <stop offset="100%" stop-color="#2f855a" />
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- cable machine top -->
  <rect x="60" y="20" width="80" height="12" rx="6" fill="url(#cable)" />
  <rect x="70" y="32" width="8" height="60" rx="4" fill="#718096" />
  <rect x="122" y="32" width="8" height="60" rx="4" fill="#718096" />
  <!-- cable line -->
  <path d="M100 24 L100 70" stroke="#cbd5e0" stroke-width="3" />
  <!-- body standing -->
  <rect x="78" y="90" width="44" height="60" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="72" r="15" fill="url(#skin)" />
  <!-- arms pushing down on bar -->
  <path
    d="M84 100 L70 120 L64 140"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M116 100 L130 120 L136 140"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="64" cy="142" r="8" fill="url(#skin)" />
  <circle cx="136" cy="142" r="8" fill="url(#skin)" />
  <!-- pushdown bar -->
  <rect x="52" y="138" width="96" height="9" rx="4.5" fill="url(#cable)" />
  <!-- legs -->
  <rect x="84" y="150" width="14" height="30" rx="5" fill="#2d3748" />
  <rect x="102" y="150" width="14" height="30" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="184" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="98" y="184" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
