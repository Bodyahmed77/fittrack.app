name: One-time admin plans and TikTok fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        run: |
          python3 scripts/one_time_admin_plans_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-admin-plans-fix.yml scripts/one_time_admin_plans_fix.py
          git add src/App.jsx admin/app.js index.html docs/index.html docs/admin/boot.js docs/admin/index.html
          git commit -m "fix: keep admin plans, pages dashboard, notification routes and in-app TikTok"
          git push
