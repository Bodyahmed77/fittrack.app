name: One-time App.jsx release fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply focused App.jsx fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          original = text

          if 'deleteAccountServerData' not in text:
              raise SystemExit('Expected deleteAccountServerData import/reference is missing')

          # AI-only subscribers must be treated as Pro in Settings.
          pro_pattern = re.compile(r'const pro = data\.entitlements\.trainingPro\s*\|\|\s*data\.entitlements\.nutritionPro\s*;')
          matches = list(pro_pattern.finditer(text))
          if len(matches) > 1:
              raise SystemExit(f'Found {len(matches)} matching pro expressions; refusing ambiguous edit')
          if len(matches) == 1:
              text = pro_pattern.sub(
                  'const pro = data.entitlements.trainingPro || data.entitlements.nutritionPro || data.entitlements.aiCoachPro;',
                  text,
                  count=1,
              )

          # Account deletion must clean server-side Supabase data before any local/Auth deletion.
          start = text.find('function DeleteAccountScreen')
          if start < 0:
              raise SystemExit('DeleteAccountScreen not found')
          next_fn = text.find('\nfunction ', start + len('function DeleteAccountScreen'))
          end = next_fn if next_fn >= 0 else len(text)
          section = text[start:end]

          if 'await deleteAccountServerData()' not in section:
              # Insert immediately before the first local Firestore/Auth deletion.
              boundary = re.search(r'(?m)^\s*await\s+deleteDoc\s*\(', section)
              if not boundary:
                  boundary = re.search(r'(?m)^\s*await\s+deleteUser\s*\(', section)
              if not boundary:
                  raise SystemExit('Could not find local account deletion boundary')
              line_start = section.rfind('\n', 0, boundary.start()) + 1
              indent = re.match(r'[ \t]*', section[line_start:]).group(0)
              section = section[:line_start] + indent + 'await deleteAccountServerData();\n' + section[line_start:]
              text = text[:start] + section + text[end:]

          if text == original:
              raise SystemExit('No changes were necessary')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate focused changes
        run: |
          grep -n 'deleteAccountServerData' src/App.jsx
          if ! grep -Eq 'const pro = data\.entitlements\.trainingPro \|\| data\.entitlements\.nutritionPro \|\| data\.entitlements\.aiCoachPro;' src/App.jsx; then
            echo 'AI-only Pro expression was not found; it may already be wired.'
          fi

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/one-time-appjsx-fix.yml
          git commit -m 'fix: finish account deletion and AI-only settings [skip ci]'
          git push
