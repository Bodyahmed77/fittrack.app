<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53e3e" />
      <stop offset="100%" stop-color="#c53030" />
    </linearGradient>
    <linearGradient id="dumbbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- body standing -->
  <rect x="78" y="80" width="44" height="70" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="62" r="15" fill="url(#skin)" />
  <!-- arms raised sideways -->
  <path
    d="M84 90 L58 74 L44 58"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M116 90 L142 74 L156 58"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="44" cy="58" r="8" fill="url(#skin)" />
  <circle cx="156" cy="58" r="8" fill="url(#skin)" />
  <!-- dumbbells -->
  <rect x="30" y="48" width="11" height="15" rx="3" fill="url(#dumbbell)" />
  <rect x="43" y="52" width="7" height="7" rx="2" fill="#cbd5e0" />
  <rect x="52" y="48" width="11" height="15" rx="3" fill="url(#dumbbell)" />
  <rect x="137" y="48" width="11" height="15" rx="3" fill="url(#dumbbell)" />
  <rect x="150" y="52" width="7" height="7" rx="2" fill="#cbd5e0" />
  <rect x="159" y="48" width="11" height="15" rx="3" fill="url(#dumbbell)" />
  <!-- legs -->
  <rect x="84" y="150" width="14" height="30" rx="5" fill="#2d3748" />
  <rect x="102" y="150" width="14" height="30" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="184" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="98" y="184" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
