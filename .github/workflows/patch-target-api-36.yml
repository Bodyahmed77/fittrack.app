name: Require Android API 36

on:
  push:
    branches:
      - fix/fifty-fit-launch-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch release workflow
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-android.yml')
          text=p.read_text(encoding='utf-8')
          marker='''      - name: Configure Google Services and Google Sign-In (idempotent)\n'''
          step='''      - name: Force Android 16 / API 36 target for Google Play\n        run: |\n          set -euo pipefail\n          python3 - <<'ENDAPI36'\n          from pathlib import Path\n          p = Path("android/variables.gradle")\n          text = p.read_text(encoding="utf-8")\n          import re\n          text = re.sub(r"targetSdkVersion\\s*=\\s*\\d+", "targetSdkVersion = 36", text)\n          text = re.sub(r"compileSdkVersion\\s*=\\s*\\d+", "compileSdkVersion = 36", text)\n          if "targetSdkVersion" not in text:\n              text += "\\next.targetSdkVersion = 36\\n"\n          if "compileSdkVersion" not in text:\n              text += "\\next.compileSdkVersion = 36\\n"\n          p.write_text(text, encoding="utf-8")\n          print(p.read_text(encoding="utf-8"))\n          ENDAPI36\n\n'''
          if marker not in text: raise SystemExit('build workflow marker missing')
          if 'Force Android 16 / API 36 target' not in text:
              text=text.replace(marker,step+marker,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-android.yml
          git diff --cached --check
          git commit -m "build: target Android API 36 for Google Play"
          git fetch origin fix/fifty-fit-launch-polish
          git rebase origin/fix/fifty-fit-launch-polish
          git push origin HEAD:fix/fifty-fit-launch-polish
          git rm .github/workflows/patch-target-api-36.yml
          git commit -m "chore: remove temporary API 36 patch workflow"
          git fetch origin fix/fifty-fit-launch-polish
          git rebase origin/fix/fifty-fit-launch-polish
          git push origin HEAD:fix/fifty-fit-launch-polish
