<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Fifty Fit</title>
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        background: #000000;
        overflow-x: hidden;
      }
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      #fiftyfit-boot-fallback { display:none; }
    </style>
    <script>
      (function () {
        window.__FIFTYFIT_BOOT_OK__ = false;
        window.__FIFTYFIT_MARK_BOOT_OK__ = function () {
          window.__FIFTYFIT_BOOT_OK__ = true;
          var node = document.getElementById("fiftyfit-boot-fallback");
          if (node) node.remove();
        };
        function bootFallback() {
          if (window.__FIFTYFIT_BOOT_OK__) return;
          var root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return;
          root.innerHTML = '<div id="fiftyfit-boot-fallback" style="min-height:100%;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;padding:24px;font-family:system-ui,sans-serif;text-align:center"><div style="max-width:340px"><div style="font-size:22px;font-weight:900;margin-bottom:8px">Fifty Fit</div><div style="color:#aaa;font-size:13px;line-height:1.6">Fifty Fit could not start correctly. Please reload the page.</div><button onclick="location.reload()" style="margin-top:18px;width:100%;padding:13px 16px;border:0;border-radius:12px;background:#fff;color:#000;font-weight:900;font-size:14px">Reload</button></div></div>';
        }
        window.setTimeout(bootFallback, 20000);
      })();
    </script>
    <script>
      /* Lightweight runtime guard for the AI composer only. */
      (function () {
        function keyboardInset() {
          try {
            var vv = window.visualViewport;
            if (!vv) return 0;
            return Math.max(0, Math.round(window.innerHeight - vv.height - (vv.offsetTop || 0)));
          } catch (_) { return 0; }
        }
        function findAiDrawer() {
          var target = document.activeElement;
          if (!target) return null;
          var placeholder = String(target.getAttribute && target.getAttribute("placeholder") || "").toLowerCase();
          if (!placeholder.includes("اكتب سؤالك") && !placeholder.includes("ask anything")) return null;
          var node = target;
          for (var i = 0; node && i < 10; i++, node = node.parentElement) {
            var cs = window.getComputedStyle(node);
            if (cs.position === "fixed" && Number.parseInt(cs.zIndex || "0", 10) >= 1000) return node;
          }
          return null;
        }
        function syncAiDrawer() {
          try {
            var inset = keyboardInset();
            var drawer = findAiDrawer();
            if (!drawer) return;
            drawer.style.setProperty("bottom", inset + "px", "important");
            drawer.style.setProperty("height", "calc(100% - " + inset + "px)", "important");
            drawer.style.setProperty("max-height", "calc(100% - " + inset + "px)", "important");
            drawer.style.setProperty("padding-bottom", "0px", "important");
            drawer.style.setProperty("background", "#000000", "important");
          } catch (_) {}
        }
        try {
          var vv = window.visualViewport;
          if (vv) {
            vv.addEventListener("resize", syncAiDrawer, { passive: true });
            vv.addEventListener("scroll", syncAiDrawer, { passive: true });
          }
          window.addEventListener("resize", syncAiDrawer, { passive: true });
          window.addEventListener("orientationchange", syncAiDrawer, { passive: true });
          document.addEventListener("focusin", function () {
            setTimeout(syncAiDrawer, 30);
            setTimeout(syncAiDrawer, 140);
            setTimeout(syncAiDrawer, 350);
          }, true);
          setTimeout(syncAiDrawer, 0);
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/networkGuard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      import { startPlanNotificationBridge } from "/src/planNotifications.js";
      startPlanNotificationBridge();
    </script>
  </body>
</html>
