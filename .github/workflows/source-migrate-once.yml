name: Source migration once

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-level fixes and commit source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')
          changed = False

          # TikTok: route the original stored URL to the in-app native WebView,
          # never to Browser.open / the external TikTok application.
          if 'import { Browser } from "@capacitor/browser";' in text:
              text = text.replace('import { Browser } from "@capacitor/browser";\n', '', 1)
              changed = True
          pattern = re.compile(r'async function openTikTokVideo\(tikTokUrl, ar\) \{.*?\n\}\n\nfunction VideoPlayer', re.S)
          replacement = '''async function openTikTokVideo(tikTokUrl, ar) {\n  const raw = String(tikTokUrl || "").trim();\n  if (!raw) return;\n  try {\n    const { openTikTokWebView } = await import("./tiktokWebView");\n    await openTikTokWebView(raw);\n  } catch (error) {\n    console.error("[TikTok] in-app viewer failed", error);\n    throw new Error(\n      ar\n        ? "تعذر فتح فيديو التمرين داخل التطبيق."\n        : "Could not open the exercise video inside the app.",\n    );\n  }\n}\n\nfunction VideoPlayer'''
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('TikTok viewer function anchor not found')
          if text2 != text:
              text = text2
              changed = True

          # NutritionPlanScreen currently derives the visible day solely from
          # today's date and renders the tabs as non-interactive divs. Replace
          # only that screen's targeted snippets, keeping all other UI intact.
          if 'const [selectedDayIndex, setSelectedDayIndex] = useState(0);' not in text:
              state_marker = 'function NutritionPlanScreen({ data, back }) {'
              pos = text.find(state_marker)
              if pos < 0: raise SystemExit('NutritionPlanScreen not found')
              state_anchor = 'const [log, setLog] = useState(() => data.customNutritionLog || {});'
              anchor_pos = text.find(state_anchor, pos)
              if anchor_pos < 0: raise SystemExit('Nutrition state anchor not found')
              insert_at = anchor_pos + len(state_anchor)
              text = text[:insert_at] + '\n  const [selectedDayIndex, setSelectedDayIndex] = useState(0);' + text[insert_at:]
              changed = True

          # Find only the NutritionPlanScreen body and patch the existing one-line
          # day calculation, toggle, and tabs.
          start = text.find('function NutritionPlanScreen({ data, back }) {')
          end = text.find('\nfunction ', start + 20)
          if start < 0 or end < 0: raise SystemExit('NutritionPlanScreen boundaries not found')
          block = text[start:end]

          if 'computedTodayDayIndex' not in block:
              parse_idx = block.find('const parseItems =')
              if parse_idx < 0: raise SystemExit('Nutrition parseItems not found')
              parse_end = block.find(';', parse_idx)
              if parse_end < 0: raise SystemExit('Nutrition parseItems terminator not found')
              insert = '''\n  const computedTodayDayIndex = plan?.days?.length\n    ? Math.max(0, Math.min(plan.days.length - 1, (() => {\n        const startDate = plan.startDate || today;\n        const diff = Math.max(0, Math.floor((new Date(today + "T00:00:00").getTime() - new Date(startDate + "T00:00:00").getTime()) / 86400000));\n        return Number.isFinite(diff) ? diff : 0;\n      })()))\n    : 0;\n  useEffect(() => {\n    if (plan) setSelectedDayIndex(computedTodayDayIndex);\n  }, [plan?.startDate, plan?.days?.length, computedTodayDayIndex]);'''
              block = block[:parse_end+1] + insert + block[parse_end+1:]
              changed = True

          old_day = re.compile(r"  const start=plan\.startDate \|\| today;.*? const day=plan\.days\?\.\[dayIndex\].*? const checked=log\[today\] \|\| \{\}; const meals=day\.meals \|\| \[\];")
          new_day = '  const dayIndex = Math.max(0, Math.min((plan.days?.length || 1) - 1, selectedDayIndex)); const day = plan.days?.[dayIndex] || plan.days?.[0] || {meals:[]}; const logKey = `${plan.startDate || today}:day-${dayIndex}`; const checked = log[logKey] || (dayIndex === computedTodayDayIndex ? (log[today] || {}) : {}); const meals = day.meals || [];'
          block2, n = old_day.subn(new_day, block, count=1)
          if n == 1:
              block = block2
              changed = True

          old_toggle = re.compile(r"  const toggle=async id=>\{.*?\};")
          new_toggle = '  const toggle=async id=>{if(!auth.currentUser||saving)return;const next={...log,[logKey]:{...(log[logKey]||{}),[id]:!checked[id]}};if(!next[logKey][id])delete next[logKey][id];setLog(next);setSaving(true);try{await setDoc(doc(db,\'users\',auth.currentUser.uid),{customNutritionLog:next},{merge:true});}catch{setLog(log);}finally{setSaving(false);}};'
          block2, n = old_toggle.subn(new_toggle, block, count=1)
          if n == 1:
              block = block2
              changed = True

          old_tabs = re.compile(r"<div style=\{\{display:'flex',gap:6,overflowX:'auto',paddingBottom:8\}\}>\{\(plan\.days\|\|\[\]\)\.map\(\(d,i\)=>.*?</div>", re.S)
          new_tabs = '<div style={{display:\'flex\',gap:6,overflowX:\'auto\',paddingBottom:8}}>{(plan.days||[]).map((d,i)=><button key={i} type="button" onClick={()=>setSelectedDayIndex(i)} style={{minWidth:72,padding:\'9px 7px\',borderRadius:11,background:i===dayIndex?C.green:C.card2,color:i===dayIndex?C.onAccent:C.sub,textAlign:\'center\',fontSize:11,fontWeight:800,border:\'none\',cursor:\'pointer\',flexShrink:0}}>{ar?(d.titleAr||`اليوم ${i+1}`):(d.title||`Day ${i+1}`)}</button>)}</div>'
          block2, n = old_tabs.subn(new_tabs, block, count=1)
          if n == 1:
              block = block2
              changed = True

          text = text[:start] + block + text[end:]

          # Make admin-assigned custom nutrition plans visible in Meals for Free
          # users, while preserving the existing Pro paywall when no plan exists.
          meals_start = text.find('function MealsScreen({')
          meals_end = text.find('\nfunction ', meals_start + 20)
          if meals_start >= 0 and meals_end > meals_start:
              meals = text[meals_start:meals_end]
              old = '  const targets = data.dailyTargets;\n  const kcalTarget = targets?.kcal || 2000;'
              new = '''  const customTodayPlanIndex = customNutritionPlan?.days?.length\n    ? Math.max(0, Math.min(customNutritionPlan.days.length - 1, (() => {\n        const startDate = customNutritionPlan.startDate || today;\n        const diff = Math.max(0, Math.floor((new Date(today + "T00:00:00").getTime() - new Date(startDate + "T00:00:00").getTime()) / 86400000));\n        return Number.isFinite(diff) ? diff : 0;\n      })()))\n    : 0;\n  const targets = customNutritionPlan?.days?.[customTodayPlanIndex] || data.dailyTargets;\n  const kcalTarget = targets?.kcal || targets?.targetKcal || 2000;'''
              if old in meals:
                  meals = meals.replace(old, new, 1)
                  changed = True
              if '        {!pro ? (' in meals:
                  meals = meals.replace('        {!pro ? (', '        {!customNutritionPlan && !pro ? (', 1)
                  changed = True
              text = text[:meals_start] + meals + text[meals_end:]

          app.write_text(text, encoding='utf-8')

          # Prevent the in-app WebView from creating windows or using JS to open
          # a non-http(s) target that could escape to the TikTok app.
          bridge = Path('scripts/inject-tiktok-webview.py')
          bt = bridge.read_text(encoding='utf-8')
          if 's.setSupportMultipleWindows(false);' not in bt:
              marker = '        s.setMediaPlaybackRequiresUserGesture(false);\n'
              if marker not in bt: raise SystemExit('TikTok bridge settings anchor not found')
              bt = bt.replace(marker, marker + '        s.setSupportMultipleWindows(false);\n        s.setJavaScriptCanOpenWindowsAutomatically(false);\n', 1)
              bridge.write_text(bt, encoding='utf-8')
              changed = True

          # This script must never recreate a build-time rewrite script.
          release = Path('scripts/release-fixes-v7.py')
          if release.exists():
              release.unlink()
              changed = True

          print('CHANGED', changed)
          print('TIKTOK_BRIDGE', 'openTikTokWebView' in text)
          print('NUTRITION_SELECT', 'setSelectedDayIndex(i)' in text)
          print('CARDIO_ALREADY_ATOMIC', 'await persist(true, null, 35)' in text)
          print('V7_REMOVED', not release.exists())
          assert 'openTikTokWebView' in text
          assert 'setSelectedDayIndex(i)' in text
          assert 'await persist(true, null, 35)' in text
          assert not release.exists()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx scripts/inject-tiktok-webview.py
          git add -A
          if git diff --cached --quiet; then
            echo "Source fixes already applied."
          else
            git commit -m "fix: selectable nutrition days and in-app TikTok viewer"
            git push origin HEAD:main
          fi
