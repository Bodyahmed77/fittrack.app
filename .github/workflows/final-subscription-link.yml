name: Final Play subscription link

on:
  push:
    branches:
      - fix/fifty-fit-launch-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch link
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          text=p.read_text(encoding='utf-8')
          needle='''                : "Restore purchases"}\n            </button>\n          </div>'''
          repl='''                : "Restore purchases"}\n            </button>\n            <a href="https://play.google.com/store/account/subscriptions?package=com.fittrack.app" target="_blank" rel="noopener noreferrer" style={{ display: "inline-block", marginTop: 10, color: C.sub2, fontSize: 11, textDecoration: "underline", textUnderlineOffset: 3 }}>\n              {ar ? "إدارة أو إلغاء الاشتراك من Google Play" : "Manage or cancel subscription on Google Play"}\n            </a>\n          </div>'''
          if needle not in text: raise SystemExit('restore UI marker missing')
          p.write_text(text.replace(needle,repl,1),encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit against latest branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --check
          git commit -m "feat: add Google Play subscription management link"
          git fetch origin fix/fifty-fit-launch-polish
          git rebase origin/fifty-fit-launch-polish || git rebase origin/fix/fifty-fit-launch-polish
          git push --force-with-lease origin HEAD:fix/fifty-fit-launch-polish
          git rm .github/workflows/final-subscription-link.yml
          git commit -m "chore: remove temporary subscription link workflow"
          git fetch origin fix/fifty-fit-launch-polish
          git rebase origin/fix/fifty-fit-launch-polish
          git push --force-with-lease origin HEAD:fix/fifty-fit-launch-polish
