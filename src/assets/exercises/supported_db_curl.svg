<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b46c1" />
      <stop offset="100%" stop-color="#553c9a" />
    </linearGradient>
    <linearGradient id="dumbbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- incline bench support -->
  <path d="M60 150 L90 94 L150 112 L150 124 L60 162 Z" fill="#718096" />
  <!-- body leaning on bench, one arm resting -->
  <rect x="86" y="96" width="44" height="60" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="104" cy="80" r="15" fill="url(#skin)" />
  <!-- supporting arm -->
  <path
    d="M88 104 L72 90 L66 96"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- working arm curling -->
  <path
    d="M118 104 L132 118 L140 136"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="140" cy="140" r="8" fill="url(#skin)" />
  <!-- dumbbell -->
  <rect x="132" y="134" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <rect x="146" y="138" width="7" height="8" rx="2" fill="#cbd5e0" />
  <rect x="155" y="134" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <!-- legs -->
  <rect x="92" y="156" width="14" height="26" rx="5" fill="#2d3748" />
  <rect x="112" y="156" width="14" height="26" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="84" y="186" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="108" y="186" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
