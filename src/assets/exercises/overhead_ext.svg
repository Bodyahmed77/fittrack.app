<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3182ce" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <linearGradient id="dumbbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- body standing -->
  <rect x="78" y="92" width="44" height="64" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="74" r="15" fill="url(#skin)" />
  <!-- arms overhead holding dumbbell -->
  <path
    d="M88 96 L74 60 L92 44"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M112 96 L126 60 L108 44"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="92" cy="44" r="8" fill="url(#skin)" />
  <circle cx="108" cy="44" r="8" fill="url(#skin)" />
  <!-- dumbbell overhead -->
  <rect x="78" y="30" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <rect x="92" y="34" width="16" height="8" rx="2" fill="#cbd5e0" />
  <rect x="110" y="30" width="12" height="16" rx="3" fill="url(#dumbbell)" />
  <!-- legs -->
  <rect x="84" y="156" width="14" height="28" rx="5" fill="#2d3748" />
  <rect x="102" y="156" width="14" height="28" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="188" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="98" y="188" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
