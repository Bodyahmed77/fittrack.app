name: Use official TikTok player

on:
  push:
    branches:
      - fix/fifty-fit-launch-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update TikTok player URL
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          text=p.read_text(encoding='utf-8')
          old='''  const embedSrc = isTikTok\n    ? `https://www.tiktok.com/embed/v2/${videoId}`\n    : `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;'''
          new='''  const embedSrc = isTikTok\n    ? `https://www.tiktok.com/player/v1/${videoId}?controls=1&autoplay=0&description=0&music_info=0&rel=0`\n    : `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0&modestbranding=1`;'''
          if old not in text:
              raise SystemExit('TikTok embed source not found')
          text=text.replace(old,new,1)
          # Match the same official player URL in the prefetch path.
          old2='''      ? `https://www.tiktok.com/embed/v2/${videoId}`\n      : `https://www.youtube-nocookie.com/embed/${videoId}?playsinline=1&rel=0`;'''
          new2='''      ? `https://www.tiktok.com/player/v1/${videoId}?controls=1&autoplay=0&description=0&music_info=0&rel=0`\n      : `https://www.youtube-nocookie.com/embed/${videoId}?playsinline=1&rel=0`;'''
          if old2 not in text:
              raise SystemExit('TikTok prefetch source not found')
          text=text.replace(old2,new2,1)
          # Let TikTok receive its normal cross-origin referrer behavior; the
          # official embedded-player documentation does not require no-referrer.
          text=text.replace('          referrerPolicy="no-referrer"\n','          referrerPolicy="strict-origin-when-cross-origin"\n',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate web build
        run: |
          npm ci
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --check
          git commit -m "fix: use official TikTok embedded player"
          git push origin HEAD
          git rm .github/workflows/apply-tiktok-player.yml
          git commit -m "chore: remove temporary TikTok workflow"
          git push origin HEAD
