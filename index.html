<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Fifty Fit</title>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0b0d10; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
    <script>
      /* Lightweight runtime guard for the AI composer only. */
      (function () {
        function keyboardInset() {
          try {
            var vv = window.visualViewport;
            if (!vv) return 0;
            return Math.max(0, Math.round(window.innerHeight - vv.height - (vv.offsetTop || 0)));
          } catch (_) { return 0; }
        }

        function findAiDrawer() {
          var target = document.activeElement;
          if (!target) return null;
          var placeholder = String(target.getAttribute && target.getAttribute("placeholder") || "").toLowerCase();
          if (!placeholder.includes("اكتب سؤالك") && !placeholder.includes("ask anything")) return null;
          var node = target;
          for (var i = 0; node && i < 10; i++, node = node.parentElement) {
            var cs = window.getComputedStyle(node);
            if (cs.position === "fixed" && Number.parseInt(cs.zIndex || "0", 10) >= 1000) return node;
          }
          return null;
        }

        function syncAiDrawer() {
          try {
            var inset = keyboardInset();
            var drawer = findAiDrawer();
            if (!drawer) return;
            drawer.style.setProperty("bottom", inset + "px", "important");
            drawer.style.setProperty("height", "calc(100% - " + inset + "px)", "important");
            drawer.style.setProperty("max-height", "calc(100% - " + inset + "px)", "important");
            drawer.style.setProperty("padding-bottom", "0px", "important");
          } catch (_) {}
        }

        try {
          var vv = window.visualViewport;
          if (vv) {
            vv.addEventListener("resize", syncAiDrawer, { passive: true });
            vv.addEventListener("scroll", syncAiDrawer, { passive: true });
          }
          window.addEventListener("resize", syncAiDrawer, { passive: true });
          window.addEventListener("orientationchange", syncAiDrawer, { passive: true });
          document.addEventListener("focusin", function () {
            setTimeout(syncAiDrawer, 30);
            setTimeout(syncAiDrawer, 140);
            setTimeout(syncAiDrawer, 350);
          }, true);
          setTimeout(syncAiDrawer, 0);
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/networkGuard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      import { startPlanNotificationBridge } from "/src/planNotifications.js";
      startPlanNotificationBridge();
    </script>
  </body>
</html>
