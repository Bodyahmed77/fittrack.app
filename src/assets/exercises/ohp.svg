<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b46c1" />
      <stop offset="100%" stop-color="#553c9a" />
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- shoulder press machine uprights -->
  <rect x="40" y="30" width="10" height="140" rx="5" fill="#718096" />
  <rect x="150" y="30" width="10" height="140" rx="5" fill="#718096" />
  <!-- seat -->
  <rect x="80" y="160" width="40" height="10" rx="5" fill="#2d3748" />
  <!-- body seated -->
  <rect x="76" y="96" width="48" height="64" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="80" r="15" fill="url(#skin)" />
  <!-- arms pressing up -->
  <path
    d="M86 100 L72 70 L66 60"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M114 100 L128 70 L134 60"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="66" cy="60" r="8" fill="url(#skin)" />
  <circle cx="134" cy="60" r="8" fill="url(#skin)" />
  <!-- press handles -->
  <rect x="52" y="52" width="96" height="8" rx="4" fill="url(#machine)" />
  <!-- legs -->
  <rect x="84" y="160" width="14" height="22" rx="5" fill="#2d3748" />
  <rect x="102" y="160" width="14" height="22" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="186" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="98" y="186" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
