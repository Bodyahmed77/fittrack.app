<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="preconnect" href="https://www.tiktok.com" crossorigin />
    <title>Fifty Fit</title>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0b0d10; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
    <script>
      /* Fifty Fit Android runtime guards.
       * Launch blockers only: AI keyboard placement + exact TikTok URL fallback.
       */
      (function () {
        try { window.planIds = ["training", "nutrition", "both", "ai"]; } catch (_) {}

        function keyboardInset() {
          try {
            var vv = window.visualViewport;
            if (!vv) return 0;
            return Math.max(0, Math.round(window.innerHeight - vv.height - (vv.offsetTop || 0)));
          } catch (_) { return 0; }
        }

        function findAiDrawer() {
          var target = document.activeElement;
          if (!target) return null;
          var placeholder = String(target.getAttribute && target.getAttribute("placeholder") || "").toLowerCase();
          if (!placeholder.includes("اكتب سؤالك") && !placeholder.includes("ask anything")) return null;
          var node = target;
          for (var i = 0; node && i < 10; i++, node = node.parentElement) {
            var cs = window.getComputedStyle(node);
            if (cs.position === "fixed" && Number.parseInt(cs.zIndex || "0", 10) >= 1000) return node;
          }
          return null;
        }

        function syncAiDrawer() {
          try {
            var inset = keyboardInset();
            var drawer = findAiDrawer();
            if (!drawer) {
              var candidates = document.querySelectorAll("div");
              for (var i = 0; i < candidates.length; i++) {
                var el = candidates[i];
                var cs = window.getComputedStyle(el);
                if (cs.position !== "fixed") continue;
                if (Number.parseInt(cs.zIndex || "0", 10) < 1000) continue;
                if (el.querySelector && el.querySelector('textarea[placeholder*="اكتب سؤالك"], textarea[placeholder*="Ask anything"], input[placeholder*="اكتب سؤالك"], input[placeholder*="Ask anything"]')) {
                  drawer = el;
                  break;
                }
              }
            }
            if (!drawer) return;
            drawer.style.setProperty("bottom", inset + "px", "important");
            drawer.style.setProperty("height", "calc(100% - " + inset + "px)", "important");
            drawer.style.setProperty("max-height", "calc(100% - " + inset + "px)", "important");
            drawer.style.setProperty("padding-bottom", "0px", "important");
          } catch (_) {}
        }

        var shownTikTok = new WeakSet();
        function keepTikTokInsideViewer() {
          try {
            var frames = document.querySelectorAll("iframe");
            for (var i = 0; i < frames.length; i++) {
              var frame = frames[i];
              var raw = frame.getAttribute("src") || "";
              if (!/^https?:\\/\\/(www\\.)?tiktok\\.com/i.test(raw)) continue;
              frame.removeAttribute("sandbox");
              frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
              frame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
              frame.setAttribute("loading", "eager");
              if (shownTikTok.has(frame)) continue;
              shownTikTok.add(frame);

              var parent = frame.parentElement;
              if (!parent) continue;
              var fallback = document.createElement("div");
              fallback.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080808;color:#fff;z-index:4;padding:24px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s";
              fallback.innerHTML = '<div style="max-width:300px"><div style="font-size:16px;font-weight:800;margin-bottom:8px">TikTok video did not finish loading.</div><div style="font-size:12px;opacity:.65;margin-bottom:16px">Open the same TikTok URL like a normal browser page.</div><button type="button" style="border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:#fff;color:#000;cursor:pointer">Open video</button></div>';
              var button = fallback.querySelector("button");
              button.dataset.url = raw;
              button.addEventListener("click", function () {
                var url = this.dataset.url || "";
                if (!url) return;
                try { window.open(url, "_blank", "noopener,noreferrer"); } catch (_) { window.location.href = url; }
              });
              parent.style.position = parent.style.position || "relative";
              parent.appendChild(fallback);

              var iframeLoaded = false;
              frame.addEventListener("load", function () { iframeLoaded = true; }, { once: true });
              setTimeout(function () {
                if (!frame.isConnected || iframeLoaded) return;
                fallback.style.opacity = "1";
                fallback.style.pointerEvents = "auto";
              }, 6500);
            }
          } catch (_) {}
        }

        try {
          var vv = window.visualViewport;
          if (vv) {
            vv.addEventListener("resize", syncAiDrawer, { passive: true });
            vv.addEventListener("scroll", syncAiDrawer, { passive: true });
          }
          window.addEventListener("resize", syncAiDrawer, { passive: true });
          window.addEventListener("orientationchange", syncAiDrawer, { passive: true });
          document.addEventListener("focusin", function () {
            setTimeout(syncAiDrawer, 30);
            setTimeout(syncAiDrawer, 140);
            setTimeout(syncAiDrawer, 350);
          }, true);
          var observer = new MutationObserver(function () {
            syncAiDrawer();
            keepTikTokInsideViewer();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["src"] });
          setTimeout(syncAiDrawer, 0);
          setTimeout(keepTikTokInsideViewer, 0);
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/networkGuard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      import { startPlanNotificationBridge } from "/src/planNotifications.js";
      import { startPublishedPlansUx } from "/src/publishedPlansUx.js";
      startPlanNotificationBridge();
      startPublishedPlansUx();
    </script>
  </body>
</html>
