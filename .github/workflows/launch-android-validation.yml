name: Launch Android validation

on:
  push:
    paths:
      - 'scripts/android-validation.trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed Android build on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-android.yml --ref "${GITHUB_REF_NAME}"
          echo "Dispatched build-android.yml for ${GITHUB_REF_NAME}"