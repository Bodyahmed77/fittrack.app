<?xml version="1.0" encoding="UTF-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38a169" />
      <stop offset="100%" stop-color="#2f855a" />
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- jump rope -->
  <path
    d="M40 90 Q100 150 160 90"
    fill="none"
    stroke="#e53e3e"
    stroke-width="5"
    stroke-linecap="round"
  />
  <!-- body jumping -->
  <rect x="78" y="70" width="44" height="50" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="52" r="15" fill="url(#skin)" />
  <!-- arms holding rope up -->
  <path
    d="M84 76 L62 60 L52 52"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M116 76 L138 60 L148 52"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="52" cy="52" r="7" fill="url(#skin)" />
  <circle cx="148" cy="52" r="7" fill="url(#skin)" />
  <!-- legs jumping -->
  <path
    d="M86 120 L78 140 L72 158"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M114 120 L122 140 L128 158"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- feet off ground -->
  <rect x="64" y="156" width="22" height="9" rx="4" fill="#2d3748" />
  <rect x="120" y="156" width="22" height="9" rx="4" fill="#2d3748" />
</svg>
