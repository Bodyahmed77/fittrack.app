name: Validate Fifty Fit PR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fiftyfit-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: tools platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android API 36 / build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies without source-mutating postinstall
        run: npm ci --ignore-scripts

      - name: Apply required native diagnostics only
        run: |
          set -euo pipefail
          test -f scripts/apply-google-native-diagnostics.py
          python3 scripts/apply-google-native-diagnostics.py

      - name: Validate production invariants
        run: python3 scripts/validate-production-invariants.py

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate nutrition macro math
        run: python3 scripts/validate-nutrition-macro-math.py

      - name: Validate subscription notification date parsing
        run: |
          set -euo pipefail
          grep -q 'patch-subscription-reminder-date.py' package.json
          ! grep -q 'expiresAtISO + "T10:00:00"' src/App.jsx
          grep -q 'Number.isFinite(parsed.getTime())' scripts/patch-subscription-reminder-date.py
          echo 'Subscription expiry reminder date hardening validated.'

      - name: Validate JavaScript syntax
        run: |
          node --check src/googleAuth.js
          node --check src/billing.js
          node --check src/registerPurchase.js

      - name: Validate dependency manifest consistency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('package.json').read_text())
          l = json.loads(Path('package-lock.json').read_text())
          root = l['packages']['']
          assert root['devDependencies']['@vitejs/plugin-react'] == p['devDependencies']['@vitejs/plugin-react']
          assert root['devDependencies']['vite'] == p['devDependencies']['vite']
          assert root['dependencies']['@capacitor/network'] == p['dependencies']['@capacitor/network']
          assert root['dependencies']['@capacitor/status-bar'] == p['dependencies']['@capacitor/status-bar']
          print('package.json/package-lock.json consistency passed')
          PY

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Inject google-services.json for Android compile validation
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}" || { echo 'GOOGLE_SERVICES_JSON_BASE64 secret is missing'; exit 1; }
          mkdir -p android/app
          printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Apply generated Android runtime patches
        run: |
          set -euo pipefail
          npx cap sync android
          python3 scripts/inject-android-system-ui.py
          if [ -f scripts/inject-tiktok-webview.py ]; then python3 scripts/inject-tiktok-webview.py; else echo 'No legacy TikTok injector present; native bridge is supplied by the release workflow.'; fi

      - name: Validate Play Billing app dependency pin
        run: |
          set -euo pipefail
          APP_GRADLE='android/app/build.gradle'
          test -f "$APP_GRADLE"
          grep -q 'com.android.billingclient:billing:9.1.0' "$APP_GRADLE"
          if grep -q 'com.android.billingclient:billing:7.1.0' "$APP_GRADLE"; then echo 'PBL7 billing dependency remains in app module'; exit 1; fi
          echo 'Play Billing 9.1.0 app dependency pin verified.'

      - name: Inspect resolved Play Billing version for capacitor-billing
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :capacitor-billing:dependencyInsight --dependency com.android.billingclient:billing --configuration debugCompileClasspath | tee /tmp/fiftyfit-pbl.txt
          grep -Eq 'com\.android\.billingclient:billing:9\.1\.0' /tmp/fiftyfit-pbl.txt
          echo 'Resolved Play Billing 9.1.0 verified.'

      - name: Compile Android debug artifact (Billing/PBL compatibility gate)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify release-time Billing normalization transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('vite.config.js').read_text(encoding='utf-8')
          required = ['extractBillingResponseCode', 'resolvedResponseCode']
          for item in required:
              assert item in text, item
          print('Billing normalization transform gate passed')
          PY

      - name: Check Android release workflow syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/build-android.yml').read_text(encoding='utf-8')
          assert 'gradlew' in text
          assert 'assembleRelease' in text or 'bundleRelease' in text
          print('Android release workflow sanity passed')
          PY
