name: Remove build warning

on:
  push:
    branches:
      - fix/fifty-fit-launch-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate style key
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          text=p.read_text(encoding='utf-8')
          old='''          display: "flex",\n          flexDirection: "column",\n          position: "absolute",\n          boxShadow: "0 0 40px rgba(0,0,0,0.35)",'''
          new='''          display: "flex",\n          flexDirection: "column",\n          boxShadow: "0 0 40px rgba(0,0,0,0.35)",'''
          if old not in text: raise SystemExit('duplicate style marker missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --check
          git commit -m "fix: remove duplicate AI panel style key"
          git push origin HEAD:fix/fifty-fit-launch-polish
          git rm .github/workflows/remove-build-warning.yml
          git commit -m "chore: remove temporary warning workflow"
          git push origin HEAD:fix/fifty-fit-launch-polish
