<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3182ce" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="dumbbell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- body in lunge (bulgarian split squat) -->
  <rect x="84" y="60" width="44" height="56" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="96" cy="46" r="15" fill="url(#skin)" />
  <!-- front thigh -->
  <rect x="86" y="116" width="18" height="34" rx="6" fill="url(#shorts)" />
  <!-- front shin -->
  <rect x="88" y="150" width="14" height="30" rx="5" fill="url(#skin)" />
  <!-- back leg extended -->
  <path
    d="M120 116 L150 100 L170 96"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- back shin -->
  <path
    d="M170 96 L174 120"
    fill="none"
    stroke="url(#skin)"
    stroke-width="12"
    stroke-linecap="round"
  />
  <!-- feet -->
  <rect x="80" y="184" width="28" height="9" rx="4" fill="#2d3748" />
  <rect x="168" y="122" width="22" height="8" rx="4" fill="#2d3748" />
  <!-- arms with dumbbells -->
  <path
    d="M88 66 L76 56 L70 60"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M124 66 L136 56 L142 60"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="70" cy="60" r="7" fill="url(#skin)" />
  <circle cx="142" cy="60" r="7" fill="url(#skin)" />
  <rect x="56" y="54" width="11" height="15" rx="3" fill="url(#dumbbell)" />
  <rect x="135" y="54" width="11" height="15" rx="3" fill="url(#dumbbell)" />
</svg>
