<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d69e2e" />
      <stop offset="100%" stop-color="#b7791f" />
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>
  </defs>
  <!-- body standing -->
  <rect x="78" y="86" width="44" height="68" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="68" r="15" fill="url(#skin)" />
  <!-- arms bent with reversed grip -->
  <path
    d="M86 94 L70 110 L62 124"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M114 94 L130 110 L138 124"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- hands -->
  <circle cx="62" cy="128" r="8" fill="url(#skin)" />
  <circle cx="138" cy="128" r="8" fill="url(#skin)" />
  <!-- EZ bar with reversed grip -->
  <rect x="50" y="124" width="100" height="8" rx="4" fill="url(#cable)" />
  <!-- legs -->
  <rect x="84" y="154" width="14" height="28" rx="5" fill="#2d3748" />
  <rect x="102" y="154" width="14" height="28" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="76" y="186" width="26" height="8" rx="4" fill="#2d3748" />
  <rect x="98" y="186" width="26" height="8" rx="4" fill="#2d3748" />
</svg>
