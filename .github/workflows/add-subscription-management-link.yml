name: Add subscription management link

on:
  push:
    branches:
      - fix/fifty-fit-launch-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Play subscription center link
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          text=p.read_text(encoding='utf-8')
          old='''              {restoring\n                ? ar\n                  ? "جاري الاسترجاع…"\n                  : "Restoring…"\n                : ar\n                ? "استرجاع الاشتراك"\n                : "Restore Purchases"}\n            </button>'''
          new='''              {restoring\n                ? ar\n                  ? "جاري الاسترجاع…"\n                  : "Restoring…"\n                : ar\n                ? "استرجاع الاشتراك"\n                : "Restore Purchases"}\n            </button>\n            <a\n              href="https://play.google.com/store/account/subscriptions?package=com.fittrack.app"\n              target="_blank"\n              rel="noopener noreferrer"\n              style={{\n                display: "inline-block",\n                marginTop: 10,\n                color: C.sub2,\n                fontSize: 11,\n                textDecoration: "underline",\n                textUnderlineOffset: 3,\n              }}\n            >\n              {ar ? "إدارة أو إلغاء الاشتراك من Google Play" : "Manage or cancel subscription on Google Play"}\n            </a>'''
          if old not in text: raise SystemExit('restore button marker missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate web build
        run: |
          npm ci
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --check
          git commit -m "feat: add Google Play subscription management link"
          git push origin HEAD:fix/fifty-fit-launch-polish
          git rm .github/workflows/add-subscription-management-link.yml
          git commit -m "chore: remove temporary subscription link workflow"
          git push origin HEAD:fix/fifty-fit-launch-polish
