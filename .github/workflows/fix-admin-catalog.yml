name: Complete admin exercise catalog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch catalog
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('admin/app.js')
          text=p.read_text(encoding='utf-8')
          needle='["bicep_curl", "Behind Body Bicep Curl", "بايسبس خلف الجسم"],'
          insert=needle+' ["behind_body_bicep_curl", "Behind Body Bicep Curl", "بايسبس خلف الجسم"],'
          if '"behind_body_bicep_curl"' not in text:
              if needle not in text: raise SystemExit('catalog marker missing')
              text=text.replace(needle,insert,1)
              p.write_text(text,encoding='utf-8')
          PY
          node --check admin/app.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/app.js
          git diff --cached --check
          git commit -m "fix: include complete exercise catalog in admin"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git rm .github/workflows/fix-admin-catalog.yml
          git commit -m "chore: remove temporary admin catalog workflow"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
