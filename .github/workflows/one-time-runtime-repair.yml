name: One-time runtime repair

on:
  push:
    branches:
      - fix/onboarding-google-billing-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply runtime repair
        run: python3 scripts/apply-runtime-repair.py

      - name: Verify Python script syntax
        run: python3 -m py_compile scripts/apply-runtime-repair.py

      - name: Verify Google auth syntax
        run: node --check src/googleAuth.js

      - name: Build web app
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/googleAuth.js src/billing.js
          git diff --cached --quiet && { echo "No source changes detected"; exit 1; }
          git commit -m "fix: repair onboarding google sign-in and billing diagnostics"
          git push origin HEAD:fix/onboarding-google-billing-runtime
