name: Deploy Fifty Fit Web Demo

on:
  push:
    branches: [main, fix/launch-billing-ai-final]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vite.release.config.js'
      - '.github/workflows/deploy-web-demo.yml'
      - 'admin/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-demo
  cancel-in-progress: true

env:
  VITE_WEB_DEMO: '1'

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current demo source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build demo app
        run: VITE_WEB_DEMO=1 npm run build

      - name: Keep admin dashboard in Pages artifact
        run: rm -rf dist/admin && cp -R admin dist/admin

      - name: Validate generated web demo output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/404.html || cp dist/index.html dist/404.html
          test -d dist/assets
          grep -R "FIFTYFIT_WEB_DEMO" dist/assets --include='*.js' >/dev/null
          echo "Web demo artifact structure and demo marker validated"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
