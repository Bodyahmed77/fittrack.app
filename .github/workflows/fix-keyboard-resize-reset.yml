name: Fix keyboard resize lifecycle

on:
  push:
    branches:
      - fix/fifty-fit-launch-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch keyboard lifecycle
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          text=p.read_text(encoding='utf-8')
          old='''    let removed = false;\n    let nativeMode = false;\n    const handles = [];\n    let vv = null;\n    let onVv = null;'''
          new='''    let removed = false;\n    let nativeMode = false;\n    let KeyboardApi = null;\n    const handles = [];\n    let vv = null;\n    let onVv = null;'''
          if old not in text: raise SystemExit('keyboard state marker missing')
          text=text.replace(old,new,1)
          old='''            const { Keyboard } = await import("@capacitor/keyboard");\n            try {\n              if (Keyboard.setResizeMode) {\n                await Keyboard.setResizeMode({ mode: "none" });\n              }'''
          new='''            const { Keyboard } = await import("@capacitor/keyboard");\n            KeyboardApi = Keyboard;\n            if (removed) {\n              try {\n                await Keyboard.setResizeMode?.({ mode: "native" });\n              } catch (_) {}\n              return;\n            }\n            try {\n              if (Keyboard.setResizeMode) {\n                await Keyboard.setResizeMode({ mode: "none" });\n              }'''
          if old not in text: raise SystemExit('keyboard import marker missing')
          text=text.replace(old,new,1)
          old='''      if (vv) {\n        vv.removeEventListener("resize", onVv);\n        vv.removeEventListener("scroll", onVv);\n      }\n      setKeyboardInset(0);'''
          new='''      if (vv) {\n        vv.removeEventListener("resize", onVv);\n        vv.removeEventListener("scroll", onVv);\n      }\n      // AI temporarily uses ResizeMode=none so the drawer can track the IME\n      // precisely. Always restore the app's normal native resize behavior when\n      // the drawer closes; otherwise the next screen can inherit a stale mode.\n      try {\n        KeyboardApi?.setResizeMode?.({ mode: "native" });\n      } catch (_) {}\n      setKeyboardInset(0);'''
          if old not in text: raise SystemExit('keyboard cleanup marker missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate
        run: |
          npm ci
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --check
          git commit -m "fix: restore native keyboard resize mode after AI" 
          git push origin HEAD
          git rm .github/workflows/fix-keyboard-resize-reset.yml
          git commit -m "chore: remove temporary keyboard workflow"
          git push origin HEAD
