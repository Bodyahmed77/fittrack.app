name: One-time source migration

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-level launch fixes once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          app = Path("src/App.jsx")
          text = app.read_text(encoding="utf-8")
          changed = False
          
          # TikTok: use the in-app native WebView bridge so Android never hands
          # the original URL to the TikTok application. The stored URL remains
          # untouched; only the runtime viewer implementation changes.
          text2 = text.replace('import { Browser } from "@capacitor/browser";\n', '', 1)
          if text2 != text:
              text = text2
              changed = True
          
          viewer_pattern = re.compile(
              r'async function openTikTokVideo\(tikTokUrl, ar\) \{.*?\n\}\n\nfunction VideoPlayer',
              re.S,
          )
          viewer_replacement = '''async function openTikTokVideo(tikTokUrl, ar) {\n  const raw = String(tikTokUrl || "").trim();\n  if (!raw) return;\n  try {\n    const { openTikTokWebView } = await import("./tiktokWebView");\n    await openTikTokWebView(raw);\n  } catch (error) {\n    console.error("[TikTok] in-app viewer failed", error);\n    throw new Error(\n      ar\n        ? "تعذر فتح فيديو التمرين داخل التطبيق."\n        : "Could not open the exercise video inside the app.",\n    );\n  }\n}\n\nfunction VideoPlayer'''
          text2, count = viewer_pattern.subn(viewer_replacement, text, count=1)
          if count == 1 and text2 != text:
              text = text2
              changed = True
          elif count != 1:
              raise SystemExit("TikTok openTikTokVideo function not found")
          
          # Cardio: persist completion AND XP in one snapshot. Previously
          # persist(true) was followed by awardXp(35), whose stale data closure
          # could overwrite the completed cardio log with the old timer record.
          old = '''  const persist = useCallback(\n    async (finished, cardioStartedAt = startedAt) => {\n      const next = clone(data);\n      if (!next.logs[logDate]) next.logs[logDate] = {};\n      next.logs[logDate][exerciseId] = {\n        sets: [{ weight: 0, reps: "15 min", done: finished }],\n        finished,\n        cardioStartedAt: finished ? null : cardioStartedAt || null,\n        cardioCompletedAt: finished ? Date.now() : null,\n      };\n      const ok = await setData(next);\n      if (ok === false) throw new Error("Cardio persistence failed");\n    },\n    [data, exerciseId, logDate, setData, startedAt],\n  );'''
          new = '''  const persist = useCallback(\n    async (finished, cardioStartedAt = startedAt, xpAmount = 0) => {\n      const next = clone(data);\n      if (!next.logs[logDate]) next.logs[logDate] = {};\n      next.logs[logDate][exerciseId] = {\n        sets: [{ weight: 0, reps: "15 min", done: finished }],\n        finished,\n        cardioStartedAt: finished ? null : cardioStartedAt || null,\n        cardioCompletedAt: finished ? Date.now() : null,\n      };\n      if (xpAmount) {\n        next.profile = next.profile || {};\n        next.profile.xp = Number(next.profile.xp || 0) + Number(xpAmount || 0);\n        next.profile.level = Number(next.profile.level || 1);\n        next.profile.xpMax = Number(next.profile.xpMax || 500);\n        while (next.profile.xp >= next.profile.xpMax) {\n          next.profile.xp -= next.profile.xpMax;\n          next.profile.level += 1;\n          next.profile.xpMax = Math.round(next.profile.xpMax * 1.15);\n        }\n      }\n      const ok = await setData(next);\n      if (ok === false) throw new Error("Cardio persistence failed");\n    },\n    [data, exerciseId, logDate, setData, startedAt],\n  );'''
          if old not in text:
              raise SystemExit("Cardio persist block not found")
          text = text.replace(old, new, 1)
          changed = True
          
          old = 'await persist(true, null);\n        setStartedAt(null);\n        setNow(Date.now());\n        try { awardXp(35); } catch {}'
          new = 'await persist(true, null, 35);\n        setStartedAt(null);\n        setNow(Date.now());'
          if old not in text:
              raise SystemExit("Cardio finish persistence call not found")
          text = text.replace(old, new, 1)
          changed = True
          
          # Nutrition plan: make day selection explicit instead of deriving the
          # selected day only from today's date. Keep a separate completion key
          # per plan day so checking food on Day 1 cannot collide with Day 3.
          old = 'const [log, setLog] = useState(() => data.customNutritionLog || {}); const [saving, setSaving] = useState(false); const [requested, setRequested] = useState(!!data.nutritionPlanRequestedAt);'
          new = '''const [log, setLog] = useState(() => data.customNutritionLog || {}); const [saving, setSaving] = useState(false); const [requested, setRequested] = useState(!!data.nutritionPlanRequestedAt);\n  const [selectedDayIndex, setSelectedDayIndex] = useState(0);'''
          if old not in text:
              raise SystemExit("Nutrition plan state marker not found")
          text = text.replace(old, new, 1)
          old = '  const parseItems = (items, mealId) => Array.isArray(items) ? items.map((x,i) => ({ id:x.id || `${mealId}-${i}`, name:x.name || x.title || `Food ${i+1}`, nameAr:x.nameAr || x.name || x.titleAr || x.title || `أكلة ${i+1}`, quantity:x.quantity ?? x.amount ?? \'\', kcal:Number(x.kcal || 0), protein:Number(x.protein || 0), carbs:Number(x.carbs || 0), fat:Number(x.fat || 0) })) : String(items || \'\').split(/\\n+/).map(x=>x.trim()).filter(Boolean).map((line,i)=>{ const a=line.split(\'|\').map(x=>x.trim()); return {id:`${mealId}-${i}-${a[0]}`,name:a[0],nameAr:a[0],quantity:a[1]||\'\',kcal:Number(a[2]||0),protein:Number(a[3]||0),carbs:Number(a[4]||0),fat:Number(a[5]||0)}; });'
          if old not in text:
              raise SystemExit("Nutrition parseItems marker not found")
          new = old + '''\n  const computedTodayDayIndex = plan?.days?.length\n    ? Math.max(0, Math.min(plan.days.length - 1, (() => {\n        const start = plan.startDate || today;\n        const diff = Math.max(0, Math.floor((new Date(today + "T00:00:00").getTime() - new Date(start + "T00:00:00").getTime()) / 86400000));\n        return Number.isFinite(diff) ? diff : 0;\n      })()))\n    : 0;\n  useEffect(() => {\n    if (plan) setSelectedDayIndex(computedTodayDayIndex);\n  }, [plan?.startDate, plan?.days?.length, computedTodayDayIndex]);'''
          text = text.replace(old, new, 1)
          old = '  const start=plan.startDate || today; const diff=Math.max(0,Math.floor((new Date(today+\'T00:00:00\')-new Date(start+\'T00:00:00\'))/86400000)); const dayIndex=Math.min(6,Number.isFinite(diff)?diff%7:0); const day=plan.days?.[dayIndex] || plan.days?.[0] || {meals:[]}; const checked=log[today] || {}; const meals=day.meals || [];'
          if old not in text:
              raise SystemExit("Nutrition day calculation marker not found")
          new = '  const dayIndex=Math.max(0,Math.min((plan.days?.length || 1)-1,selectedDayIndex)); const day=plan.days?.[dayIndex] || plan.days?.[0] || {meals:[]}; const logKey=`${plan.startDate || today}:day-${dayIndex}`; const checked=log[logKey] || (dayIndex===computedTodayDayIndex ? (log[today] || {}) : {}); const meals=day.meals || [];'
          text = text.replace(old, new, 1)
          old = '  const toggle=async id=>{if(!auth.currentUser||saving)return;const next={...log,[today]:{...(log[today]||{}),[id]:!checked[id]}};if(!next[today][id])delete next[today][id];setLog(next);setSaving(true);try{await setDoc(doc(db,\'users\',auth.currentUser.uid),{customNutritionLog:next},{merge:true});}catch{setLog(log);}finally{setSaving(false);}};'
          if old not in text:
              raise SystemExit("Nutrition toggle marker not found")
          new = '  const toggle=async id=>{if(!auth.currentUser||saving)return;const next={...log,[logKey]:{...(log[logKey]||{}),[id]:!checked[id]}};if(!next[logKey][id])delete next[logKey][id];setLog(next);setSaving(true);try{await setDoc(doc(db,\'users\',auth.currentUser.uid),{customNutritionLog:next},{merge:true});}catch{setLog(log);}finally{setSaving(false);}};'
          text = text.replace(old, new, 1)
          old = '<div style={{display:\'flex\',gap:6,overflowX:\'auto\',paddingBottom:8}}>{(plan.days||[]).map((d,i)=><div key={i} style={{minWidth:72,padding:\'9px 7px\',borderRadius:11,background:i===dayIndex?C.green:C.card2,color:i===dayIndex?C.onAccent:C.sub,textAlign:\'center\',fontSize:11,fontWeight:800}}>{ar?(d.titleAr||`اليوم ${i+1}`):(d.title||`Day ${i+1}`)}</div>)}</div>'
          if old not in text:
              raise SystemExit("Nutrition day tabs marker not found")
          new = '<div style={{display:\'flex\',gap:6,overflowX:\'auto\',paddingBottom:8}}>{(plan.days||[]).map((d,i)=><button key={i} type="button" onClick={()=>setSelectedDayIndex(i)} style={{minWidth:72,padding:\'9px 7px\',borderRadius:11,background:i===dayIndex?C.green:C.card2,color:i===dayIndex?C.onAccent:C.sub,textAlign:\'center\',fontSize:11,fontWeight:800,border:\'none\',cursor:\'pointer\',flexShrink:0}}>{ar?(d.titleAr||`اليوم ${i+1}`):(d.title||`Day ${i+1}`)}</button>)}</div>'
          text = text.replace(old, new, 1)
          changed = True
          
          # Meals screen: an admin-assigned custom nutrition plan is a real
          # assignment, not a Play Billing entitlement. Show its targets even
          # for a Free recipient.
          old = '  const targets = data.dailyTargets;\n  const kcalTarget = targets?.kcal || 2000;'
          if old not in text:
              raise SystemExit("Meals target marker not found")
          new = '''  const customTodayPlanIndex = customNutritionPlan?.days?.length\n    ? Math.max(0, Math.min(customNutritionPlan.days.length - 1, (() => {\n        const start = customNutritionPlan.startDate || today;\n        const diff = Math.max(0, Math.floor((new Date(today + "T00:00:00").getTime() - new Date(start + "T00:00:00").getTime()) / 86400000));\n        return Number.isFinite(diff) ? diff : 0;\n      })()))\n    : 0;\n  const targets = customNutritionPlan?.days?.[customTodayPlanIndex] || data.dailyTargets;\n  const kcalTarget = targets?.kcal || targets?.targetKcal || 2000;'''
          text = text.replace(old, new, 1)
          old = '        {!pro ? ('
          if old not in text:
              raise SystemExit("Meals Pro gate marker not found")
          new = '        {!customNutritionPlan && !pro ? ('
          text = text.replace(old, new, 1)
          changed = True
          
          app.write_text(text, encoding="utf-8")
          
          # Strengthen the in-app WebView so TikTok cannot spawn additional
          # windows or hand the navigation to another application.
          bridge = Path("scripts/inject-tiktok-webview.py")
          bt = bridge.read_text(encoding="utf-8")
          if 's.setSupportMultipleWindows(false);' not in bt:
              marker = '        s.setMediaPlaybackRequiresUserGesture(false);\n'
              if marker not in bt:
                  raise SystemExit("TikTok WebView settings marker not found")
              bt = bt.replace(marker, marker + '        s.setSupportMultipleWindows(false);\n        s.setJavaScriptCanOpenWindowsAutomatically(false);\n', 1)
              bridge.write_text(bt, encoding="utf-8")
              changed = True
          
          # Remove the old build-time source surgery from the release workflow.
          wf = Path(".github/workflows/build-android.yml")
          wt = wf.read_text(encoding="utf-8")
          wt = re.sub(r'\n      - name: Apply reviewed Claude source fix once\n        run: \|\n(?:          .*\n)+?(?=      - name: Apply admin publishing gate fix)', '\n', wt, count=1)
          wt = re.sub(r'\n      - name: Apply admin publishing gate fix\n        env:\n          GH_TOKEN: \$\{\{ github\.token \}\}\n        run: \|\n(?:          .*\n)+?(?=      - name: Set up Node\.js)', '\n', wt, count=1)
          wt = wt.replace('          python3 scripts/release-fixes-v7.py\n          npm run build', '          npm run build')
          wf.write_text(wt, encoding="utf-8")
          
          # The old v7 mutation script must not be part of the source tree used
          # for future builds.
          print("SOURCE_MIGRATION_CHANGED", changed)
          print("CARDIO_COMBINED_PERSIST", 'await persist(true, null, 35)' in text)
          print("NUTRITION_SELECTED_DAY", 'setSelectedDayIndex(i)' in text)
          print("TIKTOK_IN_APP_BRIDGE", 'openTikTokWebView' in text)
          print("MEALS_CUSTOM_PLAN_FREE_ACCESS", '!customNutritionPlan && !pro' in text)
          print("BUILD_NO_V7", 'release-fixes-v7.py' not in wt)
          if 'await persist(true, null, 35)' not in text:
              raise SystemExit("Cardio patch verification failed")
          if 'setSelectedDayIndex(i)' not in text:
              raise SystemExit("Nutrition day-selection verification failed")
          if 'openTikTokWebView' not in text:
              raise SystemExit("TikTok bridge verification failed")
          if '!customNutritionPlan && !pro' not in text:
              raise SystemExit("Meals custom-plan access verification failed")
          if 'release-fixes-v7.py' in wt:
              raise SystemExit("Build workflow still references release-fixes-v7.py")
          if not changed:
              print("No App migration required; source already contains the reviewed fixes")
          PY

          if test -f scripts/release-fixes-v7.py; then
            git rm scripts/release-fixes-v7.py
          fi
          git add src/App.jsx scripts/inject-tiktok-webview.py .github/workflows/build-android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist cardio completion and make nutrition days selectable" || true
          if git log -1 --format=%B | grep -q "fix: persist cardio completion"; then
            git push origin HEAD:main
          fi

          # Remove this one-time workflow from the source tree after the
          # migration commit so future builds are ordinary source builds.
          if test -f .github/workflows/one-time-source-migration.yml; then
            git rm .github/workflows/one-time-source-migration.yml
            git commit -m "chore: remove one-time source migration"
            git push origin HEAD:main
          fi
