name: One-time app fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 scripts/one_time_fix.py
      - name: Commit fixes and remove maintenance files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git rm scripts/one_time_fix.py .github/workflows/one-time-app-fix.yml
          git commit -m "fix: native published plan and notification navigation"
          git push
