<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dd6b20" />
      <stop offset="100%" stop-color="#c05621" />
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- hack squat sled (inclined) -->
  <path d="M30 30 L170 30 L170 60 L90 150 L30 150 Z" fill="url(#machine)" />
  <rect x="30" y="28" width="140" height="8" rx="4" fill="#718096" />
  <!-- body on sled -->
  <rect x="78" y="60" width="44" height="52" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="46" r="15" fill="url(#skin)" />
  <!-- thighs -->
  <path
    d="M82 112 L70 118 L66 138"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M118 112 L130 118 L134 138"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- shins -->
  <path
    d="M66 138 L60 160"
    fill="none"
    stroke="url(#skin)"
    stroke-width="12"
    stroke-linecap="round"
  />
  <path
    d="M134 138 L140 160"
    fill="none"
    stroke="url(#skin)"
    stroke-width="12"
    stroke-linecap="round"
  />
  <!-- feet -->
  <rect x="48" y="158" width="28" height="9" rx="4" fill="#2d3748" />
  <rect x="124" y="158" width="28" height="9" rx="4" fill="#2d3748" />
  <!-- shoulder pads -->
  <rect x="74" y="56" width="52" height="8" rx="4" fill="#2d3748" />
</svg>
