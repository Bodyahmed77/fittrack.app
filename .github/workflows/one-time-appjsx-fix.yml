name: One-time App.jsx release fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply focused App.jsx fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          original = text

          if 'import { deleteAccountServerData } from "./deleteAccount";' not in text:
              raise SystemExit('Expected deleteAccountServerData import is missing')

          # AI-only subscribers must be treated as Pro in Settings.
          old_pro = 'const pro = data.entitlements.trainingPro || data.entitlements.nutritionPro;'
          new_pro = 'const pro = data.entitlements.trainingPro || data.entitlements.nutritionPro || data.entitlements.aiCoachPro;'
          if text.count(old_pro) != 1:
              raise SystemExit(f'Expected exactly one Settings pro expression, found {text.count(old_pro)}')
          text = text.replace(old_pro, new_pro, 1)

          # Account deletion must clean server-side Supabase data before any local/Auth deletion.
          start = text.find('function DeleteAccountScreen')
          if start < 0:
              raise SystemExit('DeleteAccountScreen not found')
          end = text.find('\nfunction ', start + 10)
          if end < 0:
              end = len(text)
          section = text[start:end]

          if 'deleteAccountServerData()' not in section:
              # Prefer the Firestore deletion boundary so server cleanup happens
              # after reauthentication but before local account/data deletion.
              m = re.search(r'(?m)^(\s*)await deleteDoc\(', section)
              if m:
                  indent = m.group(1)
                  replacement = indent + 'await deleteAccountServerData();\n' + m.group(0)
                  section = section[:m.start()] + replacement + section[m.end():]
              else:
                  m = re.search(r'(?m)^(\s*)await deleteUser\(user\);', section)
                  if not m:
                      raise SystemExit('Could not find local account deletion boundary')
                  indent = m.group(1)
                  replacement = indent + 'await deleteAccountServerData();\n' + m.group(0)
                  section = section[:m.start()] + replacement + section[m.end():]
              text = text[:start] + section + text[end:]

          if text == original:
              raise SystemExit('No changes were made')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate focused changes
        run: |
          grep -n 'deleteAccountServerData' src/App.jsx
          grep -n 'const pro = data.entitlements.trainingPro || data.entitlements.nutritionPro || data.entitlements.aiCoachPro;' src/App.jsx

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/one-time-appjsx-fix.yml
          git commit -m 'fix: finish account deletion and AI-only settings [skip ci]'
          git push
