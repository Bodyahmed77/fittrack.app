name: Patch nutrition and admin experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product improvements
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # ---------- Admin dashboard ----------
          p = Path('admin/app.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace('  where,\n', '  where,\n  orderBy,\n', 1)

          start = s.index('async function getRecentCustomers()')
          end = s.index('\nasync function openCustomer', start)
          replacement = r'''async function getRecentCustomers() {
  const snap = await getDocs(query(collection(db, "users"), limit(250)));
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}
function customerIsSubscribed(u) {
  const e = u.entitlements || {};
  return !!(e.trainingPro || e.nutritionPro || e.aiCoachPro || e.everythingPro || e.bothPro);
}
function customerMatches(u, term) {
  const q = term.trim().toLowerCase();
  if (!q) return true;
  const a = u.account || {};
  return [a.name, a.email, a.phone, u.id].some((v) => String(v || "").toLowerCase().includes(q));
}
function customerHasPlanRequest(u) {
  return !!u.nutritionPlanRequestedAt || !!u.trainingPlanRequestedAt;
}
function customerPlanStatus(u) {
  const e = u.entitlements || {};
  return [
    e.trainingPro && "Training Pro",
    e.nutritionPro && "Nutrition Pro",
    e.aiCoachPro && "AI Coach",
  ].filter(Boolean);
}
function sortCustomers(rows, mode) {
  const copy = [...rows];
  if (mode === "subscribed") return copy.sort((a,b) => Number(customerIsSubscribed(b)) - Number(customerIsSubscribed(a)));
  if (mode === "unsubscribed") return copy.sort((a,b) => Number(customerIsSubscribed(a)) - Number(customerIsSubscribed(b)));
  if (mode === "nutrition") return copy.sort((a,b) => Number(b.entitlements?.nutritionPro) - Number(a.entitlements?.nutritionPro));
  if (mode === "training") return copy.sort((a,b) => Number(b.entitlements?.trainingPro) - Number(a.entitlements?.trainingPro));
  if (mode === "ai") return copy.sort((a,b) => Number(b.entitlements?.aiCoachPro) - Number(a.entitlements?.aiCoachPro));
  if (mode === "requests") return copy.sort((a,b) => Number(customerHasPlanRequest(b)) - Number(customerHasPlanRequest(a)));
  return copy.sort((a,b) => String(a.account?.name || "").localeCompare(String(b.account?.name || "")));
}
function customerRow(u) {
  const a = u.account || {}, e = u.entitlements || {};
  const badges = customerPlanStatus(u);
  const request = customerHasPlanRequest(u);
  return `<button class="customer-row ${request ? 'attention' : ''}" data-user-id="${esc(u.id)}"><div class="avatar">${esc((a.name || "?").slice(0,1).toUpperCase())}</div><div class="customer-main"><b>${esc(a.name || "Unnamed user")}</b><span>${esc(a.email || "No email")} · ${esc(a.phone || "No phone")}</span>${request ? `<small class="request-flag">${u.nutritionPlanRequestedAt ? '🍽️ Nutrition plan requested' : '🏋️ Training plan requested'}</small>` : ''}</div><div class="badges">${badges.length ? badges.map((x) => `<span class="badge">${x}</span>`).join("") : `<span class="muted">Free</span>`}</div></button>`;
}
function subscriptionSnapshot(rows) {
  return Object.fromEntries(rows.map((u) => [u.id, JSON.stringify(customerPlanStatus(u))]));
}
async function searchCustomer(term) {
  const q = term.trim();
  if (!q) return getRecentCustomers();
  if (/^[A-Za-z0-9_-]{20,}$/.test(q)) {
    const s = await getDoc(doc(db, "users", q)); return s.exists() ? [{ id: s.id, ...s.data() }] : [];
  }
  const exactFields = ["account.email", "account.phone"];
  const results = [];
  for (const field of exactFields) {
    const snap = await getDocs(query(collection(db, "users"), where(field, "==", q), limit(20)));
    snap.docs.forEach((d) => { if (!results.some((x) => x.id === d.id)) results.push({ id: d.id, ...d.data() }); });
  }
  if (results.length) return results;
  return (await getRecentCustomers()).filter((u) => customerMatches(u, q));
}

async function renderCustomers(customers = null) {
  shell(`<div class="page-head"><div><span class="eyebrow">CONTROL CENTER</span><h1>Customers</h1><p class="muted">Manage subscriptions and deliver custom plans directly into Fifty Fit.</p></div><div class="search"><input id="customer-search" placeholder="Search name, email, phone or user ID" autocomplete="off" /></div></div><div class="toolbar"><select id="customer-filter"><option value="all">All customers</option><option value="subscribed">Subscribed</option><option value="unsubscribed">Not subscribed</option><option value="training">Training Pro</option><option value="nutrition">Nutrition Pro</option><option value="ai">AI Coach Pro</option><option value="requests">Plan requests first</option></select><button id="refresh-customers" class="secondary">Refresh</button><span id="customer-notice" class="notice-inline"></span></div><div id="customer-list" class="customer-list"><div class="loading">Loading customers…</div></div>`);
  const list = document.getElementById("customer-list");
  const search = document.getElementById("customer-search");
  const filter = document.getElementById("customer-filter");
  const notice = document.getElementById("customer-notice");
  let rows = customers || await getRecentCustomers();
  let previous = JSON.parse(localStorage.getItem("fiftyFitAdminSubscriptions") || "null");
  let firstRender = !previous;
  const render = () => {
    const term = search.value;
    let filtered = rows.filter((u) => customerMatches(u, term));
    if (filter.value === "subscribed") filtered = filtered.filter(customerIsSubscribed);
    if (filter.value === "unsubscribed") filtered = filtered.filter((u) => !customerIsSubscribed(u));
    if (filter.value === "training") filtered = filtered.filter((u) => !!u.entitlements?.trainingPro);
    if (filter.value === "nutrition") filtered = filtered.filter((u) => !!u.entitlements?.nutritionPro);
    if (filter.value === "ai") filtered = filtered.filter((u) => !!u.entitlements?.aiCoachPro);
    filtered = sortCustomers(filtered, filter.value);
    const requests = rows.filter(customerHasPlanRequest).length;
    list.innerHTML = filtered.length ? filtered.map(customerRow).join("") : `<div class="empty">No customers match this filter.</div>`;
    document.querySelectorAll("[data-user-id]").forEach((b) => b.onclick = () => openCustomer(b.dataset.userId));
    notice.textContent = requests ? `🔔 ${requests} plan request${requests === 1 ? '' : 's'} need attention` : "";
  };
  render();
  const refresh = async (announce = false) => {
    const fresh = await getRecentCustomers();
    const current = subscriptionSnapshot(fresh);
    if (!firstRender && previous) {
      const newlySubscribed = fresh.filter((u) => customerIsSubscribed(u) && previous[u.id] !== current[u.id]);
      if (newlySubscribed.length) {
        notice.textContent = `🔔 ${newlySubscribed.length} new subscription${newlySubscribed.length > 1 ? 's' : ''} — open Customers to review.`;
        try { new AudioContext().close(); } catch {}
      }
    }
    firstRender = false;
    previous = current;
    localStorage.setItem("fiftyFitAdminSubscriptions", JSON.stringify(current));
    rows = fresh;
    render();
    if (announce) notice.textContent = `Updated just now · ${rows.length} customers loaded`;
  };
  search.oninput = () => render();
  filter.onchange = () => render();
  document.getElementById("refresh-customers").onclick = () => refresh(true);
  const timer = setInterval(() => refresh(false).catch(() => {}), 30000);
  window.__customerRefreshCleanup = () => clearInterval(timer);
}
'''
          s = s[:start] + replacement + s[end:]

          # Remove stale duplicate customerRow/search implementations if any remain in the file before openCustomer.
          p.write_text(s, encoding='utf-8')

          # ---------- App nutrition experience ----------
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')

          # Make the personalized-plan card visible for Nutrition Pro even before a plan is published.
          s = s.replace('pro && customNutritionPlan ? (', 'pro ? (', 1)

          start = s.index('function NutritionPlanScreen(')
          # Find matching closing brace for the function.
          brace = s.index('{', start)
          depth = 0
          end = None
          in_str = None
          escp = False
          for i in range(brace, len(s)):
              ch = s[i]
              if in_str:
                  if escp: escp = False
                  elif ch == '\\\\': escp = True
                  elif ch == in_str: in_str = None
                  continue
              if ch in ('"', "'", '`'):
                  in_str = ch
                  continue
              if ch == '{': depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None: raise SystemExit('Could not locate NutritionPlanScreen end')

          replacement = r'''function NutritionPlanScreen({ data, back }) {
  const { C, lang } = useUI();
  const ar = lang === "ar";
  const plan = data.customNutritionPlan;
  const today = dateKey(0);
  const [log, setLog] = useState(() => data.customNutritionLog || {});
  const [saving, setSaving] = useState(false);
  const [requested, setRequested] = useState(!!data.nutritionPlanRequestedAt);

  const parseItems = (items, mealId) => {
    if (Array.isArray(items)) return items.map((x, i) => ({
      id: x.id || `${mealId}-${i}-${String(x.name || 'food').replace(/\\s+/g, '-')}`,
      name: x.name || x.title || `Food ${i + 1}`,
      nameAr: x.nameAr || x.name || x.titleAr || x.title || `أكلة ${i + 1}`,
      quantity: x.quantity ?? x.amount ?? "",
      kcal: Number(x.kcal || 0), protein: Number(x.protein || 0), carbs: Number(x.carbs || 0), fat: Number(x.fat || 0),
    }));
    return String(items || "").split(/\\n+/).map((line, i) => line.trim()).filter(Boolean).map((line, i) => {
      const parts = line.split("|").map((x) => x.trim());
      return {
        id: `${mealId}-${i}-${parts[0].toLowerCase().replace(/[^a-z0-9]+/g, '-')}`,
        name: parts[0], nameAr: parts[0], quantity: parts[1] || "",
        kcal: Number(parts[2] || 0), protein: Number(parts[3] || 0), carbs: Number(parts[4] || 0), fat: Number(parts[5] || 0),
      };
    });
  };

  if (!plan) {
    const requestPlan = async () => {
      if (requested || !auth.currentUser) return;
      setRequested(true);
      try {
        await setDoc(doc(db, "users", auth.currentUser.uid), {
          nutritionPlanRequestedAt: new Date().toISOString(),
          nutritionPlanRequestStatus: "pending",
        }, { merge: true });
      } catch {
        setRequested(false);
      }
    };
    return <div dir={ar ? "rtl" : "ltr"}>
      <TopBar title={ar ? "خطتك الغذائية" : "Your Nutrition Plan"} onBack={back} />
      <div style={{ padding: "0 18px 28px" }}>
        <Card style={{ background: C.greenSoft, border: `1px solid ${C.green}55`, padding: 22, textAlign: "center" }}>
          <div style={{ fontSize: 42, marginBottom: 10 }}>🍽️</div>
          <div style={{ color: C.text, fontSize: 20, fontWeight: 900 }}>{ar ? "خطتك الغذائية الخاصة" : "Your Personalized Nutrition Plan"}</div>
          <div style={{ color: C.sub, fontSize: 13, lineHeight: 1.6, margin: "8px 0 18px" }}>{ar ? "فريق Fifty Fit هيجهز لك خطة مناسبة لهدفك وتظهر هنا داخل التطبيق." : "The Fifty Fit team will prepare your personalized plan and deliver it directly inside the app."}</div>
          <button onClick={requestPlan} disabled={requested} style={{ width: "100%", border: "none", borderRadius: 14, padding: "13px 16px", background: requested ? C.card2 : C.green, color: requested ? C.sub : C.onAccent, fontWeight: 900, cursor: requested ? "default" : "pointer" }}>
            {requested ? (ar ? "✓ تم إرسال الطلب" : "✓ Request sent") : (ar ? "اطلب خطتك الغذائية" : "Request my nutrition plan")}
          </button>
          {requested && <div style={{ color: C.sub, fontSize: 11, marginTop: 10 }}>{ar ? "هنبلغك أول ما خطتك تجهز." : "We'll let you know when your plan is ready."}</div>}
        </Card>
      </div>
    </div>;
  }

  const start = plan.startDate || today;
  const diff = Math.max(0, Math.floor((new Date(today + "T00:00:00") - new Date(start + "T00:00:00")) / 86400000));
  const dayIndex = Number.isFinite(diff) ? Math.min(6, diff % 7) : 0;
  const day = plan.days?.[dayIndex] || plan.days?.[0] || { meals: [] };
  const checked = log[today] || {};
  const meals = day.meals || [];
  const foods = meals.flatMap((m) => parseItems(m.items, m.id));
  const consumed = foods.filter((f) => checked[f.id]).reduce((a, f) => ({ kcal: a.kcal + f.kcal, protein: a.protein + f.protein, carbs: a.carbs + f.carbs, fat: a.fat + f.fat }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });
  const targets = { kcal: Number(day.targetKcal || 0), protein: Number(day.targetProtein || 0), carbs: Number(day.targetCarbs || 0), fat: Number(day.targetFat || 0) };
  const pct = (value, target) => target > 0 ? Math.min(100, Math.round((value / target) * 100)) : 0;

  const toggle = async (id) => {
    if (!auth.currentUser || saving) return;
    const next = { ...log, [today]: { ...(log[today] || {}), [id]: !checked[id] } };
    if (!next[today][id]) delete next[today][id];
    setLog(next);
    setSaving(true);
    try { await setDoc(doc(db, "users", auth.currentUser.uid), { customNutritionLog: next }, { merge: true }); }
    catch { setLog(log); }
    finally { setSaving(false); }
  };

  return <div dir={ar ? "rtl" : "ltr"}>
    <TopBar title={ar ? "خطتك الغذائية" : "Your Nutrition Plan"} onBack={back} />
    <div style={{ padding: "0 18px 28px" }}>
      <Card style={{ background: C.greenSoft, border: `1px solid ${C.green}55`, marginBottom: 12 }}>
        <div style={{ color: C.text, fontSize: 19, fontWeight: 900 }}>{ar ? (plan.titleAr || "خطتك الغذائية") : (plan.title || "Your Nutrition Plan")}</div>
        <div style={{ color: C.sub, fontSize: 12, marginTop: 5 }}>{ar ? "خطة مخصصة لك من فريق Fifty Fit" : "A plan prepared for you by the Fifty Fit team"}</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 8, marginTop: 14 }}>
          {[['🔥', ar ? 'السعرات' : 'Calories', consumed.kcal, targets.kcal, 'kcal'], ['💪', ar ? 'البروتين' : 'Protein', consumed.protein, targets.protein, 'g'], ['🍞', ar ? 'الكارب' : 'Carbs', consumed.carbs, targets.carbs, 'g'], ['🥑', ar ? 'الدهون' : 'Fat', consumed.fat, targets.fat, 'g']].map(([icon,label,value,target,unit]) => <div key={label} style={{ background: C.card2, borderRadius: 12, padding: 11 }}><div style={{ color: C.sub2, fontSize: 10, fontWeight: 800 }}>{icon} {label}</div><div style={{ color: C.text, fontSize: 16, fontWeight: 900, marginTop: 3 }}>{Math.round(value)}{unit === 'kcal' ? '' : 'g'} <span style={{ color: C.sub2, fontSize: 10, fontWeight: 700 }}>/ {target || '—'}{target ? (unit === 'kcal' ? ' kcal' : 'g') : ''}</span></div><div style={{ height: 5, background: C.border, borderRadius: 99, marginTop: 7, overflow: 'hidden' }}><div style={{ width: `${pct(value,target)}%`, height: '100%', background: C.green, borderRadius: 99, transition: 'width .25s ease' }} /></div></div>)}
        </div>
      </Card>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8 }}>
        {(plan.days || []).map((d,i) => <div key={i} style={{ minWidth: 72, padding: "9px 7px", borderRadius: 11, background: i === dayIndex ? C.green : C.card2, color: i === dayIndex ? C.onAccent : C.sub, textAlign: "center", fontSize: 11, fontWeight: 800 }}>{ar ? (d.titleAr || `اليوم ${i+1}`) : (d.title || `Day ${i+1}`)}</div>)}
      </div>
      {meals.map((meal) => {
        const items = parseItems(meal.items, meal.id);
        if (!items.length) return null;
        return <Card key={meal.id} style={{ marginBottom: 10 }}><div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}><div><div style={{ color: C.text, fontWeight: 900, fontSize: 15 }}>{ar ? (meal.titleAr || meal.title) : meal.title}</div>{meal.note && <div style={{ color: C.sub, fontSize: 11, marginTop: 3 }}>{meal.note}</div>}</div><span style={{ color: C.sub2, fontSize: 11 }}>{items.length} {ar ? 'عناصر' : 'items'}</span></div>{items.map((food) => { const done = !!checked[food.id]; return <button key={food.id} onClick={() => toggle(food.id)} style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 11, padding: '11px 4px', border: 'none', borderTop: `1px solid ${C.border}`, background: 'transparent', color: C.text, textAlign: ar ? 'right' : 'left', cursor: 'pointer' }}><div style={{ width: 24, height: 24, borderRadius: 7, border: `1.5px solid ${done ? C.green : C.border}`, background: done ? C.green : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{done && <Check size={15} color={C.onAccent} strokeWidth={3} />}</div><div style={{ flex: 1, opacity: done ? .65 : 1 }}><div style={{ fontWeight: 800, fontSize: 13.5, textDecoration: done ? 'line-through' : 'none' }}>{ar ? food.nameAr : food.name}</div><div style={{ color: C.sub, fontSize: 10.5, marginTop: 2 }}>{food.quantity}{food.kcal ? ` · ${food.kcal} kcal · P ${food.protein}g · C ${food.carbs}g · F ${food.fat}g` : ''}</div></div></button>; })}</Card>;
      })}
      <div style={{ color: C.sub2, fontSize: 10.5, textAlign: 'center', padding: '8px 12px' }}>{ar ? 'علّم على كل أكلة أكلتها فعلاً — الحساب بيتحدث تلقائيًا.' : 'Check only the food you actually ate — your daily totals update automatically.'}</div>
    </div>
  </div>;
}
'''
          s = s[:start] + replacement + s[end:]

          p.write_text(s, encoding='utf-8')

          # Add lightweight CSS for admin attention/search toolbar without changing the existing visual system.
          css = Path('admin/styles.css')
          if css.exists():
              c = css.read_text(encoding='utf-8')
              addon = '''\n.toolbar{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}.toolbar select{min-width:210px;padding:10px 12px;border-radius:12px;border:1px solid var(--border,#333);background:var(--card,#111);color:inherit}.notice-inline{font-size:12px;font-weight:800;color:#eab308}.customer-row.attention{border-color:rgba(234,179,8,.55);box-shadow:0 0 0 1px rgba(234,179,8,.08)}.request-flag{display:block;color:#eab308;font-weight:800;margin-top:4px}\n'''
              if '.notice-inline' not in c:
                  css.write_text(c + addon, encoding='utf-8')

          print('Patched admin live search/filters/notifications and in-app nutrition tracking.')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check admin/app.js
          node --check src/App.jsx

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/app.js admin/styles.css src/App.jsx
          git diff --cached --check
          git commit -m "feat: add live customer management and nutrition tracking"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git rm .github/workflows/patch-nutrition-admin.yml
          git commit -m "chore: remove temporary nutrition admin patch workflow"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
