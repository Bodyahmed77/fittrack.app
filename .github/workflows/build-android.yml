name: Build Fifty Fit Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Apply launch product patch once
        run: |
          python3 scripts/apply-launch-product-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/app.js admin/styles.css src/App.jsx
          if git diff --cached --quiet; then
            echo "Launch product patch already applied."
          else
            git diff --cached --check
            git commit -m "feat: live customer management and nutrition tracking"
            git push origin HEAD:main
          fi
          git rm scripts/apply-launch-product-patch.py
          git commit -m "chore: remove one-time launch patch script"
          git push origin HEAD:main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 / build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Extract Google Web Client ID
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/extract-google-web-client-id.py

      - name: Build the web app
        run: npm run build

      - name: Add the Android platform
        run: npx cap add android || true

      - name: Inject google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}"
          mkdir -p android/app
          echo "$GS_B64" | base64 -d > android/app/google-services.json
          python3 - <<'PY'
          import json
          p='android/app/google-services.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d.get('project_info', {}).get('project_id') == 'fittrack-698fa'
          packages=[(c.get('client_info') or {}).get('android_client_info', {}).get('package_name') for c in d.get('client') or []]
          assert 'com.fittrack.app' in packages
          print('google-services.json OK')
          PY

      - name: Configure Google Services and Google Sign-In
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android')
          rb=root/'build.gradle'
          ab=root/'app'/'build.gradle'
          text=rb.read_text(encoding='utf-8')
          if "com.google.gms:google-services" not in text:
              text=text.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'", 1)
          rb.write_text(text,encoding='utf-8')
          text=ab.read_text(encoding='utf-8')
          if "play-services-auth" not in text:
              text=text.replace("dependencies {", "dependencies {\n    implementation 'com.google.android.gms:play-services-auth:21.0.0'", 1)
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          ab.write_text(text,encoding='utf-8')
          PY

      - name: Force Android API 36 target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          text=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          if 'targetSdkVersion' not in text: text += '\next.targetSdkVersion = 36\n'
          if 'compileSdkVersion' not in text: text += '\next.compileSdkVersion = 36\n'
          p.write_text(text,encoding='utf-8')
          print('Android target/compile SDK = 36')
          PY

      - name: Generate app assets and sync Capacitor
        run: |
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Inject Android system UI
        run: python3 scripts/inject-android-system-ui.py

      - name: Inject Google OAuth deep link
        run: python3 scripts/inject-google-auth-deeplink.py

      - name: Verify Android release configuration
        working-directory: android
        run: |
          grep -n "targetSdkVersion\|compileSdkVersion" variables.gradle
          grep -n "namespace\|applicationId" app/build.gradle

      - name: Decode release signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}"
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Build signed release AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-release-aab-api36
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-release-apk-api36
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
