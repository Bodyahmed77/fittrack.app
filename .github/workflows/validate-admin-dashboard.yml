name: Validate external admin dashboard

on:
  push:
    branches:
      - fix/fifty-fit-launch-polish

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align Firebase SDK with app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/app.js')
          text=p.read_text(encoding='utf-8').replace('firebasejs/12.1.0/', 'firebasejs/11.2.0/')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Check admin JavaScript syntax
        run: node --check admin/app.js
      - name: Check admin HTML/CSS presence
        run: |
          test -s admin/index.html
          test -s admin/styles.css
          test -s admin/firebase-config.js
      - name: Validate web build
        run: |
          npm ci
          npm run build
      - name: Commit SDK alignment and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/app.js
          git diff --cached --check
          git commit -m "chore: align admin Firebase SDK version"
          git push origin HEAD:fix/fifty-fit-launch-polish
          git rm .github/workflows/validate-admin-dashboard.yml
          git commit -m "chore: remove temporary admin validation workflow"
          git push origin HEAD:fix/fifty-fit-launch-polish
