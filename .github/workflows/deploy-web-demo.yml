name: Deploy Fifty Fit Web Demo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vite.release.config.js'
      - '.github/workflows/deploy-web-demo.yml'
      - 'admin/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-demo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # IMPORTANT: the public demo is the real Fifty Fit React app, not a
      # separately reimplemented UI. The build-time adapter supplies a
      # synthetic local account and disables production auth/billing/backend
      # side effects while keeping the exact production App.jsx UI and flows.
      - name: Build the canonical Fifty Fit app in web-demo mode
        env:
          VITE_WEB_DEMO: '1'
        run: npm run build

      - name: Validate demo artifact
        run: |
          set -euo pipefail
          test -s dist/index.html
          test "$(find dist/assets -maxdepth 1 -type f | wc -l)" -ge 1
          grep -q 'Fifty Fit' dist/index.html

      - name: Runtime smoke test in headless Chrome
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 --config vite.release.config.js >/tmp/fiftyfit-webdemo.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:4173/?demo=1' >/tmp/fiftyfit-demo-dom.html
          grep -q 'Fifty Fit' /tmp/fiftyfit-demo-dom.html
          ! grep -qi 'Something went wrong' /tmp/fiftyfit-demo-dom.html
          ! grep -qi 'حصل خطأ غير متوقع' /tmp/fiftyfit-demo-dom.html
          echo 'Canonical Fifty Fit web demo runtime smoke test passed'

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf dist/admin
          cp -R admin dist/admin
          cp dist/index.html dist/404.html
          test -s dist/404.html
          test -s dist/admin/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
