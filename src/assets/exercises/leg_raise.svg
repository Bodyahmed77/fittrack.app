<?xml version="1.0" encoding="UTF-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dd6b20" />
      <stop offset="100%" stop-color="#c05621" />
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>
  </defs>
  <!-- hanging bar -->
  <rect x="30" y="20" width="140" height="8" rx="4" fill="url(#bar)" />
  <rect x="38" y="28" width="8" height="60" rx="4" fill="#718096" />
  <rect x="154" y="28" width="8" height="60" rx="4" fill="#718096" />
  <!-- arms hanging -->
  <path
    d="M84 40 L80 70 L80 88"
    fill="none"
    stroke="url(#skin)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M116 40 L120 70 L120 88"
    fill="none"
    stroke="url(#skin)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="84" cy="40" r="7" fill="url(#skin)" />
  <circle cx="116" cy="40" r="7" fill="url(#skin)" />
  <!-- body hanging -->
  <rect x="78" y="90" width="44" height="40" rx="10" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="74" r="15" fill="url(#skin)" />
  <!-- legs raised -->
  <path
    d="M84 130 L70 112 L70 96"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M116 130 L130 112 L130 96"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- feet -->
  <rect x="62" y="88" width="22" height="8" rx="4" fill="#2d3748" />
  <rect x="116" y="88" width="22" height="8" rx="4" fill="#2d3748" />
</svg>
