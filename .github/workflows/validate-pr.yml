name: Validate Fifty Fit PR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fiftyfit-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android API 36 / build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies without source-mutating postinstall
        run: npm ci --ignore-scripts

      - name: Apply required native diagnostics only
        run: |
          set -euo pipefail
          test -f scripts/apply-google-native-diagnostics.py
          python3 scripts/apply-google-native-diagnostics.py

      - name: Validate production invariants
        run: python3 scripts/validate-production-invariants.py

      - name: Validate update safety
        run: python3 scripts/validate-update-safety.py

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate nutrition macro math
        run: python3 scripts/validate-nutrition-macro-math.py

      - name: Validate JavaScript syntax
        run: |
          node --check src/googleAuth.js
          node --check src/billing.js
          node --check src/registerPurchase.js
          node --check src/adminApi.js
          node --check admin/app.js
          node --check admin/boot.js
          node --check admin/cardio.js
          node --check admin/nutrition-builder.js
          node --check admin/publish-any-plan.js
          node --check admin/command-center-v3.js
          node --check docs/admin/boot.js

      - name: Validate public Pages source routes
        run: |
          set -euo pipefail
          for file in docs/privacy-policy.html docs/account-deletion.html docs/admin/index.html admin/index.html admin/boot.js; do
            test -s "$file"
          done
          grep -qi 'Privacy Policy' docs/privacy-policy.html
          grep -qi 'Account Deletion' docs/account-deletion.html
          grep -qi 'Fifty Fit Admin' docs/admin/index.html
          grep -q 'command-center-v3.js' admin/boot.js
          grep -q 'command-center-v3.js' docs/admin/boot.js
          echo 'Public Pages source routes verified'

      - name: Validate dependency manifest consistency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('package.json').read_text())
          l = json.loads(Path('package-lock.json').read_text())
          root = l['packages']['']
          assert root['devDependencies']['@vitejs/plugin-react'] == p['devDependencies']['@vitejs/plugin-react']
          assert root['devDependencies']['vite'] == p['devDependencies']['vite']
          assert root['dependencies']['@capacitor/network'] == p['dependencies']['@capacitor/network']
          assert root['dependencies']['@capacitor/status-bar'] == p['dependencies']['@capacitor/status-bar']
          print('package.json/package-lock.json consistency passed')
          PY

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          test -d android/app

      - name: Inject google-services.json for Android compile validation
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}" || { echo 'GOOGLE_SERVICES_JSON_BASE64 secret is missing'; exit 1; }
          mkdir -p android/app
          printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Prepare production Android native bridges
        run: |
          set -euo pipefail
          npx cap sync android
          rm -rf node_modules/capacitor-billing
          python3 scripts/inject-fiftyfit-billing-v2.py
          python3 scripts/apply-billing-main-thread.py
          python3 scripts/inject-android-system-ui.py
          python3 scripts/harden-tiktok-player-webview.py
          test -f android/app/src/main/java/com/bodyahmed77/fiftyfit/billing/FiftyFitBillingPlugin.java

      - name: Validate first-party Play Billing bridge
        run: |
          set -euo pipefail
          grep -q 'FIFTYFIT_NATIVE_BILLING_V7' android/app/src/main/java/com/bodyahmed77/fiftyfit/billing/FiftyFitBillingPlugin.java
          grep -q 'FIFTYFIT_BILLING_MAIN_THREAD_V1' android/app/src/main/java/com/bodyahmed77/fiftyfit/billing/FiftyFitBillingPlugin.java
          grep -q 'runOnUiThread' android/app/src/main/java/com/bodyahmed77/fiftyfit/billing/FiftyFitBillingPlugin.java
          grep -q 'registerPlugin(FiftyFitBillingPlugin.class)' android/app/src/main/java/com/bodyahmed77/fiftyfit/MainActivity.java
          grep -q 'com.android.billingclient:billing:9.1.0' android/app/build.gradle
          test ! -d node_modules/capacitor-billing
          echo 'First-party Billing bridge validation passed'

      - name: Compile Android debug artifact (production Billing compatibility gate)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify release-time Billing normalization transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('vite.config.js').read_text(encoding='utf-8')
          required = ['extractBillingResponseCode', 'resolvedResponseCode']
          for item in required:
              assert item in text, item
          print('Billing normalization transform gate passed')
          PY

      - name: Check Android release workflow syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/build-android.yml').read_text(encoding='utf-8')
          assert 'gradlew' in text
          assert 'assembleRelease' in text and 'bundleRelease' in text
          assert 'FiftyFitBillingPlugin.java' in text
          print('Android release workflow sanity passed')
          PY
