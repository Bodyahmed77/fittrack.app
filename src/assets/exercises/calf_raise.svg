<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38a169" />
      <stop offset="100%" stop-color="#2f855a" />
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- calf raise step -->
  <rect x="40" y="150" width="120" height="10" rx="5" fill="url(#machine)" />
  <rect x="60" y="160" width="14" height="24" rx="4" fill="#718096" />
  <rect x="126" y="160" width="14" height="24" rx="4" fill="#718096" />
  <!-- body standing on toes -->
  <rect x="78" y="70" width="44" height="56" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="54" r="15" fill="url(#skin)" />
  <!-- legs -->
  <rect x="84" y="126" width="15" height="22" rx="5" fill="url(#shorts)" />
  <rect x="101" y="126" width="15" height="22" rx="5" fill="url(#shorts)" />
  <!-- calves -->
  <rect x="86" y="146" width="12" height="12" rx="4" fill="url(#skin)" />
  <rect x="102" y="146" width="12" height="12" rx="4" fill="url(#skin)" />
  <!-- feet on toes -->
  <rect x="80" y="158" width="16" height="8" rx="3" fill="#2d3748" />
  <rect x="104" y="158" width="16" height="8" rx="3" fill="#2d3748" />
  <!-- arms resting -->
  <path
    d="M84 76 L70 70 L62 74"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M116 76 L130 70 L138 74"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="62" cy="74" r="7" fill="url(#skin)" />
  <circle cx="138" cy="74" r="7" fill="url(#skin)" />
</svg>
