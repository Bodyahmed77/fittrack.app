<?xml version="1.0" encoding="UTF-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53e3e" />
      <stop offset="100%" stop-color="#c53030" />
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>
  </defs>
  <!-- pull up bar -->
  <rect x="20" y="26" width="12" height="8" rx="4" fill="#718096" />
  <rect x="120" y="26" width="12" height="8" rx="4" fill="#718096" />
  <rect x="30" y="22" width="140" height="8" rx="4" fill="url(#bar)" />
  <!-- arms pulling up -->
  <path
    d="M70 50 L50 36 L44 30"
    fill="none"
    stroke="url(#skin)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M130 50 L150 36 L156 30"
    fill="none"
    stroke="url(#skin)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="44" cy="30" r="7" fill="url(#skin)" />
  <circle cx="156" cy="30" r="7" fill="url(#skin)" />
  <!-- body rising -->
  <rect x="78" y="56" width="44" height="52" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="44" r="15" fill="url(#skin)" />
  <!-- legs -->
  <rect x="84" y="108" width="15" height="46" rx="5" fill="url(#shorts)" />
  <rect x="101" y="108" width="15" height="46" rx="5" fill="url(#shorts)" />
  <!-- feet -->
  <rect x="78" y="158" width="24" height="9" rx="4" fill="#2d3748" />
  <rect x="98" y="158" width="24" height="9" rx="4" fill="#2d3748" />
</svg>
