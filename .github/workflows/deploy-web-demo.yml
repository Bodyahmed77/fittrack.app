name: Deploy Fifty Fit Web Demo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vite.release.config.js'
      - '.github/workflows/deploy-web-demo.yml'
      - 'admin/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-demo
  cancel-in-progress: true

env:
  VITE_WEB_DEMO: '1'

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build isolated demo
        run: VITE_WEB_DEMO=1 npm run build

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf dist/admin
          cp -R admin dist/admin
          cp dist/index.html dist/404.html

      - name: Validate generated demo artifact
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/admin/index.html
          test -d dist/assets
          grep -R "fiftyfit:web-demo:v5" dist/assets --include='*.js' >/dev/null
          grep -q 'assets/' dist/index.html
          echo "Web demo artifact validated"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
