name: Normalize legal branding

on:
  push:
    branches: [fix/play-readiness-p0-p1]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/normalize-legal-branding.py
      - run: npm ci
      - run: npm run build
