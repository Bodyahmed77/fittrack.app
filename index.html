<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="preconnect" href="https://www.tiktok.com" crossorigin />
    <title>Fifty Fit</title>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0b0d10; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
    <script>
      /* Runtime compatibility fixes for the current release bundle.
         1) Keep the legacy bare planIds lookup alive.
         2) Keep the AI composer attached to the visible Android viewport when
            the soft keyboard opens (no manual keyboard-height inset).
         3) TikTok exercise links are opened as normal web pages inside the
            existing Android WebView. We intentionally do NOT rewrite them to
            TikTok's official embedded player. */
      (function () {
        try { window.planIds = ["training", "nutrition", "both", "ai"]; } catch (_) {}

        function viewportHeight() {
          try { return Math.max(0, Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight)); }
          catch (_) { return Math.max(0, Math.round(window.innerHeight || 0)); }
        }

        function syncAiViewport() {
          try {
            var h = viewportHeight();
            if (!h) return;
            document.documentElement.style.setProperty("--fiftyfit-visible-vh", h + "px");
            var inputs = document.querySelectorAll("input");
            for (var i = 0; i < inputs.length; i++) {
              var input = inputs[i];
              var ph = String(input.getAttribute("placeholder") || "").toLowerCase();
              if (!ph.includes("اكتب سؤالك") && !ph.includes("ask anything")) continue;
              var node = input;
              for (var depth = 0; node && depth < 8; depth++, node = node.parentElement) {
                var cs = window.getComputedStyle(node);
                if (cs.position === "fixed" || cs.position === "absolute") {
                  var bottom = cs.bottom;
                  if (bottom === "0px" || bottom === "auto" || node.style.inset === "0px" || node.style.inset === "0") {
                    node.style.setProperty("bottom", "auto", "important");
                    node.style.setProperty("height", h + "px", "important");
                    node.style.setProperty("max-height", h + "px", "important");
                    if (cs.position === "fixed") node.style.setProperty("top", "0px", "important");
                  }
                }
              }
            }
          } catch (_) {}
        }

        function extractTikTokUrl(src) {
          var raw = String(src || "");
          if (!raw) return "";
          var direct = raw.match(/https?:\/\/www\.tiktok\.com\/(?:@[^/]+\/)?video\/\d+(?:[^\s]*)?/i);
          if (direct) return direct[0];
          var shortDirect = raw.match(/https?:\/\/vt\.tiktok\.com\/[^\s"']+/i);
          if (shortDirect) return shortDirect[0];

          /* App.jsx currently wraps full/short TikTok URLs as a YouTube embed
             id because its old detector only recognizes numeric IDs. */
          var wrapped = raw.match(/youtube-nocookie\.com\/embed\/(https?:\/\/(?:www\.tiktok\.com|vt\.tiktok\.com)\/[^?&\s]+)/i);
          if (wrapped) return wrapped[1];
          return "";
        }

        var lastTikTokNavigation = "";
        function handleTikTokFrames() {
          try {
            var frames = document.querySelectorAll("iframe");
            for (var i = 0; i < frames.length; i++) {
              var url = extractTikTokUrl(frames[i].getAttribute("src") || frames[i].src);
              if (!url || lastTikTokNavigation === url) continue;
              lastTikTokNavigation = url;
              /* Load the public TikTok page in the existing Capacitor WebView.
                 This is the requested browser-like web mode, not TikTok's
                 official embedded player. Android WebView keeps navigation
                 history, so Back can return to Fifty Fit. */
              window.location.assign(url);
              return;
            }
          } catch (_) {}
        }

        try {
          var vv = window.visualViewport;
          if (vv) {
            vv.addEventListener("resize", syncAiViewport, { passive: true });
            vv.addEventListener("scroll", syncAiViewport, { passive: true });
          }
          window.addEventListener("resize", syncAiViewport, { passive: true });
          window.addEventListener("orientationchange", syncAiViewport, { passive: true });
          var observer = new MutationObserver(function () { syncAiViewport(); handleTikTokFrames(); });
          observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["src", "style"] });
          setTimeout(syncAiViewport, 0);
          setTimeout(syncAiViewport, 250);
          setTimeout(syncAiViewport, 700);
        } catch (_) {}

        try {
          document.addEventListener("focusin", function (event) {
            var el = event.target;
            var ph = String(el && el.getAttribute ? el.getAttribute("placeholder") || "" : "").toLowerCase();
            if (ph.includes("اكتب سؤالك") || ph.includes("ask anything")) {
              setTimeout(syncAiViewport, 40);
              setTimeout(syncAiViewport, 180);
            }
          }, true);
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/networkGuard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
