name: Harden admin plan rules

on:
  push:
    branches:
      - fix/fifty-fit-launch-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Firestore rules
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('firestore.rules')
          text=p.read_text(encoding='utf-8')
          old='''          request.auth.uid == userId &&\n          request.resource.data.get("entitlements", {}) ==\n            resource.data.get("entitlements", {})\n        )\n      );'''
          new='''          request.auth.uid == userId &&\n          request.resource.data.get("entitlements", {}) ==\n            resource.data.get("entitlements", {}) &&\n          !request.resource.data.diff(resource.data).affectedKeys().hasAny([\n            "customTrainingPlan",\n            "customNutritionPlan"\n          ])\n        )\n      );'''
          if old not in text: raise SystemExit('rules update marker missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git diff --cached --check
          git commit -m "security: prevent client edits to admin plans"
          git push origin HEAD:fix/fifty-fit-launch-polish
          git rm .github/workflows/harden-admin-plan-rules.yml
          git commit -m "chore: remove temporary rules workflow"
          git push origin HEAD:fix/fifty-fit-launch-polish
