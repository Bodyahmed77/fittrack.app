name: Align AI Quota Date
on:
  push:
    branches: [fix/play-readiness-p0-p1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/ai-coach/index.ts')
          s=p.read_text()
          old='''    const localDate = new Intl.DateTimeFormat("en-CA", {\n      timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit",\n    }).format(new Date());'''
          new='''    // Quota bucket is server UTC, matching the PostgreSQL RPC's current_date.\n    // The client-supplied localDate remains intentionally ignored.\n    const localDate = new Date().toISOString().slice(0, 10);'''
          if old not in s: raise SystemExit('AI date block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/ai-coach/index.ts
          git commit -m 'fix: align AI quota clock with server UTC'
          git push
