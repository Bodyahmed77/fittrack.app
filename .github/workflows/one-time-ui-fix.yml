name: One-time UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # index.html: stop rewriting valid TikTok URLs into author-less /video/<id> URLs.
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('    <script type="module" src="/src/published-plan-ui.js"></script>\n', '')
          s = re.sub(r'        function normalizeTikTokUrl\(raw\) \{.*?        \}\n\n        function keepTikTokInsideIframe\(\) \{.*?        \}\n', '''        function keepTikTokInsideIframe() {
          try {
            var frames = document.querySelectorAll("iframe");
            for (var i = 0; i < frames.length; i++) {
              var frame = frames[i];
              var raw = frame.getAttribute("src") || "";
              if (!/tiktok\\.com/i.test(raw)) continue;
              // Keep the exact TikTok web URL supplied by the app. Do not
              // convert it to /video/<id> or /player/v1/<id> — author-less
              // TikTok URLs can return 404 and the official player is not wanted.
              frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups");
              frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
              frame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
            }
          } catch (_) {}
        }
''', s, flags=re.S)
          p.write_text(s)

          # App.jsx: remove the old TikTok player prefetch and wire notification navigation.
          p = Path('src/App.jsx')
          s = p.read_text()
          old_prefetch = re.compile(r'  useEffect\(\(\) => \{\n    if \(!videoId \|\| typeof document === "undefined"\) return undefined;.*?  \}, \[videoId\]\);\n  const close = useCallback', re.S)
          s2, n = old_prefetch.subn('  const close = useCallback', s, count=1)
          if n != 1:
              raise SystemExit('VideoPlayer prefetch block not found')
          s = s2

          # Add the published nutrition plan to the real React Plans screen.
          marker = '''      <TopBar title={ar ? "الخطط" : "Plans"} />\n      <div style={{ padding: "0 18px 4px", color: C.sub, fontSize: 12.5 }}>'''
          insert = '''      <TopBar title={ar ? "الخطط" : "Plans"} />\n      {data.customNutritionPlan && data.entitlements.nutritionPro && (\n        <div style={{ padding: "0 18px 10px" }}>\n          <Card\n            onClick={() => go("nutritionPlan")}\n            style={{\n              background: C.greenSoft,\n              border: `1.5px solid ${C.green}66`,\n              cursor: "pointer",\n            }}\n          >\n            <div style={{ color: C.sub, fontSize: 10, fontWeight: 900, letterSpacing: 0.6 }}>\n              {ar ? "خطة مخصصة" : "PERSONALIZED PLAN"}\n            </div>\n            <div style={{ color: C.text, fontSize: 15, fontWeight: 900, marginTop: 4 }}>\n              🍽️ {ar ? (data.customNutritionPlan.titleAr || "خطتك الغذائية") : (data.customNutritionPlan.title || "Your Nutrition Plan")}\n            </div>\n            <div style={{ color: C.sub, fontSize: 11.5, marginTop: 4 }}>\n              {ar ? `تبدأ ${data.customNutritionPlan.startDate || dateKey(0)}` : `Starts ${data.customNutritionPlan.startDate || dateKey(0)}`}\n            </div>\n            <div style={{ color: C.text, fontSize: 11.5, fontWeight: 800, marginTop: 9 }}>\n              {ar ? "فتح خطة التغذية ←" : "Open Nutrition Plan →"}\n            </div>\n          </Card>\n        </div>\n      )}\n      <div style={{ padding: "0 18px 4px", color: C.sub, fontSize: 12.5 }}>'''
          if marker not in s:
              raise SystemExit('Plans marker not found')
          s = s.replace(marker, insert, 1)

          # Notifications: opening a notification navigates to its target, not only read state.
          s = s.replace('function NotificationsScreen({ back }) {', 'function NotificationsScreen({ back, onOpen }) {', 1)
          old_mark = '''  const markRead = async (notification) => {\n    if (!notification?.id || notification.read || !auth.currentUser?.uid) return;\n    try {\n      await updateDoc(doc(db, "users", auth.currentUser.uid, "notifications", notification.id), { read: true });\n    } catch {}\n  };'''
          new_mark = '''  const markRead = async (notification) => {\n    if (!notification?.id || notification.read || !auth.currentUser?.uid) return;\n    try {\n      await updateDoc(doc(db, "users", auth.currentUser.uid, "notifications", notification.id), { read: true });\n    } catch {}\n  };\n\n  const openNotification = async (notification) => {\n    await markRead(notification);\n    const target = notification?.route?.screen || notification?.screen;\n    const targetParams = notification?.route?.params || notification?.params || {};\n    if (target) { onOpen?.(target, targetParams); return; }\n    if (notification?.type === "nutrition_plan_ready") { onOpen?.("nutritionPlan", {}); return; }\n    if (notification?.type === "training_plan_ready") { onOpen?.("workout", {}); return; }\n    if (notification?.type === "subscription") { onOpen?.("paywall", {}); }\n  };'''
          if old_mark not in s:
              raise SystemExit('Notification markRead block not found')
          s = s.replace(old_mark, new_mark, 1)
          s = s.replace('onClick={() => markRead(n)} style={{ border: n.read', 'onClick={() => openNotification(n)} style={{ border: n.read', 1)
          s = s.replace('content = <NotificationsScreen back={back} />;', 'content = <NotificationsScreen back={back} onOpen={(target, targetParams) => go(target, targetParams)} />;', 1)
          p.write_text(s)

          # Remove the obsolete DOM-injection workaround; published plans now render natively.
          Path('src/published-plan-ui.js').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/App.jsx src/published-plan-ui.js .github/workflows/one-time-ui-fix.yml
          git commit -m "fix: native published plan and in-app notification navigation" || exit 0
          git push

          # Remove this one-time workflow so it cannot run on later pushes.
          git rm .github/workflows/one-time-ui-fix.yml
          git commit -m "chore: remove one-time maintenance workflow"
          git push
