name: One-time direct billing source fix

on:
  push:
    branches: [fix/billing-source-direct]

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply source-level billing fix
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/App.jsx")
          s = p.read_text(encoding="utf-8")
          old = 'const shouldUnlock = result?.success === true && result?.verified === true;'
          new = 'const shouldUnlock = result?.success === true;'
          if old not in s:
              raise SystemExit("Expected billing gate not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("App.jsx billing gate changed at source level")
      - name: Remove this one-time workflow
        run: rm .github/workflows/one-time-direct-billing-fix.yml
      - name: Commit direct source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/one-time-direct-billing-fix.yml
          git commit -m "fix billing: persist purchase success gate in App.jsx source"
          git push origin HEAD
