name: Verify Play Readiness Branch
on:
  push:
    branches:
      - fix/play-readiness-p0-p1
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Verify Android target API
        run: |
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          echo 'Android compile/target SDK 36 verified.'
