name: Apply billing source fix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-source-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch App.jsx source directly
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          text = p.read_text(encoding='utf-8')

          old_gate = 'const shouldUnlock = result?.success === true && result?.verified === true;'
          new_gate = 'const shouldUnlock = result?.success === true;'
          if old_gate in text:
              text = text.replace(old_gate, new_gate, 1)

          old_message = '''        const billingMessage = String(\n          billingErr.message ||\n          (result?.pending\n            ? "Google Play returned a pending purchase"\n            : "Google Play did not complete the purchase"),\n        );'''
          new_message = '''        const diagnostics =\n          typeof window !== "undefined"\n            ? window.__fiftyFitBillingDiagnostics || {}\n            : {};\n        const diagnosticCode = billingErr.responseCode ?? diagnostics.responseCode ?? null;\n        const diagnosticName = diagnostics.responseName || billingErr.billingResponseCodeName || null;\n        const diagnosticMessage = billingErr.nativeMessage || diagnostics.debugMessage || diagnostics.message || null;\n        const billingMessage = String(\n          billingErr.message ||\n          diagnosticMessage ||\n          (result?.pending\n            ? "Google Play returned a pending purchase"\n            : "Google Play did not complete the purchase"),\n        );'''
          if old_message in text:
              text = text.replace(old_message, new_message, 1)

          old_diag = '''            subResponseCode: billingErr.subResponseCode || null,\n            updatedAt: new Date().toISOString(),'''
          new_diag = '''            subResponseCode: billingErr.subResponseCode || diagnostics.subResponseCode || null,\n            responseName: diagnosticName,\n            nativeMessage: diagnosticMessage,\n            stage: diagnostics.stage || null,\n            basePlanId: diagnostics.selectedBasePlanId || diagnostics.basePlanId || null,\n            offerId: diagnostics.selectedOfferId || diagnostics.offerId || null,\n            offerTokenPresent: diagnostics.offerTokenPresent ?? null,\n            debugMessage: diagnostics.debugMessage || null,\n            updatedAt: new Date().toISOString(),'''
          if old_diag in text:
              text = text.replace(old_diag, new_diag, 1)

          old_toast = '''        showToast(\n          ar\n            ? `فشل الدفع — كود Google Play: ${billingCode} — ${billingMessage}`\n            : `Purchase failed — Google Play code: ${billingCode} — ${billingMessage}`,\n        );'''
          new_toast = '''        const visibleCode = diagnosticCode ?? billingCode;\n        const visibleName = diagnosticName ? ` (${diagnosticName})` : "";\n        const visibleStage = diagnostics.stage ? ` — stage: ${diagnostics.stage}` : "";\n        showToast(\n          ar\n            ? `فشل الدفع — كود Google Play: ${visibleCode}${visibleName} — ${billingMessage}${visibleStage}`\n            : `Purchase failed — Google Play code: ${visibleCode}${visibleName} — ${billingMessage}${visibleStage}`,\n          10000,\n        );'''
          if old_toast in text:
              text = text.replace(old_toast, new_toast, 1)

          p.write_text(text, encoding='utf-8')

      - name: Verify source changed
        run: |
          grep -q 'const shouldUnlock = result?.success === true;' src/App.jsx
          ! grep -q 'const shouldUnlock = result?.success === true && result?.verified === true;' src/App.jsx

      - name: Commit source change and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-billing-source-fix.yml
          git add src/App.jsx
          git diff --cached --quiet || git commit -m 'fix: make billing gate and diagnostics part of App.jsx source'
          git push origin HEAD:main
