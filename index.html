<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="preconnect" href="https://www.tiktok.com" crossorigin />
    <title>Fifty Fit</title>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #0b0d10; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
    <script>
      /* Runtime compatibility fixes for the current Android release.
         1) Keep the legacy bare planIds lookup alive.
         2) Keep the AI composer attached to the visible Android viewport when
            the soft keyboard opens.
         3) TikTok exercises use a normal top-level TikTok web page inside the
            existing Capacitor Android WebView. We do NOT use TikTok's official
            embedded player and we do NOT send the user to the external app. */
      (function () {
        try { window.planIds = ["training", "nutrition", "both", "ai"]; } catch (_) {}

        function viewportHeight() {
          try { return Math.max(0, Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight)); }
          catch (_) { return Math.max(0, Math.round(window.innerHeight || 0)); }
        }

        function syncAiViewport() {
          try {
            var h = viewportHeight();
            if (!h) return;
            document.documentElement.style.setProperty("--fiftyfit-visible-vh", h + "px");
            var inputs = document.querySelectorAll("input");
            for (var i = 0; i < inputs.length; i++) {
              var input = inputs[i];
              var ph = String(input.getAttribute("placeholder") || "").toLowerCase();
              if (!ph.includes("اكتب سؤالك") && !ph.includes("ask anything")) continue;
              var node = input;
              for (var depth = 0; node && depth < 8; depth++, node = node.parentElement) {
                var cs = window.getComputedStyle(node);
                if (cs.position === "fixed" || cs.position === "absolute") {
                  node.style.setProperty("bottom", "0px", "important");
                  node.style.setProperty("max-height", h + "px", "important");
                  node.style.setProperty("height", h + "px", "important");
                }
              }
            }
          } catch (_) {}
        }

        function normalizeTikTokUrl(raw) {
          var value = String(raw || "").trim();
          if (!value) return "";

          /* Undo old/unsupported official-player URLs so the user gets the
             normal TikTok page they asked for. */
          var player = value.match(/https?:\/\/www\.tiktok\.com\/player\/v1\/(\d+)/i);
          if (player) return "https://www.tiktok.com/video/" + player[1];

          var full = value.match(/https?:\/\/www\.tiktok\.com\/(?:@[^/]+\/)?video\/(\d+)/i);
          if (full) return "https://www.tiktok.com/video/" + full[1];

          var shortUrl = value.match(/https?:\/\/vt\.tiktok\.com\/[^\s"']+/i);
          if (shortUrl) return shortUrl[0];

          /* App.jsx may hand the viewer a bare TikTok post id. */
          if (/^\d{15,25}$/.test(value)) return "https://www.tiktok.com/video/" + value;

          /* Old builds sometimes wrapped the TikTok URL in a YouTube embed. */
          var wrapped = value.match(/youtube-nocookie\.com\/embed\/(https?:\/\/(?:www\.tiktok\.com|vt\.tiktok\.com)\/[^?&\s]+)/i);
          if (wrapped) return normalizeTikTokUrl(wrapped[1]);

          return "";
        }

        var lastTikTokNavigation = "";
        function openTikTokAsWebViewPage(url) {
          if (!url || url === lastTikTokNavigation) return;
          lastTikTokNavigation = url;
          /* This is deliberately a top-level navigation in the existing
             Capacitor WebView: visually it behaves like opening a browser
             page in-app, with the full TikTok web experience. Android WebView
             navigation history lets Back return to Fifty Fit. */
          try { window.location.assign(url); }
          catch (_) { try { window.location.href = url; } catch (__) {} }
        }

        function scanTikTokFrames() {
          try {
            var frames = document.querySelectorAll("iframe");
            for (var i = 0; i < frames.length; i++) {
              var raw = frames[i].getAttribute("src") || frames[i].src || "";
              var url = normalizeTikTokUrl(raw);
              if (url) {
                openTikTokAsWebViewPage(url);
                return;
              }
            }
          } catch (_) {}
        }

        function scanTikTokIntent() {
          try {
            var nodes = document.querySelectorAll("a,button,[role='button']");
            for (var i = 0; i < nodes.length; i++) {
              var text = String(nodes[i].textContent || "").toLowerCase();
              if (!text) continue;
              if (!text.includes("شوف الشورت") && !text.includes("مشاهدة الفيديو") && !text.includes("watch short") && !text.includes("watch video")) continue;
              nodes[i].addEventListener("click", function () {
                setTimeout(scanTikTokFrames, 0);
                setTimeout(scanTikTokFrames, 60);
                setTimeout(scanTikTokFrames, 250);
              }, { once: true, passive: true });
            }
          } catch (_) {}
        }

        try {
          var vv = window.visualViewport;
          if (vv) {
            vv.addEventListener("resize", syncAiViewport, { passive: true });
            vv.addEventListener("scroll", syncAiViewport, { passive: true });
          }
          window.addEventListener("resize", syncAiViewport, { passive: true });
          window.addEventListener("orientationchange", syncAiViewport, { passive: true });
          var observer = new MutationObserver(function () {
            syncAiViewport();
            scanTikTokFrames();
            scanTikTokIntent();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["src", "style"] });
          setTimeout(syncAiViewport, 0);
          setTimeout(syncAiViewport, 250);
          setTimeout(syncAiViewport, 700);
          setTimeout(scanTikTokFrames, 0);
          setTimeout(scanTikTokIntent, 0);
        } catch (_) {}

        try {
          document.addEventListener("focusin", function (event) {
            var el = event.target;
            var ph = String(el && el.getAttribute ? el.getAttribute("placeholder") || "" : "").toLowerCase();
            if (ph.includes("اكتب سؤالك") || ph.includes("ask anything")) {
              setTimeout(syncAiViewport, 40);
              setTimeout(syncAiViewport, 180);
            }
          }, true);
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/networkGuard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
