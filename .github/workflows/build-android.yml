name: Build Fifty Fit Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 / build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Validate source syntax
        run: |
          set -euo pipefail
          test -s src/App.jsx
          test -s src/googleAuth.js
          test -s src/billing.js
          test -s src/config.js
          node --check src/googleAuth.js
          node --check src/billing.js

      - name: Extract Google Web Client ID
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/extract-google-web-client-id.py

      - name: Build the web app
        run: npm run build

      - name: Add the Android platform
        run: npx cap add android || true

      - name: Inject google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${GS_B64:-}" || { echo 'GOOGLE_SERVICES_JSON_BASE64 secret is missing'; exit 1; }
          printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('android/app/google-services.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d.get('project_info', {}).get('project_id') == 'fittrack-698fa', 'Unexpected Firebase project_id'
          package = 'com.bodyahmed77.fiftyfit'
          matching = [c for c in (d.get('client') or []) if ((c.get('client_info') or {}).get('android_client_info') or {}).get('package_name') == package]
          assert matching, f'No google-services client for {package}'
          certs = []
          for client in matching:
              for oauth in client.get('oauth_client') or []:
                  if oauth.get('client_type') == 1:
                      cert = ((oauth.get('android_info') or {}).get('certificate_hash') or '').replace(':','').lower()
                      if cert:
                          certs.append(cert)
          required = {
              'deployment': 'e961b1050f3171d90877e9ff0cd156b960321a87',
              'hybrid_classical': '55384cf206854973c68dfba5be2a1bba8e048bee',
              'hybrid_pqc': '5fd40a5821b05277f2d0bd055918676f7912c131',
              'upload': 'c62c4d0c0ae964620887e464835de5196842131b',
          }
          missing = [label for label, value in required.items() if value not in set(certs)]
          assert not missing, f'google-services.json missing required OAuth SHA-1 entries: {missing}'
          print('google-services.json preflight OK')
          print('OAuth SHA-1 values:', sorted(set(certs)))
          print('google-services.json sha256:', hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Configure Google Services and native Google Sign-In dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('android')
          rb = root / 'build.gradle'
          ab = root / 'app' / 'build.gradle'
          vg = root / 'variables.gradle'

          text = rb.read_text(encoding='utf-8')
          if 'com.google.gms:google-services' not in text:
              text = text.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'", 1)
          rb.write_text(text, encoding='utf-8')

          text = ab.read_text(encoding='utf-8')
          if 'play-services-auth' not in text:
              text = text.replace('dependencies {', "dependencies {\n    implementation 'com.google.android.gms:play-services-auth:21.0.0'", 1)
          if 'com.google.gms.google-services' not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          if 'enableSplit = false' not in text:
              text += "\nandroid {\n    bundle {\n        language { enableSplit = false }\n    }\n}\n"
          ab.write_text(text, encoding='utf-8')

          text = vg.read_text(encoding='utf-8')
          if 'rgcfaIncludeGoogle' not in text:
              text = text.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'\n    androidxCredentialsPlayServicesAuthVersion = '1.3.0'\n    librariesIdentityGoogleidVersion = '1.1.1'", 1)
          else:
              text = text.replace('rgcfaIncludeGoogle = false', 'rgcfaIncludeGoogle = true')
          text = re.sub(r"androidxCredentialsVersion\s*=\s*'[^']*'", "androidxCredentialsVersion = '1.3.0'", text)
          text = re.sub(r"androidxCredentialsPlayServicesAuthVersion\s*=\s*'[^']*'", "androidxCredentialsPlayServicesAuthVersion = '1.3.0'", text)
          text = re.sub(r"librariesIdentityGoogleidVersion\s*=\s*'[^']*'", "librariesIdentityGoogleidVersion = '1.1.1'", text)
          if 'androidxCredentialsVersion' not in text:
              text = text.replace('rgcfaIncludeGoogle = true', "rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
          if 'androidxCredentialsPlayServicesAuthVersion' not in text:
              text = text.replace("androidxCredentialsVersion = '1.3.0'", "androidxCredentialsVersion = '1.3.0'\n    androidxCredentialsPlayServicesAuthVersion = '1.3.0'", 1)
          if 'librariesIdentityGoogleidVersion' not in text:
              text = text.replace("androidxCredentialsPlayServicesAuthVersion = '1.3.0'", "androidxCredentialsPlayServicesAuthVersion = '1.3.0'\n    librariesIdentityGoogleidVersion = '1.1.1'", 1)
          vg.write_text(text, encoding='utf-8')
          PY

      - name: Force Android API 36 target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/variables.gradle')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          text = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          if 'targetSdkVersion' not in text:
              text += '\next.targetSdkVersion = 36\n'
          if 'compileSdkVersion' not in text:
              text += '\next.compileSdkVersion = 36\n'
          p.write_text(text, encoding='utf-8')
          PY

      - name: Set monotonic Play version code
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          text = p.read_text(encoding='utf-8')
          n = int(os.environ.get('GITHUB_RUN_NUMBER', '1'))
          # Base 2000 so main builds stay above any previously uploaded verified builds (e.g. 2003)
          text = re.sub(r'\n\s*versionCode\s+\d+', '', text)
          text = re.sub(r'\n\s*versionName\s+"[^"]*"', '', text)
          text = text.replace('defaultConfig {', f'defaultConfig {{\n        versionCode {2000+n}\n        versionName "1.0.{n}"', 1)
          p.write_text(text, encoding='utf-8')
          print(f'versionCode={2000+n}, versionName=1.0.{n}')
          PY

      - name: Generate assets and sync Capacitor
        run: |
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Inject native TikTok WebView
        run: python3 scripts/inject-tiktok-webview.py

      - name: Force black Android system bars
        run: python3 scripts/inject-android-system-ui.py

      - name: Decode release signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KS_B64:-}" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo 'ANDROID_KEYSTORE_PASSWORD secret is missing'; exit 1; }
          test -n "${ANDROID_KEY_ALIAS:-}" || { echo 'ANDROID_KEY_ALIAS secret is missing'; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD:-}" || { echo 'ANDROID_KEY_PASSWORD secret is missing'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text(encoding='utf-8')
          if 'signingConfigs {' not in text:
              text = text.replace('android {', '''android {\n    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }''', 1)
          if 'signingConfig signingConfigs.release' not in text:
              text = text.replace('buildTypes {', 'buildTypes {\n        release { signingConfig signingConfigs.release }', 1) if 'buildTypes {' in text else text + '\nandroid { buildTypes { release { signingConfig signingConfigs.release } } }\n'
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify signing and Firebase SHA configuration
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          actual="$(keytool -list -v -keystore app/release.keystore -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" 2>/dev/null | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$actual" || { echo 'Could not read SHA-1 from release keystore'; exit 1; }
          echo "CI upload SHA-1: $actual"

      - name: Comprehensive Android release preflight
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          errors = []
          root = Path('.')
          app = root / 'app'
          gradle = app / 'build.gradle'
          vars_gradle = root / 'variables.gradle'
          top_gradle = root / 'build.gradle'
          manifest = app / 'src/main/AndroidManifest.xml'
          assets_index = app / 'src/main/assets/public/index.html'
          plugin_java = app / 'src/main/java/com/bodyahmed77/fiftyfit/TikTokWebViewPlugin.java'
          activity_java = app / 'src/main/java/com/bodyahmed77/fiftyfit/TikTokWebViewActivity.java'
          google_json = app / 'google-services.json'
          wrapper = root / 'gradlew'

          def require(ok, message):
              if not ok:
                  errors.append(message)

          for p, label in [(gradle, 'android/app/build.gradle'), (vars_gradle, 'android/variables.gradle'), (top_gradle, 'android/build.gradle'), (manifest, 'AndroidManifest.xml'), (assets_index, 'web index.html'), (plugin_java, 'TikTokWebViewPlugin.java'), (activity_java, 'TikTokWebViewActivity.java'), (google_json, 'google-services.json')]:
              require(p.is_file() and p.stat().st_size > 0, f'{label} missing or empty')
          require(wrapper.is_file() and os.access(wrapper, os.X_OK), 'Gradle wrapper missing or not executable')

          g = gradle.read_text(encoding='utf-8') if gradle.exists() else ''
          vg = vars_gradle.read_text(encoding='utf-8') if vars_gradle.exists() else ''
          mf = manifest.read_text(encoding='utf-8') if manifest.exists() else ''
          app_ids = re.findall(r"\bapplicationId\s+[\"']([^\"']+)[\"']", g)
          namespaces = re.findall(r"\bnamespace\s+[\"']([^\"']+)[\"']", g)
          require(app_ids == ['com.bodyahmed77.fiftyfit'], f'Unexpected applicationId values: {app_ids}')
          require(namespaces == ['com.bodyahmed77.fiftyfit'], f'Unexpected namespace values: {namespaces}')
          require(bool(re.search(r'compileSdkVersion\s*=\s*36\b', vg)), 'compileSdkVersion is not 36')
          require(bool(re.search(r'targetSdkVersion\s*=\s*36\b', vg)), 'targetSdkVersion is not 36')
          require('com.google.gms.google-services' in g, 'Google Services plugin missing')
          require('play-services-auth' in g, 'play-services-auth dependency missing')
          require('enableSplit = false' in g, 'AAB language split protection missing')
          require('rgcfaIncludeGoogle = true' in vg, 'Google auth support disabled')
          require("androidxCredentialsVersion = '1.3.0'" in vg, 'Credential Manager version mismatch')
          require("androidxCredentialsPlayServicesAuthVersion = '1.3.0'" in vg, 'Credential Manager Play Services Auth version mismatch')
          require("librariesIdentityGoogleidVersion = '1.1.1'" in vg, 'Google Identity version mismatch')
          require('TikTokWebViewActivity' in mf, 'TikTokWebViewActivity not present in AndroidManifest')
          require(g.count('defaultConfig {') == 1, f'Expected one defaultConfig block, found {g.count("defaultConfig {")}')
          require(len(re.findall(r'\bversionCode\s+\d+', g)) == 1, 'Expected exactly one versionCode')
          require(len(re.findall(r'\bversionName\s+[\"\'][^\"\']+[\"\']', g)) == 1, 'Expected exactly one versionName')
          expected_code = 2000 + int(os.environ.get('GITHUB_RUN_NUMBER', '1'))
          actual_code = re.findall(r'\bversionCode\s+(\d+)', g)
          require(actual_code == [str(expected_code)], f'versionCode {actual_code} != expected {expected_code}')
          require('signingConfigs {' in g and 'signingConfigs.release' in g, 'Release signing configuration missing')
          require((app / 'release.keystore').is_file() and (app / 'release.keystore').stat().st_size > 0, 'release.keystore missing or empty')

          try:
              data = json.loads(google_json.read_text(encoding='utf-8'))
              require(data.get('project_info', {}).get('project_id') == 'fittrack-698fa', 'Firebase project_id mismatch')
              clients = [c for c in (data.get('client') or []) if ((c.get('client_info') or {}).get('android_client_info') or {}).get('package_name') == 'com.bodyahmed77.fiftyfit']
              require(bool(clients), 'Matching Android client absent from google-services.json')
          except Exception as exc:
              errors.append(f'google-services.json invalid: {exc}')

          if errors:
              print('ANDROID RELEASE PREFLIGHT FAILED')
              for e in errors:
                  print(' - ' + e)
              raise SystemExit(1)
          print('ANDROID RELEASE PREFLIGHT PASSED')
          print('applicationId=com.bodyahmed77.fiftyfit')
          print('namespace=com.bodyahmed77.fiftyfit')
          print(f'versionCode={expected_code}')
          PY

      - name: Build signed release AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Collect and verify release artifacts
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          mapfile -t AABS < <(find app/build/outputs/bundle/release -maxdepth 2 -type f -name '*.aab' -print | sort)
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 2 -type f -name '*.apk' -print | sort)
          test "${#AABS[@]}" -ge 1 || { echo 'ERROR: no release AAB produced'; exit 1; }
          test "${#APKS[@]}" -ge 1 || { echo 'ERROR: no release APK produced'; exit 1; }
          cp "${AABS[0]}" release-artifacts/fifty-fit-release.aab
          cp "${APKS[0]}" release-artifacts/fifty-fit-release.apk
          test -s release-artifacts/fifty-fit-release.aab
          test -s release-artifacts/fifty-fit-release.apk
          sha256sum release-artifacts/fifty-fit-release.aab release-artifacts/fifty-fit-release.apk

      - name: Verify APK/AAB web asset parity
        working-directory: android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          aab = Path('release-artifacts/fifty-fit-release.aab')
          apk = Path('release-artifacts/fifty-fit-release.apk')
          with zipfile.ZipFile(aab) as z:
              items = sorted(n for n in z.namelist() if n.endswith('/assets/public/index.html'))
              if not items: raise SystemExit('No AAB web asset index.html found')
              ah = hashlib.sha256(z.read(items[0])).hexdigest()
          with zipfile.ZipFile(apk) as z:
              n = 'assets/public/index.html'
              if n not in z.namelist(): raise SystemExit('No APK web asset index.html found')
              ph = hashlib.sha256(z.read(n)).hexdigest()
          if ah != ph: raise SystemExit(f'APK/AAB web asset mismatch: {ah} != {ph}')
          print(f'APK/AAB web asset parity OK: {ah}')
          PY

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-android-aab-${{ github.run_number }}
          path: android/release-artifacts/fifty-fit-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fifty-fit-android-apk-${{ github.run_number }}
          path: android/release-artifacts/fifty-fit-release.apk
          if-no-files-found: error
