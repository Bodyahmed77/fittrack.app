<?xml version="1.0" encoding="UTF-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b46c1" />
      <stop offset="100%" stop-color="#553c9a" />
    </linearGradient>
  </defs>
  <!-- body in crunch (curled up) -->
  <path
    d="M70 100 L100 70 L130 100 L130 112 L100 90 L70 112 Z"
    fill="url(#shirt)"
  />
  <!-- head tucked forward -->
  <circle cx="70" cy="92" r="15" fill="url(#skin)" />
  <!-- arms crossed -->
  <path
    d="M85 78 L100 74 L115 78"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="10"
    stroke-linecap="round"
  />
  <!-- thighs -->
  <rect x="66" y="110" width="14" height="40" rx="5" fill="#2d3748" />
  <rect x="120" y="110" width="14" height="40" rx="5" fill="#2d3748" />
  <!-- feet -->
  <rect x="58" y="152" width="24" height="8" rx="4" fill="#2d3748" />
  <rect x="118" y="152" width="24" height="8" rx="4" fill="#2d3748" />
  <!-- floor -->
  <rect x="30" y="162" width="140" height="6" rx="3" fill="#4a5568" />
</svg>
