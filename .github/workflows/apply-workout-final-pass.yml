name: Apply Fifty Fit final workout pass

on:
  push:
    branches: [fix/workout-final-pass-v10]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App.jsx safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')

          # 1) Replace weekday-only status/active-day logic with real calendar dates.
          status_re = re.compile(r'function dateForDay\(dayName\) \{.*?function activeTrainingDay\(data\) \{.*?\n\}', re.S)
          replacement = r'''function dateForDay(dayName) {
  return addDays(mondayOf(dateKey(0)), DAYS.indexOf(dayName));
}

function dateToDayName(iso) {
  const d = new Date(String(iso).slice(0, 10) + "T00:00:00");
  const js = d.getDay();
  return js === 0 ? "Sun" : DAYS[js - 1];
}

function workoutDateRange(centerDate = dateKey(0), before = 3, after = 3) {
  const center = new Date(String(centerDate).slice(0, 10) + "T00:00:00");
  return Array.from({ length: before + after + 1 }, (_, i) => {
    const d = new Date(center);
    d.setDate(center.getDate() + i - before);
    return d.toISOString().slice(0, 10);
  });
}

function isDayCompleted(data, dayName, targetDate = dateForDay(dayName)) {
  const exercises = getUsableExercises(data, dayName).list;
  if (exercises.length === 0) return false;
  const log = data.logs[targetDate] || {};
  return exercises.every(
    (e) => log[e.id]?.finished || (log[e.id]?.sets || []).some((s) => s.done),
  );
}

function dayStatus(data, isoDate) {
  const date = String(isoDate).slice(0, 10);
  const today = dateKey(0);
  const dayName = dateToDayName(date);
  if (getUsableExercises(data, dayName).list.length === 0) return "rest";

  const start = data.workoutStartDate
    ? String(data.workoutStartDate).slice(0, 10)
    : null;

  // Before the program existed = outside the program, never missed.
  if (start && date < start) return "pending";
  // Future = never missed/red.
  if (date > today) return "pending";
  if (isDayCompleted(data, dayName, date)) return "done";
  // Only an incomplete scheduled workout after the program started can be missed.
  if (date < today) return "missed";
  return "pending";
}

function activeTrainingDate(data) {
  const today = dateKey(0);
  const start = data.workoutStartDate
    ? String(data.workoutStartDate).slice(0, 10)
    : today;

  if (today < start) return start;

  // Today's workout remains selected until completed. Once completed, move to
  // the next scheduled training date and skip Rest days.
  if (!isDayRest(data, today) && isDayCompleted(data, dateToDayName(today), today)) {
    for (let i = 1; i <= 14; i += 1) {
      const candidate = addDays(today, i);
      if (!isDayRest(data, candidate)) return candidate;
    }
  }
  return today;
}

function isDayRest(data, isoDate) {
  return getUsableExercises(data, dateToDayName(isoDate)).list.length === 0;
}

function activeTrainingDay(data) {
  return dateToDayName(activeTrainingDate(data));
}'''
          s, n = status_re.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Calendar helper block not found')

          # 2) WorkoutScreen receives a calendar date while retaining weekday plan keys.
          old = '''  const activePlan =\n    PLAN_TEMPLATES[data.activePlanId] || PLAN_TEMPLATES.beginner;\n  const dayTitle = ar\n    ? activePlan.schedule[selectedDay].titleAr\n    : activePlan.schedule[selectedDay].title;\n  const { list: exercises, lockedCount } = getUsableExercises(\n    data,\n    selectedDay,\n  );\n  const activeDay = activeTrainingDay(data);\n  const today = dateKey(0);\n  const log = data.logs[today] || {};'''
          new = '''  const activePlan =\n    PLAN_TEMPLATES[data.activePlanId] || PLAN_TEMPLATES.beginner;\n  const selectedDate = selectedDayDate || dateKey(0);\n  const selectedWeekday = dateToDayName(selectedDate);\n  const dayTitle = ar\n    ? activePlan.schedule[selectedWeekday].titleAr\n    : activePlan.schedule[selectedWeekday].title;\n  const { list: exercises, lockedCount } = getUsableExercises(\n    data,\n    selectedWeekday,\n  );\n  const activeDay = activeTrainingDate(data);\n  const today = selectedDate;\n  const log = data.logs[today] || {};'''
          if old not in s:
              raise SystemExit('WorkoutScreen header not found')
          s = s.replace(old, new, 1)
          s = s.replace('''  selectedDay,\n  setSelectedDay,\n  showToast,''','''  selectedDay,\n  selectedDayDate,\n  setSelectedDay,\n  setSelectedDayDate,\n  showToast,''',1)

          # 3) Replace the top DAYS.map selector with a dynamic real-date strip.
          map_re = re.compile(r'\{DAYS\.map\(\(d, i\) => \{.*?\n          \}\)\}', re.S)
          map_new = r'''{workoutDateRange(dateKey(0)).map((date) => {
            const d = dateToDayName(date);
            const isSelected = date === selectedDate;
            const isToday = date === dateKey(0);
            const isActiveDay = date === activeDay;
            const status = dayStatus(data, date);
            const isDone = status === "done";
            const isMissed = status === "missed";
            const isRest = status === "rest";
            const bg = isSelected
              ? isDone || isMissed
                ? isDone ? C.green : C.danger
                : C.green
              : isDone
              ? C.green
              : isMissed
              ? C.dangerSoft
              : C.card2;
            const fg = isSelected
              ? isDone || isMissed ? "#fff" : C.onAccent
              : isDone
              ? C.onAccent
              : isMissed
              ? C.danger
              : isToday || isActiveDay
              ? C.green
              : C.text;
            const dt = new Date(date + "T00:00:00");
            return (
              <button
                key={date}
                onClick={() => { setSelectedDay(d); setSelectedDayDate(date); }}
                style={{
                  minWidth: 44,
                  padding: "10px 0",
                  borderRadius: 12,
                  cursor: "pointer",
                  border: (isToday || isActiveDay) && !isSelected
                    ? `1px solid ${C.green}`
                    : "1px solid transparent",
                  background: bg,
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  justifyContent: "center",
                  gap: 4,
                  position: "relative",
                }}
              >
                <span style={{ fontSize: 11, color: isSelected && (isDone || isMissed) ? "#fff" : isSelected ? C.onAccent : isDone ? C.green : isMissed ? C.danger : C.sub, fontWeight: 600 }}>
                  {ar ? DAY_LABELS_AR[d] : d}
                </span>
                <span style={{ fontSize: 13, color: fg, fontWeight: 700 }}>{dt.getDate()}</span>
                {isDone && <Check size={12} color={isSelected ? "#fff" : C.onAccent} strokeWidth={3} style={{ position: "absolute", top: 2, right: 5 }} />}
                {isMissed && <span style={{ fontSize: 9, color: fg }}>!</span>}
                {isRest && !isDone && !isMissed && <span style={{ fontSize: 8, color: C.sub2 }}>Rest</span>}
              </button>
            );
          })}'''
          s, n = map_re.subn(map_new, s, count=1)
          if n != 1:
              raise SystemExit('Workout day strip not found')

          # 4) Pass the selected calendar date into exercise navigation.
          s = s.replace('go("exercise", { exerciseId: ex.id, day: selectedDay })','go("exercise", { exerciseId: ex.id, day: selectedWeekday, date: selectedDate })')
          s = s.replace('exerciseId: exercises[0].id,\n                  day: selectedDay,','exerciseId: (exercises.find((e) => !log[e.id]?.finished && !(log[e.id]?.sets || []).some((s) => s.done)) || exercises[0]).id,\n                  day: selectedWeekday,\n                  date: selectedDate,')

          # 5) ExerciseScreen must read/write the selected calendar date, not always today.
          s = s.replace('''  day,\n  showToast,''','''  day,\n  date,\n  showToast,''',1)
          s = s.replace('''  const today = dateKey(0);\n\n  const existingLog = data.logs[today]?.[exerciseId];''','''  const today = date ? String(date).slice(0, 10) : dateKey(0);\n\n  const existingLog = data.logs[today]?.[exerciseId];''',1)

          # 6) Root keeps weekday compatibility but tracks the actual selected date.
          s = s.replace('''  const [selectedDay, setSelectedDay] = useState(DAYS[todayIdx]);\n  const [navHistory, setNavHistory]''','''  const [selectedDay, setSelectedDay] = useState(DAYS[todayIdx]);\n  const [selectedDayDate, setSelectedDayDate] = useState(dateKey(0));\n  const [navHistory, setNavHistory]''',1)
          s = s.replace('''  const activeDay = loaded ? activeTrainingDay(data) : DAYS[todayIdx];\n  useEffect(() => {\n    setSelectedDay(activeDay);\n  }, [activeDay]);''','''  const activeDate = loaded ? activeTrainingDate(data) : dateKey(0);\n  const activeDay = dateToDayName(activeDate);\n  useEffect(() => {\n    setSelectedDay(activeDay);\n    setSelectedDayDate(dateKey(0));\n  }, [activeDay, activeDate]);''',1)

          # 7) WorkoutScreen invocation.
          s = s.replace('''        selectedDay={selectedDay}\n        setSelectedDay={setSelectedDay}''','''        selectedDay={selectedDay}\n        selectedDayDate={selectedDayDate}\n        setSelectedDay={setSelectedDay}\n        setSelectedDayDate={setSelectedDayDate}''',1)
          # ExerciseScreen invocation.
          s = s.replace('''        day={params.day}\n        showToast={showToast}''','''        day={params.day}\n        date={params.date}\n        showToast={showToast}''',1)

          # 8) Forgot-password copy with Gmail Spam/Junk guidance.
          s = s.replace('''شوف إيميلك هيوصلك رابط لإعادة تعيين كلمة السر.''','''شوف إيميلك هيوصلك رابط لإعادة تعيين كلمة السر. لو مش لاقيه في الوارد، دور في Spam / الرسائل غير المرغوب فيها في Gmail.''',1)
          s = s.replace('''Check your email for a link to reset your password.''','''Check your email for a password reset link. If you don't see it in your inbox, check Gmail Spam / Junk.''',1)

          # 9) Small bottom-only subscription management link for active subscribers.
          s = s.replace('''{ar ? "إدارة الاشتراك" : "Manage Subscription"}''','''{ar ? "إلغاء الاشتراك" : "Cancel Subscription"}''',1)
          s = s.replace('''fontSize: 12,\n                textDecoration: "underline",''','''fontSize: 10.5,\n                textDecoration: "underline",''',1)

          # 10) Remove this temporary workflow after the patch has been verified.
          p.write_text(s, encoding='utf-8')
          print('App.jsx patch complete')

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patched app and remove workflow
        run: |
          rm -f .github/workflows/apply-workout-final-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/apply-workout-final-pass.yml
          git commit -m 'fix(workout): dynamic calendar dates and final UI details'
          git push
