<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53e3e" />
      <stop offset="100%" stop-color="#c53030" />
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#718096" />
    </linearGradient>
    <linearGradient id="plates" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- smith machine rails -->
  <rect x="18" y="20" width="8" height="150" rx="4" fill="#718096" />
  <rect x="174" y="20" width="8" height="150" rx="4" fill="#718096" />
  <!-- barbell on shoulders -->
  <rect x="30" y="52" width="140" height="7" rx="3.5" fill="url(#bar)" />
  <rect x="34" y="40" width="11" height="30" rx="2" fill="url(#plates)" />
  <rect x="48" y="40" width="11" height="30" rx="2" fill="url(#plates)" />
  <rect x="141" y="40" width="11" height="30" rx="2" fill="url(#plates)" />
  <rect x="155" y="40" width="11" height="30" rx="2" fill="url(#plates)" />
  <!-- body squatting -->
  <rect x="78" y="60" width="44" height="52" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="100" cy="46" r="15" fill="url(#skin)" />
  <!-- thighs (bent) -->
  <path
    d="M82 112 L68 118 L60 140"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M118 112 L132 118 L140 140"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- shins -->
  <path
    d="M60 140 L60 168"
    fill="none"
    stroke="url(#skin)"
    stroke-width="13"
    stroke-linecap="round"
  />
  <path
    d="M140 140 L140 168"
    fill="none"
    stroke="url(#skin)"
    stroke-width="13"
    stroke-linecap="round"
  />
  <!-- feet -->
  <rect x="48" y="168" width="28" height="10" rx="4" fill="#2d3748" />
  <rect x="132" y="168" width="28" height="10" rx="4" fill="#2d3748" />
  <!-- arms on bar -->
  <path
    d="M84 64 L70 56 L60 56"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M116 64 L130 56 L140 56"
    fill="none"
    stroke="url(#shirt)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="60" cy="56" r="7" fill="url(#skin)" />
  <circle cx="140" cy="56" r="7" fill="url(#skin)" />
</svg>
