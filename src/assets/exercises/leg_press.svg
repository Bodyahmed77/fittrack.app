<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0" />
      <stop offset="100%" stop-color="#f0b27a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3182ce" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>
  <!-- leg press seat -->
  <rect x="30" y="40" width="10" height="130" rx="5" fill="#718096" />
  <rect x="160" y="40" width="10" height="130" rx="5" fill="#718096" />
  <rect x="38" y="34" width="124" height="10" rx="5" fill="url(#machine)" />
  <!-- body seated leaning back -->
  <rect x="70" y="70" width="48" height="56" rx="12" fill="url(#shirt)" />
  <!-- head -->
  <circle cx="94" cy="54" r="15" fill="url(#skin)" />
  <!-- legs pressing platform -->
  <path
    d="M74 124 L64 118 L58 100"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M114 124 L138 118 L142 100"
    fill="none"
    stroke="url(#shorts)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- shins -->
  <rect x="50" y="88" width="12" height="26" rx="4" fill="url(#skin)" />
  <rect x="138" y="88" width="12" height="26" rx="4" fill="url(#skin)" />
  <!-- platform -->
  <rect x="40" y="80" width="120" height="10" rx="5" fill="url(#machine)" />
  <!-- feet on platform -->
  <rect x="46" y="60" width="20" height="22" rx="4" fill="#2d3748" />
  <rect x="136" y="60" width="20" height="22" rx="4" fill="#2d3748" />
</svg>
