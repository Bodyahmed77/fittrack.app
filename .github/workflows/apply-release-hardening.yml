name: Apply Release Hardening Patch

on:
  push:
    paths:
      - scripts/release-hardening-20260812.py
      - .github/workflows/apply-release-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/release-hardening-20260812.py

      - name: Commit patched sources and remove temporary tooling
        run: |
          rm -f scripts/release-hardening-20260812.py
          rm -f .github/workflows/apply-release-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/aiCoach.js
          git add -u scripts/release-hardening-20260812.py .github/workflows/apply-release-hardening.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: harden notifications keyboard nutrition and paywall flow"
          git push
