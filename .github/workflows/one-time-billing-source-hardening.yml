name: Canonical Billing Source Hardening

on:
  push:
    branches: [fix/verified-release-artifact]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch canonical billing source and remove self
        shell: python
        run: |
          from pathlib import Path
          import re
          
          app_path = Path('src/App.jsx')
          app = app_path.read_text(encoding='utf-8')
          
          old_message = '''        const billingMessage = String(
          billingErr.message ||
          diagnosticMessage ||
          (result?.pending
            ? "Google Play returned a pending purchase"
            : "Google Play did not complete the purchase"),
        );'''
          new_message = '''        const billingMessage = String(
          diagnosticMessage ||
          billingErr.message ||
          (result?.pending
            ? "Google Play returned a pending purchase"
            : "Google Play did not complete the purchase"),
        );'''
          if old_message in app:
              app = app.replace(old_message, new_message, 1)
          
          old_last_error = '''            window.__fiftyFitLastBillingError = {
              code: billingCode,
              message: billingMessage,
              productId: billingProduct,
              pending: !!result?.pending,
              cancelled: !!result?.cancelled,
              subResponseCode: billingErr.subResponseCode || null,
              updatedAt: new Date().toISOString(),
            };'''
          new_last_error = '''            window.__fiftyFitLastBillingError = {
              code: billingCode,
              responseCode: diagnosticCode,
              responseName: diagnosticName,
              message: billingMessage,
              nativeMessage: diagnosticMessage,
              productId: billingProduct,
              basePlanId: diagnostics.selectedBasePlanId || diagnostics.basePlanId || null,
              offerId: diagnostics.selectedOfferId || diagnostics.offerId || null,
              offerTokenPresent: diagnostics.offerTokenPresent ?? null,
              stage: diagnostics.stage || null,
              pending: !!result?.pending,
              cancelled: !!result?.cancelled,
              subResponseCode: billingErr.subResponseCode || diagnostics.subResponseCode || null,
              updatedAt: new Date().toISOString(),
            };'''
          if old_last_error in app:
              app = app.replace(old_last_error, new_last_error, 1)
          
          required_app = [
              'const shouldUnlock = result?.success === true;',
              'diagnosticCode',
              'diagnosticName',
              'diagnosticMessage',
              'Google Play code:',
          ]
          missing = [x for x in required_app if x not in app]
          if missing:
              raise SystemExit('App.jsx hardening precondition failed: ' + ', '.join(missing))
          app_path.write_text(app, encoding='utf-8')
          
          billing_path = Path('src/billing.js')
          billing = billing_path.read_text(encoding='utf-8')
          
          marker = 'function billingResponseName(code) {'
          helper = '''function extractBillingResponseCode(value) {
  if (value == null) return null;
  if (typeof value === "number" && Number.isFinite(value)) return value;
  const text = String(value);
  if (/^-?\\d+$/.test(text.trim())) return Number(text.trim());
  const match = text.match(/BillingResponseCode\\s*[=:]\\s*(-?\\d+)/i);
  return match ? Number(match[1]) : null;
}

'''
          if 'function extractBillingResponseCode(value)' not in billing:
              if marker not in billing:
                  raise SystemExit('billing.js insertion point not found')
              billing = billing.replace(marker, helper + marker, 1)
          
          old_err = '''  const err = new Error(message);
  err.code = String(code);
  err.responseCode =
    source?.responseCode ?? source?.billingResponseCode ?? e?.responseCode ?? null;
  err.nativeCode =
    source?.code ??
    source?.responseCode ??
    source?.billingResponseCode ??
    e?.nativeCode ??
    null;'''
          new_err = '''  const err = new Error(message);
  const responseCode = extractBillingResponseCode(
    source?.responseCode ??
    source?.billingResponseCode ??
    source?.code ??
    e?.responseCode ??
    e?.nativeCode ??
    message,
  );
  err.code = String(code);
  err.responseCode = responseCode;
  err.nativeCode = responseCode ?? source?.code ?? e?.nativeCode ?? null;'''
          if old_err in billing:
              billing = billing.replace(old_err, new_err, 1)
          
          required_billing = [
              'extractBillingResponseCode',
              'err.nativeMessage',
              'writeBillingDiagnostics',
              'launchBillingFlow',
          ]
          missing = [x for x in required_billing if x not in billing]
          if missing:
              raise SystemExit('billing.js hardening failed: ' + ', '.join(missing))
          billing_path.write_text(billing, encoding='utf-8')
          
          wf = Path('.github/workflows/one-time-billing-source-hardening.yml')
          import subprocess
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'src/App.jsx', 'src/billing.js'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              print('Canonical billing source already hardened; no source commit required.')
          else:
              subprocess.run(['git', 'commit', '-m', 'fix: make billing diagnostics authoritative at runtime'], check=True)
          subprocess.run(['git', 'rm', str(wf)], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore: remove one-time billing source hardening workflow'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:fix/verified-release-artifact'], check=True)
